<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Nostalgia Pro &mdash; Make your own list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101219; --bg2:#171a23; --panel:#1d2029;
    --text:#eceae2; --dim:#8e93a2; --line:#2c3040; --hot:#ff4b3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(90,110,180,.14), transparent 62%),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  .wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 22px 90px}
  header{padding:44px 0 0}
  .wordmark{font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0 0 22px}
  h1{font-family:"Press Start 2P",monospace;font-size:clamp(15px,3vw,26px);line-height:1.55;margin:0}
  .standfirst{color:var(--dim);font-size:15px;margin:14px 0 0;max-width:60ch}
  .navrow{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
  .navbtn{
    display:inline-flex;align-items:center;border:2px solid var(--line);color:var(--dim);
    text-decoration:none;font-family:"Silkscreen",monospace;font-size:11px;
    letter-spacing:.05em;padding:9px 14px;border-radius:2px;
  }
  .navbtn:hover{border-color:var(--hot);color:var(--hot)}
  .navbtn.here{border-color:var(--hot);background:var(--hot);color:#12070a}

  .pick{margin:32px 0 0}
  .pick label{font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.1em;color:var(--dim);display:block;margin-bottom:9px}
  select{
    width:100%;background:var(--bg2);color:var(--text);border:2px solid var(--line);
    border-radius:2px;padding:13px;font:inherit;font-size:15px;cursor:pointer;
  }
  select:focus{outline:none;border-color:var(--hot)}

  ol.board{list-style:none;margin:26px 0 0;padding:0}
  ol.board li{
    display:flex;align-items:center;gap:11px;background:var(--bg2);
    border:1px solid var(--line);border-left:4px solid var(--hot);
    border-radius:2px;padding:11px 12px;margin-bottom:7px;
  }
  .pos{flex:0 0 30px;font-family:"Press Start 2P",monospace;font-size:12px;color:var(--dim)}
  .nm{flex:1;min-width:0;font-size:15px}
  .nm em{font-style:normal;display:block;font-family:"Silkscreen",monospace;font-size:9px;letter-spacing:.05em;color:var(--dim);margin-top:4px}
  .mv{display:flex;gap:5px}
  .mv button{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    width:32px;height:32px;border-radius:2px;cursor:pointer;font-size:15px;line-height:1;
  }
  .mv button:hover:not(:disabled){border-color:var(--hot);color:var(--hot)}
  .mv button:disabled{opacity:.25;cursor:default}

  .go{
    width:100%;margin:20px 0 0;font-family:"Silkscreen",monospace;font-size:12px;
    letter-spacing:.06em;background:var(--hot);border:2px solid var(--hot);color:#12070a;
    padding:15px;border-radius:2px;cursor:pointer;
  }
  .ghost{background:transparent;color:var(--dim);border-color:var(--line);margin-top:9px}
  .ghost:hover{border-color:var(--hot);color:var(--hot)}

  .result{display:none;margin:34px 0 0;background:var(--bg2);border:2px solid var(--hot);border-radius:2px;padding:24px}
  .result.on{display:block}
  .score{font-family:"Press Start 2P",monospace;font-size:34px;color:var(--hot);margin:0}
  .score span{display:block;font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.09em;color:var(--dim);margin-top:9px}
  .verdict{margin:18px 0 0;font-size:15.5px}
  .cmp{margin:22px 0 0;border-top:1px solid var(--line);padding-top:16px}
  .crow{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:14.5px}
  .crow b{flex:0 0 54px;font-family:"Silkscreen",monospace;font-weight:700;font-size:10px;color:var(--dim)}
  .crow .g{flex:1;min-width:0}
  .crow .d{flex:none;font-family:"Silkscreen",monospace;font-size:10px;white-space:nowrap}
  .d.same{color:#3fbf6a}.d.near{color:var(--dim)}.d.far{color:var(--hot)}
  .vs{margin:28px 0 0}
  .roundlbl{
    font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.1em;
    color:var(--dim);text-align:center;margin:0 0 16px;
  }
  .pair{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
  .side{
    flex:1 1 200px;background:var(--bg2);border:2px solid var(--line);border-radius:2px;
    padding:22px 18px;cursor:pointer;text-align:center;font:inherit;color:var(--text);
  }
  .side:hover{border-color:var(--hot)}
  .side b{display:block;font-size:17px;font-weight:500;line-height:1.4}
  .side em{
    font-style:normal;display:block;font-family:"Silkscreen",monospace;font-size:9px;
    letter-spacing:.05em;color:var(--dim);margin-top:10px;
  }
  .orline{
    align-self:center;font-family:"Press Start 2P",monospace;font-size:12px;color:var(--hot);
  }
  .champ{font-family:"Press Start 2P",monospace;font-size:19px;line-height:1.5;margin:0;color:var(--hot)}
  .note{font-size:13px;color:var(--dim);margin-top:28px;max-width:62ch}
</style>
</head>

<div class="wrap">

<header>
  <p class="wordmark">The Nostalgia Pro</p>
  <h1>Make your own list</h1>
  <p class="standfirst">Fight 16 random games off my shelf down to one winner, or put one of my rankings in your order and see how far off we are.</p>
  <div class="navrow">
    <a class="navbtn" href="index.html">The shelf</a>
    <a class="navbtn" href="reviews.html">Reviews</a>
    <a class="navbtn" href="lists.html">Lists</a>
    <a class="navbtn here" href="#">Your list</a>

    <a class="navbtn" href="stats.html">The numbers</a>
  </div>
</header>

<div class="pick">
  <label for="listPick">Pick a list</label>
  <select id="listPick"></select>
</div>

<div class="vs" id="vs" style="display:none"></div>
<ol class="board" id="board"></ol>
<button class="go" id="compare">Compare with my order</button>
<button class="go ghost" id="shuffle">Shuffle and start over</button>

<div class="result" id="result"></div>

<p class="note">Your order stays in your browser. Nothing is sent anywhere.</p>

</div>

const sel = document.getElementById("listPick");
sel.innerHTML =
  `<option value="bracket">Everything on the shelf &mdash; knockout bracket</option>` +
  LISTS.map((l,i) => `<option value="${i}">${l.title}</option>`).join("");

let mine = [], yours = [];
let bracket = null;

function startBracket(){
  const pool = ALLGAMES.slice().sort(() => Math.random() - 0.5).slice(0, 16);
  bracket = { round: pool, next: [], n: 1, picks: [] };
  document.getElementById("board").innerHTML = "";
  document.getElementById("result").classList.remove("on");
  document.getElementById("compare").style.display = "none";
  document.getElementById("vs").style.display = "";
  document.getElementById("shuffle").textContent = "Start a new bracket";
  drawMatch();
}

const ROUNDNAME = {16:"Round of 16", 8:"Quarter final", 4:"Semi final", 2:"Final"};

function drawMatch(){
  const b = bracket;
  if (b.round.length === 1) return finishBracket(b.round[0]);
  if (b.round.length < 2) { b.round = b.next.concat(b.round); b.next = []; return drawMatch(); }
  const a = b.round[0], c = b.round[1];
  const size = b.round.length + b.next.length;
  document.getElementById("vs").innerHTML =
    `<p class="roundlbl">${ROUNDNAME[size] || "Round of " + size} &middot; which one wins?</p>
     <div class="pair">
       <button class="side" data-side="0"><b>${a[0]}</b><em>${a[1]}</em></button>
       <span class="orline">VS</span>
       <button class="side" data-side="1"><b>${c[0]}</b><em>${c[1]}</em></button>
     </div>`;
}

document.getElementById("vs").addEventListener("click", e => {
  const b = e.target.closest(".side");
  if (!b || !bracket || bracket.round.length < 2) return;
  const win = bracket.round[+b.dataset.side];
  const lose = bracket.round[1 - +b.dataset.side];
  bracket.picks.push([win, lose]);
  bracket.next.push(win);
  bracket.round = bracket.round.slice(2);
  drawMatch();
});

function finishBracket(winner){
  const vs = document.getElementById("vs");
  vs.innerHTML = "";
  vs.style.display = "none";
  const beaten = bracket.picks.filter(p => p[0][0] === winner[0]).map(p => p[1]);
  document.getElementById("result").className = "result on";
  document.getElementById("result").innerHTML =
    `<p class="roundlbl" style="text-align:left">Your winner</p>
     <p class="champ">${winner[0]}</p>
     <p class="verdict" style="color:var(--dim);font-size:14px">${winner[1]}</p>
     <div class="cmp">${beaten.map((g,i) =>
       `<div class="crow"><b>BEAT</b><span class="g">${g[0]}</span>
        <span class="d near">${g[1]}</span></div>`).join("")}</div>`;
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
}

function load(i){
  if (i === "bracket") return startBracket();
  bracket = null;
  document.getElementById("vs").style.display = "none";
  document.getElementById("compare").style.display = "";
  document.getElementById("shuffle").textContent = "Shuffle and start over";
  mine = LISTS[i].picks.slice();
  yours = mine.slice().sort(() => Math.random() - 0.5);
  document.getElementById("result").classList.remove("on");
  draw();
}

function draw(){
  document.getElementById("board").innerHTML = yours.map(([t,c],i) =>
    `<li>
      <span class="pos">${i+1}</span>
      <span class="nm">${t}<em>${c}</em></span>
      <span class="mv">
        <button type="button" data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">&#9650;</button>
        <button type="button" data-dn="${i}" ${i===yours.length-1?"disabled":""} aria-label="Move down">&#9660;</button>
      </span>
    </li>`).join("");
}

document.getElementById("board").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const up = b.dataset.up, dn = b.dataset.dn;
  if (up !== undefined) { const i = +up; [yours[i-1], yours[i]] = [yours[i], yours[i-1]]; }
  if (dn !== undefined) { const i = +dn; [yours[i+1], yours[i]] = [yours[i], yours[i+1]]; }
  draw();
});

document.getElementById("compare").addEventListener("click", () => {
  const n = mine.length;
  const rows = yours.map(([t,c],i) => {
    const j = mine.findIndex(p => p[0] === t);
    return { t, c, you: i+1, me: j+1, gap: Math.abs(i-j) };
  });
  const worst = Math.floor(n*n/2);                    /* the most disagreement possible */
  const total = rows.reduce((a,r) => a + r.gap, 0);
  const pct = Math.max(0, Math.round((1 - total/worst) * 100));
  const exact = rows.filter(r => r.gap === 0).length;
  const biggest = rows.slice().sort((a,b) => b.gap - a.gap)[0];

  const verdict =
    pct >= 85 ? "We'd have nothing to argue about." :
    pct >= 60 ? "Close enough. A couple of real disagreements in there." :
    pct >= 35 ? "We are not going to see eye to eye on this one." :
                "You and I should not be allowed to talk about this list.";

  document.getElementById("result").className = "result on";
  document.getElementById("result").innerHTML =
    `<p class="score">${pct}%<span>agreement with my order</span></p>
     <p class="verdict">${verdict} You matched ${exact} of ${n} exactly, and we're furthest apart on
       <b>${biggest.t}</b> &mdash; you had it ${biggest.you}, I have it ${biggest.me}.</p>
     <div class="cmp">${rows.slice().sort((a,b) => a.me - b.me).map(r =>
        `<div class="crow">
           <b>ME ${r.me}</b>
           <span class="g">${r.t}</span>
           <span class="d ${r.gap===0?"same":r.gap<=2?"near":"far"}">YOU ${r.you}</span>
         </div>`).join("")}</div>`;
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
});

document.getElementById("shuffle").addEventListener("click", () => load(val()));
const val = () => sel.value === "bracket" ? "bracket" : +sel.value;
sel.addEventListener("change", () => load(val()));
load("bracket");
</script>
