<title>Fourth and Collect | Nostalgia Pro Arcade</title>
<link rel="canonical" href="https://thenostalgiapro.com/arcade/fourth-and-collect/">

<link rel="preload" href="np_games_script.png" as="image">

<script>
/* GoatCounter page view, same counter as /play/ (code "nostalgiapro"): one small image request, no cookies, no third-party script. */
(function(){try{if(!/^https?:$/.test(location.protocol))return;var i=new Image();i.referrerPolicy="no-referrer";i.src="https://nostalgiapro.goatcounter.com/count?p="+encodeURIComponent(location.pathname)+"&t="+encodeURIComponent(document.title)+"&r="+encodeURIComponent(document.referrer||"")+"&rnd="+Math.random().toString(36).slice(2);}catch(e){}})();
</script>
</head>
<body>
<noscript><p style="padding:24px;font-family:monospace;color:#eceae2;background:#101219">Fourth and Collect needs JavaScript turned on. <a href="../" style="color:#3ff0ff">Back to the arcade</a></p></noscript>
