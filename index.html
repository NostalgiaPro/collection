<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Nostalgia Pro — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e2e0d7;
    --panel:#d5d0c3;
    --ink:#17150f;
    --muted:#6b665b;
    --line:#b8b2a3;
    --accent:#8a251c;
    --shelf:#17150f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---- masthead ---- */
  header{padding:56px 0 0}
  .brand{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-weight:700;
    font-size:clamp(38px,6vw,68px);
    line-height:.95;
    letter-spacing:-.02em;
    margin:0;
  }
  .standfirst{
    max-width:52ch;
    margin:16px 0 0;
    color:var(--muted);
    font-size:17px;
  }

  /* ---- search ---- */
  .searchbar{margin:32px 0 0;display:flex;gap:10px;flex-wrap:wrap}
  #q{
    flex:1 1 380px;
    min-width:0;
    background:#eeece5;
    border:2px solid var(--ink);
    color:var(--ink);
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:clamp(20px,3vw,28px);
    font-weight:600;
    padding:14px 16px;
    border-radius:3px;
  }
  #q::placeholder{color:#a49e90;font-weight:400}
  #q:focus{outline:3px solid var(--accent);outline-offset:2px}
  .btn{
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    font-family:"IBM Plex Sans",sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px 20px;
    border-radius:3px;
    cursor:pointer;
  }
  .btn:hover{background:var(--accent);border-color:var(--accent)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---- verdict ---- */
  #verdict{
    margin:22px 0 0;
    padding:18px 20px;
    border:2px solid var(--ink);
    background:#eeece5;
    border-radius:3px;
    display:none;
  }
  #verdict.on{display:block}
  #verdict.miss{border-color:var(--line);background:transparent}
  .vhead{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px;
  }
  .vhead.no{color:var(--muted)}
  .vlist{margin:8px 0 0;padding:0;list-style:none}
  .vlist li{padding:5px 0;border-top:1px solid var(--line)}

  /* ---- tallies ---- */
  .tallies{
    display:flex;flex-wrap:wrap;gap:0 34px;
    margin:34px 0 0;padding:14px 0;
    border-top:3px solid var(--ink);
    border-bottom:1px solid var(--line);
  }
  .tally{display:flex;align-items:baseline;gap:8px}
  .tally b{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:30px;font-weight:700;line-height:1;
  }
  .tally span{color:var(--muted);font-size:14px}

  /* ---- filters ---- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;align-items:center}
  .chip{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:500;
    padding:5px 11px;border-radius:100px;cursor:pointer;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- body layout ---- */
  .cols{display:grid;grid-template-columns:210px 1fr;gap:44px;margin:40px 0 0;align-items:start}
  nav{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
  nav ul{list-style:none;margin:0;padding:0}
  nav a{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    color:var(--muted);text-decoration:none;font-size:14px;
    padding:5px 0;border-bottom:1px solid rgba(184,178,163,.5);
  }
  nav a:hover,nav a:focus-visible{color:var(--accent)}
  nav a em{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px}

  section.shelf{margin:0 0 46px;scroll-margin-top:16px}
  .shelfhead{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    border-bottom:4px solid var(--shelf);padding-bottom:6px;margin-bottom:2px;
  }
  .shelfhead h2{
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;
  }
  .shelfhead p{margin:0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

  ol.games{list-style:none;margin:0;padding:0}
  ol.games li{
    display:flex;gap:12px;align-items:baseline;
    padding:7px 4px;border-bottom:1px solid rgba(184,178,163,.55);
  }
  ol.games li:hover{background:rgba(255,255,255,.4)}
  .mark{flex:none;width:11px;height:11px;margin-top:1px;border:1.5px solid var(--ink)}
  .mark.cib{background:var(--ink)}
  .mark.sealed{background:var(--accent);border-color:var(--accent)}
  .mark.part{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
  .title{
    flex:1 1 auto;
    font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:18px;font-weight:600;line-height:1.25;
  }
  .cond{flex:none;color:var(--muted);font-size:12.5px;white-space:nowrap}

  .empty{padding:40px 0;color:var(--muted)}
  footer{
    margin:60px 0 0;padding:22px 0 70px;
    border-top:3px solid var(--ink);color:var(--muted);font-size:13.5px;
  }
  .legend{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 10px}
  .legend span{display:flex;align-items:center;gap:7px}

  @media (max-width:560px){
    .tallies{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
    .tally{gap:6px}
    .tally b{font-size:26px}
    .searchbar .btn{flex:1 1 100%}
  }
  @media (max-width:820px){
    .cols{grid-template-columns:1fr;gap:24px}
    nav{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:8px}
    nav ul{display:flex;flex-wrap:wrap;gap:6px}
    nav a{border:1px solid var(--line);border-radius:100px;padding:4px 10px;font-size:13px}
    header{padding-top:32px}
  }
  @media (prefers-reduced-motion:no-preference){
    #verdict.on{animation:pop .18s ease-out}
    @keyframes pop{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="brand">Is it on<br>the shelf?</h1>
    <p class="standfirst">Every physical game I own, sorted by system, marked by condition. Type a title and find out.</p>

    <div class="searchbar">
      <input id="q" type="search" placeholder="Turtles in Time" autocomplete="off" spellcheck="false" aria-label="Search the collection">
      <button class="btn" id="lucky" type="button">Pull a random game</button>
    </div>

    <div id="verdict" role="status" aria-live="polite"></div>

    <div class="tallies" id="tallies"></div>

    <div class="filters" id="filters"></div>
  </header>

  <div class="cols">
    <nav aria-label="Systems"><ul id="rail"></ul></nav>
    <main id="results"></main>
  </div>

  <footer>
    <div class="legend">
      <span><i class="mark cib"></i> Complete in box</span>
      <span><i class="mark"></i> Loose</span>
      <span><i class="mark part"></i> Missing a piece</span>
      <span><i class="mark sealed"></i> Sealed</span>
    </div>
    <p>The Nostalgia Pro. 831 games, from my Gameye export of September 3, 2026.</p>
  </footer>

</div>

/* ---------- parse ---------- */
const fold = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const systems = [];
let cur = null;
for (const rawLine of RAW.split("\n")) {
  const line = rawLine.trim();
  if (!line) continue;
  if (line.startsWith("## ")) {
    cur = { name: line.slice(3).trim(), id: line.slice(3).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-"), games: [] };
    systems.push(cur);
    continue;
  }
  if (!cur) continue;
  const m = line.match(/^(.*)\s\(([^()]*)\)$/);
  const title = m ? m[1].trim() : line;
  const cond = m ? m[2].trim() : "unknown";
  const c = cond.toLowerCase();
  let cls = "";
  if (c === "cib" || c === "cib+") cls = "cib";
  else if (c === "sealed") cls = "sealed";
  else if (c.startsWith("missing") || c === "partial" || c === "manual only") cls = "part";
  cur.games.push({ title, cond, cls, key: fold(title), system: cur.name });
}

const all = systems.flatMap(s => s.games);
const total = all.length;
const cibCount = all.filter(g => g.cls === "cib" || g.cls === "sealed").length;
const looseCount = all.filter(g => g.cls === "").length;
const sourceNote = "831 games, from my 2026-09-03 Gameye export.";

/* ---------- state ---------- */
let query = "";
let condFilter = "all";

/* ---------- tallies ---------- */
document.getElementById("tallies").innerHTML = [
  [total, "games"],
  [systems.length, "systems"],
  [cibCount, "complete in box"],
  [looseCount, "loose"]
].map(([n, l]) => `<div class="tally"><b>${n}</b><span>${l}</span></div>`).join("");

/* ---------- filters ---------- */
const FILTERS = [["all","Everything"],["cib","Complete in box"],["","Loose"],["part","Missing a piece"]];
const filterBox = document.getElementById("filters");
filterBox.innerHTML = FILTERS.map(([v,l]) =>
  `<button class="chip" type="button" data-cond="${v}" aria-pressed="${v==="all"}">${l}</button>`).join("");
filterBox.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  condFilter = b.dataset.cond;
  filterBox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});

/* ---------- rail ---------- */
document.getElementById("rail").innerHTML = systems
  .map(s => `<li><a href="#${s.id}">${s.name}<em>${s.games.length}</em></a></li>`).join("");

/* ---------- render ---------- */
const results = document.getElementById("results");
const verdict = document.getElementById("verdict");

function matches(g) {
  if (condFilter !== "all" && g.cls !== condFilter) return false;
  if (query && !g.key.includes(query)) return false;
  return true;
}

function row(g) {
  return `<li><i class="mark ${g.cls}"></i><span class="title">${esc(g.title)}</span><span class="cond">${esc(g.cond)}</span></li>`;
}

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render() {
  let shown = 0;
  const html = systems.map(s => {
    const hits = s.games.filter(matches);
    if (!hits.length) return "";
    shown += hits.length;
    return `<section class="shelf" id="${s.id}">
      <div class="shelfhead"><h2>${esc(s.name)}</h2><p>${hits.length} of ${s.games.length}</p></div>
      <ol class="games">${hits.map(row).join("")}</ol>
    </section>`;
  }).join("");

  results.innerHTML = html || `<p class="empty">Nothing on the shelf matches that.</p>`;
  updateVerdict(shown);
}

function updateVerdict(shown) {
  if (!query) { verdict.className = ""; verdict.innerHTML = ""; return; }
  const hits = all.filter(g => g.key.includes(query));
  if (!hits.length) {
    verdict.className = "on miss";
    verdict.innerHTML = `<p class="vhead no">Not on the shelf.</p><p style="margin:0;color:var(--muted)">No match for "${esc(query)}".</p>`;
    return;
  }
  verdict.className = "on";
  const head = hits.length === 1 ? "Got it." : `Got it, ${hits.length} copies.`;
  verdict.innerHTML = `<p class="vhead">${head}</p><ul class="vlist">` +
    hits.slice(0, 8).map(g => `<li><strong>${esc(g.title)}</strong> — ${esc(g.system)}, ${esc(g.cond)}</li>`).join("") +
    (hits.length > 8 ? `<li>and ${hits.length - 8} more below</li>` : "") + `</ul>`;
}

/* ---------- events ---------- */
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => { query = fold(qEl.value.trim()); render(); });

document.getElementById("lucky").addEventListener("click", () => {
  const g = all[Math.floor(Math.random() * all.length)];
  qEl.value = "";
  query = "";
  condFilter = "all";
  filterBox.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.cond === "all"));
  render();
  verdict.className = "on";
  verdict.innerHTML = `<p class="vhead">${esc(g.title)}</p><p style="margin:0;color:var(--muted)">${esc(g.system)} — ${esc(g.cond)}</p>`;
});

render();
</script>
