<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --panel:#1d1916; --line:#4a3a2b;
  --text:#efe6d9; --dim:#a3907c; --focus:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1150px;margin:0 auto;padding:24px 20px 80px}

header{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line);
}
h1{font-family:'Press Start 2P',monospace;font-size:15px;margin:0;letter-spacing:.5px}
header a{color:var(--dim);text-decoration:none;font-size:14px;border-bottom:1px solid transparent}
header a:hover{color:var(--text);border-bottom-color:var(--line)}

nav.crumbs{font-size:13px;color:var(--dim);margin-bottom:18px;min-height:20px}
nav.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--dim);font:inherit;border-bottom:1px solid var(--line)}
nav.crumbs button:hover{color:var(--text)}
nav.crumbs .sep{padding:0 8px;color:var(--line)}
nav.crumbs .here{color:var(--text)}

.tip-line{font-size:13px;color:var(--dim);margin:0 0 16px;min-height:20px}

.photo-stage{position:relative;display:block;width:100%;border:1px solid var(--line);background:var(--panel)}
.photo-stage img{display:block;width:100%;height:auto}
.hotspot{
  position:absolute;border:2px solid transparent;background:transparent;
  cursor:pointer;padding:0;transition:background .12s,border-color .12s;
}
.hotspot:hover,.hotspot:focus-visible{background:rgba(255,209,102,.18);border-color:var(--focus);outline:none}
.hotspot .tip{
  position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
  white-space:nowrap;background:#000;font-size:11px;padding:4px 8px;
  margin-bottom:6px;opacity:0;pointer-events:none;
}
.hotspot:hover .tip,.hotspot:focus-visible .tip{opacity:1}

.detail{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:34px;align-items:start}
.crop{width:100%;border:1px solid var(--line);background:var(--panel) center/cover no-repeat}
.detail img.full{width:100%;height:auto;border:1px solid var(--line)}
.detail h2{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.7;margin:0 0 6px}
.detail .meta{font-size:12px;color:var(--dim);margin:0 0 18px}
.detail p.desc{font-size:15px;margin:0;max-width:62ch}
.pager{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
button.act{background:none;border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;padding:9px 16px;cursor:pointer}
button.act:hover{border-color:var(--focus)}
button.act[disabled]{opacity:.35;cursor:default}
button.act[disabled]:hover{border-color:var(--line)}

.setup{border-left:2px solid var(--line);padding-left:16px;max-width:60ch;color:var(--dim);font-size:14px}
.setup code{color:var(--text)}

@media (max-width:640px){
  .detail{grid-template-columns:1fr;gap:20px}
  h1{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SECTIONS = [

/* ============================================================
   ENGINE — nothing below needs editing
   ============================================================ */

const stage   = document.getElementById("stage");
const crumbs  = document.getElementById("crumbs");
const tipline = document.getElementById("tipline");
const state   = { view:"top", sectionId:null, spotIndex:null };
const natural = {};

const img = f => IMAGE_DIR + f;
const section = id => SECTIONS.find(s => s.id === id);

function measure(file){
  if(natural[file]) return Promise.resolve(natural[file]);
  return new Promise(res => {
    const i = new Image();
    i.onload  = () => { natural[file] = {w:i.naturalWidth, h:i.naturalHeight}; res(natural[file]); };
    i.onerror = () => { natural[file] = {w:4, h:3}; res(natural[file]); };
    i.src = img(file);
  });
}

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k === "class") n.className = attrs[k];
    else if(k === "style") n.style.cssText = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().filter(Boolean).forEach(c => n.append(c));
  return n;
}

function go(view, sectionId, spotIndex){
  state.view = view;
  state.sectionId = sectionId ?? null;
  state.spotIndex = spotIndex ?? null;
  render();
  window.scrollTo({top:0});
}

function renderCrumbs(){
  crumbs.textContent = "";
  const top = () => el("button",{onclick:()=>go("top")},"The shelf");
  if(state.view === "top"){
    crumbs.append(el("span",{class:"here"},"The shelf"));
  } else if(state.view === "section"){
    const s = section(state.sectionId);
    crumbs.append(top(), el("span",{class:"sep"},"/"), el("span",{class:"here"}, s.label));
  } else {
    const s = section(state.sectionId);
    const g = s.spots[state.spotIndex];
    crumbs.append(
      top(), el("span",{class:"sep"},"/"),
      el("button",{onclick:()=>go("section", s.id)}, s.label),
      el("span",{class:"sep"},"/"),
      el("span",{class:"here"}, g.title)
    );
  }
}

function hotspots(src, spots, onPick, labelOf){
  const holder = el("div",{class:"photo-stage"}, el("img",{src:img(src), alt:""}));
  spots.forEach((sp,i) => {
    holder.append(
      el("button",{
        class:"hotspot",
        style:`left:${sp.x}%;top:${sp.y}%;width:${sp.w}%;height:${sp.h}%`,
        onclick:()=>onPick(sp,i)
      }, el("span",{class:"tip"}, labelOf(sp)))
    );
  });
  return holder;
}

function viewTop(){
  if(!WIDE.src || !WIDE.spots.length){
    return el("div",{class:"setup"},
      "No shelves mapped yet. Open mapper.html, load ",
      el("code",{}, WIDE.src || "the wide shot"),
      ", drag a box around each shelf cube, then paste the output into the DATA block at the top of this file."
    );
  }
  tipline.textContent = "Click a shelf to move in.";
  return hotspots(WIDE.src, WIDE.spots,
    sp => go("section", sp.section),
    sp => (section(sp.section)||{}).label || sp.section
  );
}

function viewSection(){
  const s = section(state.sectionId);
  const body = el("div",{});
  if(s.spots && s.spots.length){
    tipline.textContent = "Click a game.";
    body.append(hotspots(s.photo, s.spots, (sp,i)=>go("game", s.id, i), sp => sp.title));
  } else {
    body.append(
      el("div",{class:"photo-stage"}, el("img",{src:img(s.photo), alt:s.label})),
      el("p",{class:"setup", style:"margin-top:20px"},
        "No games mapped on this shelf yet. Open mapper.html in games mode, load ",
        el("code",{}, s.photo), ", and box the games.")
    );
  }
  body.append(el("div",{class:"pager"},
    el("button",{class:"act", onclick:()=>go("top")}, "Back to the shelf")));
  return body;
}

function viewGame(){
  const s = section(state.sectionId);
  const i = state.spotIndex;
  const g = s.spots[i];

  let media;
  if(g.file){
    media = el("img",{class:"full", src:img(g.file), alt:g.title});
  } else {
    media = el("div",{class:"crop"});
    media.style.backgroundImage = 'url("' + img(s.photo) + '")';
    media.style.backgroundSize = (100/g.w*100).toFixed(3) + "% " + (100/g.h*100).toFixed(3) + "%";
    const px = g.w >= 100 ? 0 : (g.x/(100-g.w))*100;
    const py = g.h >= 100 ? 0 : (g.y/(100-g.h))*100;
    media.style.backgroundPosition = px.toFixed(3) + "% " + py.toFixed(3) + "%";
    measure(s.photo).then(n => {
      media.style.aspectRatio = ((g.w * n.w) / (g.h * n.h)).toFixed(4);
    });
  }

  const prev = el("button",{class:"act", onclick:()=>go("game", s.id, i-1)}, "Previous game");
  const next = el("button",{class:"act", onclick:()=>go("game", s.id, i+1)}, "Next game");
  if(i === 0) prev.disabled = true;
  if(i === s.spots.length - 1) next.disabled = true;

  return el("div",{},
    el("div",{class:"detail"},
      media,
      el("div",{},
        el("h2",{}, g.title),
        el("p",{class:"meta"}, s.label),
        g.desc ? el("p",{class:"desc"}, g.desc) : null
      )
    ),
    el("div",{class:"pager"}, prev, next,
      el("button",{class:"act", onclick:()=>go("section", s.id)}, "Back to " + s.label))
  );
}

function render(){
  renderCrumbs();
  tipline.textContent = "";
  stage.textContent = "";
  if(state.view === "top") stage.append(viewTop());
  else if(state.view === "section") stage.append(viewSection());
  else stage.append(viewGame());
}

render();
</script>
