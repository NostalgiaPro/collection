*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;color:#fff;font-family:NPSign,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
#bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s ease}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
@media (orientation:landscape){#bars.on i{height:7.5vh}}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,0,25,.55) 100%);z-index:6}
#fade{background:#000;opacity:0;z-index:12}
#flare{background:radial-gradient(circle at 50% 50%,rgba(255,250,220,.95),rgba(255,230,150,.35) 30%,rgba(255,200,120,0) 65%);opacity:0;z-index:7;mix-blend-mode:screen}
#flash{background:#fff;opacity:0;z-index:11}
#flash.go{animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;padding-bottom:4vh}
#title.show{opacity:1}
#title .wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.tl{position:relative;font-family:NPTitle;line-height:.92;white-space:nowrap;font-size:min(11.5vw,17vh);letter-spacing:.01em}
.tl .sh,.tl .sn{position:absolute;left:0;top:0}
.tl .sh{color:#2a0b4d;text-shadow:0 .015em 0 #ff4fb0,0 .03em 0 #e83a9e,0 .045em 0 #c92b8c,0 .06em 0 #a8217b,0 .075em 0 #861a6c,0 .09em 0 #66145e,0 .105em 0 #4a0f52,0 .14em .08em rgba(0,0,0,.65)}
.tl .ch{position:relative;background:linear-gradient(180deg,#ffffff 0%,#e9f1ff 18%,#9fc0ec 40%,#3a3f78 49%,#1c1b3c 51%,#ff9f5a 53%,#ffe3a8 68%,#ffffff 80%,#ff8fdc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.012em rgba(255,255,255,.55)}
.tl .sn{background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 49%,rgba(255,255,255,0) 60%);background-size:260% 100%;background-position:160% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.t2{font-size:min(13.5vw,19vh);margin-top:-.02em}
.t2 .two{background:linear-gradient(180deg,#fff 0%,#ffd1f1 25%,#ff4fb0 49%,#7a0c5a 51%,#ffb347 55%,#fff2b0 80%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:NPSign;font-size:min(9vw,9.5vh);color:#fff;margin-top:.35em;transform:rotate(-4deg);letter-spacing:.06em;text-shadow:0 0 .08em #fff,0 0 .2em #ff3fd2,0 0 .45em #ff3fd2,0 0 .9em #b100ff;opacity:0}
.spark{position:absolute;width:min(14vw,16vh);height:min(14vw,16vh);right:-4%;top:-10%;opacity:0;background:radial-gradient(circle,#fff 0 6%,rgba(255,255,255,0) 22%),linear-gradient(0deg,rgba(255,255,255,0) 46%,#fff 50%,rgba(255,255,255,0) 54%),linear-gradient(90deg,rgba(255,255,255,0) 47%,#fff 50%,rgba(255,255,255,0) 53%);-webkit-mask:radial-gradient(circle,#000 0 30%,transparent 70%);mask:radial-gradient(circle,#000 0 30%,transparent 70%)}
#title.show .wrap{animation:punch .5s cubic-bezier(.2,1.7,.45,1) both}
#title.show .sub{animation:slam .42s .38s cubic-bezier(.2,1.8,.4,1) both}
#title.show .sn{animation:shine 1.2s .6s ease-in-out both}
#title.show .spark{animation:spark .9s 1.45s ease-out both}
#title.show.hit .wrap{animation:punch .5s cubic-bezier(.2,1.7,.45,1) both,shake .3s .4s linear}
@keyframes punch{0%{transform:scale(2.6);opacity:0;filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes slam{0%{transform:scale(3.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes shine{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1.1) rotate(30deg)}100%{opacity:0;transform:scale(.6) rotate(70deg)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-6px 3px}50%{translate:5px -4px}75%{translate:-3px 2px}}
#title.static *{animation:none!important}
#title.static .sub{opacity:1}
#start{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,rgba(255,94,58,.35),rgba(120,30,140,.25) 40%,rgba(8,4,20,.92) 75%),rgba(8,4,20,.6);cursor:pointer;transition:opacity .5s}
#start.gone{opacity:0;pointer-events:none}
#start .box{text-align:center;padding:24px}
#start .play{width:min(22vw,120px);height:min(22vw,120px);margin:0 auto 22px;border-radius:50%;border:4px solid #ff4fd8;box-shadow:0 0 18px #ff4fd8,inset 0 0 18px #ff4fd8;position:relative;animation:pulse 1.6s ease-in-out infinite}
#start .play:after{content:"";position:absolute;left:38%;top:28%;border-style:solid;border-width:calc(min(22vw,120px)*.22) 0 calc(min(22vw,120px)*.22) calc(min(22vw,120px)*.34);border-color:transparent transparent transparent #fff}
#startMsg{font-family:NPSign;font-size:min(6vw,30px);letter-spacing:.03em;text-shadow:0 0 10px #59f3ff,0 0 22px #59f3ff;line-height:1.3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#end{position:fixed;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));z-index:13;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .5s}
#end.on{opacity:1;pointer-events:auto}
#end .press{font-family:NPTitle;font-size:min(6.5vw,42px);color:#fff;text-shadow:0 0 10px #59f3ff,0 0 26px #59f3ff;animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
#replay{font-family:NPSign;font-size:16px;color:#cfc6ff;background:rgba(20,10,40,.6);border:1px solid #6a55c8;border-radius:22px;padding:10px 18px;cursor:pointer;min-height:44px}
.ui{position:fixed;z-index:20;height:52px;border-radius:26px;border:2px solid rgba(255,255,255,.75);background:rgba(12,6,28,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ui:active{transform:scale(.95)}
#skip{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));padding:0 20px 0 22px;font-family:NPTitle;font-size:19px;letter-spacing:.05em;gap:8px;min-width:112px}
#skip svg{width:22px;height:22px}
#skip.gone{display:none}
#mute{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));width:52px;padding:0}
#mute svg{width:26px;height:26px}
#err{position:fixed;inset:auto 0 20px 0;text-align:center;z-index:30;color:#ff9a9a;font-size:15px;display:none;padding:0 20px}
</style>

<script>

<script type="module">
import * as THREE from 'three';

// ============================================================ helpers
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DEBUG_T = params.has('t') ? parseFloat(params.get('t')) : null;
const PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sat = t => clamp(t, 0, 1);
const smooth = t => { t = sat(t); return t * t * (3 - 2 * t); };
const ease = t => { t = sat(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1983);
const rr = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];

const TITLE_T = 24.0, END_T = 27.6;

// ============================================================ renderer
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 4200);
scene.fog = new THREE.Fog(0xe8796a, 150, 1100);

// heat shimmer post pass (only used in the desert shots)
const rt = new THREE.WebGLRenderTarget(4, 4, { samples: renderer.capabilities.isWebGL2 ? 4 : 0 });
const postMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, uTime: { value: 0 }, uAmt: { value: 0 }, uHor: { value: .45 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAmt, uHor; varying vec2 vUv;
    void main(){ vec2 uv = vUv; float band = exp(-pow((uv.y - uHor + .02) / .09, 2.));
      float w = sin(uv.y * 160. + uTime * 9.) * .6 + sin(uv.y * 71. - uTime * 6. + uv.x * 9.) * .4;
      uv.x += w * .0026 * uAmt * band; uv.y += sin(uv.x * 95. + uTime * 7.) * .0011 * uAmt * band;
      gl_FragColor = texture2D(tDiffuse, uv);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); postQuad.frustumCulled = false;
postScene.add(postQuad);

// ============================================================ materials and textures
const grad = new THREE.DataTexture(new Uint8Array([72,72,72,255, 150,150,150,255, 220,220,220,255, 255,255,255,255]), 4, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = o => new THREE.MeshToonMaterial(Object.assign({ gradientMap: grad }, o));

function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const glowTex = canvasTex(128, 128, (c, w, h) => {
  const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.55)');
  g.addColorStop(.6, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
glowTex.colorSpace = THREE.NoColorSpace;

// rim light injection: keeps black paint readable and gives a neon reflection look
function rimify(mat, a, b, k){
  const u = { uRimA: { value: new THREE.Color(a) }, uRimB: { value: new THREE.Color(b) }, uRimK: { value: k } };
  mat.userData.u = u;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.fragmentShader = 'uniform vec3 uRimA; uniform vec3 uRimB; uniform float uRimK;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `
      { vec3 nV = normalize(normal); vec3 vV = normalize(vViewPosition);
        float fr = pow(1.0 - clamp(dot(nV, vV), 0.0, 1.0), 3.2);
        vec3 rc = mix(uRimA, uRimB, clamp(nV.x * .5 + .5, 0., 1.));
        vec3 upV = normalize((viewMatrix * vec4(0., 1., 0., 0.)).xyz);
        float top = smoothstep(.6, .97, dot(nV, upV));
        outgoingLight += rc * fr * uRimK * (1. - top * .85) + rc * top * uRimK * .1; }
      #include <opaque_fragment>`);
  };
  return mat;
}

// geometry helpers
function paint(g, hex){
  const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ a[i*3] = c.r; a[i*3+1] = c.g; a[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g;
}
function B(w, h, d, x, y, z, hex, ry = 0){ const g = new THREE.BoxGeometry(w, h, d); if (ry) g.rotateY(ry); g.translate(x, y, z); return paint(g, hex); }
function merge(list, withUV = false){
  let total = 0; const parts = [];
  for (let g of list){ if (g.index) g = g.toNonIndexed(); if (!g.attributes.normal) g.computeVertexNormals(); parts.push(g); total += g.attributes.position.count; }
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3), uv = withUV ? new Float32Array(total * 2) : null;
  let o = 0;
  for (const g of parts){
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, o * 3); else col.fill(1, o * 3, (o + n) * 3);
    if (withUV && g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    o += n;
  }
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  m.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  m.setAttribute('color', new THREE.BufferAttribute(col, 3));
  if (withUV) m.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  m.computeBoundingSphere(); return m;
}
function quad(w, h, hex){ return paint(new THREE.PlaneGeometry(w, h), hex); }
function flatQuad(w, d, x, y, z, hex){ const g = new THREE.PlaneGeometry(w, d); g.rotateX(-PI / 2); g.translate(x, y, z); return paint(g, hex); }

// ============================================================ sky
const skyU = { uNight: { value: 0 }, uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, .035, -1).normalize() }, uMoon: { value: new THREE.Vector3(-.45, .42, -.78).normalize() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform float uNight, uTime; uniform vec3 uSun, uMoon; varying vec3 vDir;
    float hash(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
    void main(){
      vec3 d = normalize(vDir); float h = d.y; float sa = max(dot(d, uSun), 0.);
      vec3 dusk = mix(vec3(1., .58, .28), vec3(.96, .33, .46), smoothstep(.0, .16, h));
      dusk = mix(dusk, vec3(.24, .11, .42), smoothstep(.14, .62, h));
      dusk = mix(dusk * vec3(.62, .55, .95), dusk, .35 + .65 * pow(sa, 1.5));
      dusk += vec3(1., .6, .3) * pow(sa, 12.) * .35 * (1. - smoothstep(0., .35, h));
      vec3 night = mix(vec3(.36, .15, .45), vec3(.13, .06, .26), smoothstep(.0, .14, h));
      night = mix(night, vec3(.02, .02, .07), smoothstep(.1, .55, h));
      vec3 col = mix(dusk, night, uNight);
      // retro striped sun
      float sd = acos(clamp(dot(d, uSun), -1., 1.));
      float disk = 1. - smoothstep(.088, .092, sd);
      float sy = (d.y - uSun.y) / .09;
      float stripes = step(.42 + sy * .25, fract(sy * 4.5 + uTime * .35));
      float cut = sy < .15 ? stripes : 1.;
      vec3 sunC = mix(vec3(1., .3, .55), vec3(1., .93, .45), smoothstep(-1., 1., sy));
      col = mix(col, sunC, disk * cut * (1. - uNight));
      col += vec3(1., .45, .3) * pow(sa, 60.) * .6 * (1. - uNight);
      // cartoon moon
      float md = acos(clamp(dot(d, uMoon), -1., 1.));
      float moon = 1. - smoothstep(.045, .049, md);
      vec3 mp = d - uMoon;
      float crater = smoothstep(.012, .008, length(mp.xy - vec2(.012, .01))) + smoothstep(.009, .006, length(mp.xy + vec2(.015, -.004)));
      col = mix(col, mix(vec3(1., .96, .82), vec3(.85, .8, .7), clamp(crater, 0., 1.)), moon * uNight);
      col += vec3(.6, .55, .9) * pow(max(dot(d, uMoon), 0.), 300.) * .4 * uNight;
      // stars
      vec3 g = floor(d * 230.); float s = hash(g);
      col += vec3(step(.9965, s)) * (.55 + .45 * sin(uTime * 3. + s * 50.)) * uNight * smoothstep(.06, .3, h);
      if (h < 0.) col = mix(col, mix(vec3(.85, .45, .3), vec3(.25, .1, .3), uNight), smoothstep(0., -.06, h));
      gl_FragColor = vec4(toLin(col), 1.);
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xffc08a, 0x7a4a3a, 2.4);
const sun = new THREE.DirectionalLight(0xff9a55, 2.6);
sun.position.set(-40, 30, -100);
scene.add(hemi, sun, sun.target);

// ============================================================ static world containers
const townLit = [];      // toon, vertex colors
const townGlow = [];     // unlit emissive, vertex colors
const glowQuads = [];    // additive glow planes, uv + vertex colors
const signQuads = [];    // atlas mapped sign planes
const glowPts = [], glowPtCol = [];  // lamp and bulb halo points
const lineSegs = [];     // wires

// ---------- ground
{
  const g = new THREE.PlaneGeometry(4000, 4000, 100, 100); g.rotateX(-PI / 2);
  const p = g.attributes.position, n = p.count, col = new Float32Array(n * 3);
  const sand = new THREE.Color('#e3a868'), sand2 = new THREE.Color('#c9875a'), town = new THREE.Color('#4a3d47'), tmp = new THREE.Color();
  for (let i = 0; i < n; i++){
    const x = p.getX(i), z = p.getZ(i);
    tmp.copy(sand).lerp(sand2, .5 + .5 * Math.sin(x * .013 + z * .021) * Math.sin(z * .008 - x * .005));
    const inTown = smooth((75 - z) / 40) * smooth((900 - Math.abs(x)) / 100) * smooth((z + 1180) / 60);
    tmp.lerp(town, inTown);
    col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, toon({ vertexColors: true })));
}

// ---------- road (canvas texture)
{
  const tex = canvasTex(128, 512, (c, w, h) => {
    c.fillStyle = '#2b2731'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++){ c.fillStyle = `rgba(${R() < .5 ? '255,255,255' : '0,0,0'},${.04 + R() * .06})`; c.fillRect(R() * w, R() * h, 2, 2); }
    c.fillStyle = '#e9e4d8'; c.fillRect(5, 0, 5, h); c.fillRect(w - 10, 0, 5, h);
    c.fillStyle = '#ffc23d'; c.fillRect(w / 2 - 6, 0, 4, h * .55); c.fillRect(w / 2 + 2, 0, 4, h * .55);
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1720 / 26);
  const g = new THREE.PlaneGeometry(10, 1720); g.rotateX(-PI / 2); g.translate(0, .04, -260);
  const road = new THREE.Mesh(g, toon({ map: tex }));
  scene.add(road);
}

// ============================================================ desert
{
  // mesas, merged
  const mesas = [];
  const spots = [[-420,-1350,140,60],[300,-1420,180,75],[-900,-1100,160,90],[820,-1200,200,70],[-700,-300,120,55],[760,-150,150,65],
    [-640,420,170,70],[700,520,130,58],[-260,960,190,80],[380,1020,160,62],[-1100,500,220,95],[1050,-600,190,80],[60,-1600,240,85],[-1250,-650,200,70]];
  for (const [x, z, r, h] of spots){
    const g = new THREE.CylinderGeometry(r * .72, r, h, 7, 2); g.rotateY(R() * PI); g.scale(1, 1, rr(.6, 1));
    g.translate(x, h / 2 - 2, z);
    const p = g.attributes.position, n = p.count, col = new Float32Array(n * 3);
    const lo = new THREE.Color('#9c4630'), hi = new THREE.Color('#e08a52'), t = new THREE.Color();
    for (let i = 0; i < n; i++){ const y = (p.getY(i) + 2) / h; t.copy(lo).lerp(hi, y > .98 ? 1 : y * .7); col[i*3] = t.r; col[i*3+1] = t.g; col[i*3+2] = t.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    mesas.push(g);
  }
  const mm = new THREE.Mesh(merge(mesas), toon({ vertexColors: true }));
  scene.add(mm);

  // saguaro geometry
  const parts = [], gr = '#4f8f3f';
  const cyl = (r, h, x, y, z, rz = 0) => { const g = new THREE.CylinderGeometry(r, r * 1.08, h, 7); if (rz) g.rotateZ(rz); g.translate(x, y, z); return paint(g, gr); };
  const cap = (r, x, y, z) => { const g = new THREE.SphereGeometry(r, 7, 4, 0, PI * 2, 0, PI / 2); g.translate(x, y, z); return paint(g, gr); };
  parts.push(cyl(.45, 6.6, 0, 3.3, 0), cap(.45, 0, 6.6, 0));
  parts.push(cyl(.3, 1.3, .8, 2.9, 0, PI / 2), cyl(.3, 2.2, 1.4, 3.95, 0), cap(.3, 1.4, 5.05, 0));
  parts.push(cyl(.28, 1.0, -.7, 3.8, 0, PI / 2), cyl(.28, 1.7, -1.15, 4.6, 0), cap(.28, -1.15, 5.45, 0));
  const sag = merge(parts);
  const pts = [[-9, 330, 1.1], [12, 346, 1.25], [-15, 300, 1.0], [17, 316, .9], [-7, 278, .8], [14, 262, 1.1], [-20, 352, 1.3], [24, 300, 1.15]];
  for (let i = 0; i < 150; i++){
    const z = rr(75, 700); let x = rr(9, 300) * (R() < .5 ? -1 : 1);
    if (Math.abs(x) < 9) x = 9 * Math.sign(x);
    pts.push([x, z, rr(.65, 1.35)]);
  }
  const inst = new THREE.InstancedMesh(sag, toon({ vertexColors: true }), pts.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  pts.forEach((p, i) => { q.setFromAxisAngle(up, R() * PI * 2); s.setScalar(p[2]); v.set(p[0], 0, p[1]); m.compose(v, q, s); inst.setMatrixAt(i, m); });
  scene.add(inst);

  // bushes and rocks
  const bush = new THREE.IcosahedronGeometry(1, 0); bush.scale(1, .6, 1); bush.translate(0, .35, 0);
  const bi = new THREE.InstancedMesh(bush, toon({}), 260);
  const bc = ['#8a8a4a', '#9b9a55', '#7c7f45', '#a68c58'], cc = new THREE.Color();
  for (let i = 0; i < 260; i++){
    const z = rr(70, 640); const x = rr(6.5, 220) * (R() < .5 ? -1 : 1);
    q.setFromAxisAngle(up, R() * 6); s.setScalar(rr(.35, 1.1)); v.set(x, 0, z); m.compose(v, q, s); bi.setMatrixAt(i, m); bi.setColorAt(i, cc.set(pick(bc)));
  }
  scene.add(bi);
  const rock = new THREE.DodecahedronGeometry(1, 0); rock.scale(1.3, .7, 1);
  const ri = new THREE.InstancedMesh(rock, toon({}), 70);
  for (let i = 0; i < 70; i++){
    const z = rr(70, 640); const x = rr(8, 200) * (R() < .5 ? -1 : 1);
    q.setFromAxisAngle(up, R() * 6); s.setScalar(rr(.5, 2.2)); v.set(x, .2, z); m.compose(v, q, s); ri.setMatrixAt(i, m); ri.setColorAt(i, cc.set(pick(['#b5603d', '#9a4e35', '#c77a4f'])));
  }
  scene.add(ri);

  // telephone poles + wires along the highway
  const poleG = merge([B(.3, 9, .3, 0, 4.5, 0, '#5a3b28'), B(2.6, .2, .2, 0, 8.4, 0, '#5a3b28')]);
  const poles = [];
  for (let z = 640; z > 70; z -= 46) poles.push(z);
  const pi2 = new THREE.InstancedMesh(poleG, toon({ vertexColors: true }), poles.length);
  poles.forEach((z, i) => { m.makeTranslation(-8.5, 0, z); pi2.setMatrixAt(i, m); });
  scene.add(pi2);
  for (let i = 0; i < poles.length - 1; i++){
    for (const ox of [-1.1, 0, 1.1]){
      const steps = 8;
      for (let k = 0; k < steps; k++){
        const a = k / steps, b = (k + 1) / steps;
        const za = lerp(poles[i], poles[i + 1], a), zb = lerp(poles[i], poles[i + 1], b);
        const ya = 8.45 - Math.sin(a * PI) * .9, yb = 8.45 - Math.sin(b * PI) * .9;
        lineSegs.push(-8.5 + ox, ya, za, -8.5 + ox, yb, zb);
      }
    }
  }
}

// tumbleweed
const tumble = new THREE.Group();
{
  const w = new THREE.Mesh(new THREE.IcosahedronGeometry(.75, 1), toon({ color: '#b78a52', wireframe: true }));
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 0), toon({ color: '#8f6a3d', transparent: true, opacity: .85 }));
  tumble.add(w, c); scene.add(tumble);
}

// ============================================================ fonts first, then the town (signs need fonts)
await Promise.all([document.fonts.load('64px NPTitle'), document.fonts.load('64px NPSign')]).catch(() => {});

function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fitFont(c, text, family, max, width){ let fs = max; c.font = `${fs}px ${family}`; while (c.measureText(text).width > width && fs > 10){ fs -= 2; c.font = `${fs}px ${family}`; } return fs; }

// ---------- welcome sign
const welcome = new THREE.Group();
{
  const tex = canvasTex(1024, 512, (c, W, H) => {
    rrect(c, 8, 8, W - 16, H - 16, 46); c.fillStyle = '#fff1d0'; c.fill();
    rrect(c, 30, 30, W - 60, H - 60, 32); const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#26c2b4'); bg.addColorStop(1, '#13877f'); c.fillStyle = bg; c.fill();
    c.save(); rrect(c, 30, 30, W - 60, H - 60, 32); c.clip();
    // striped sun
    const sx = W * .78, sy = H * .5, sr = 150;
    const sg = c.createLinearGradient(0, sy - sr, 0, sy + sr); sg.addColorStop(0, '#ffe66d'); sg.addColorStop(1, '#ff5e7e');
    c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, sr, 0, PI * 2); c.fill();
    c.fillStyle = '#13877f'; for (let i = 0; i < 5; i++){ c.fillRect(sx - sr, sy + 18 + i * 26, sr * 2, 6 + i * 2.5); }
    // cactus
    c.fillStyle = '#2f6b3a';
    const cx = 110, base = H - 70;
    rrect(c, cx - 18, base - 210, 36, 210, 18); c.fill();
    rrect(c, cx - 70, base - 150, 26, 80, 13); c.fill(); rrect(c, cx - 70, base - 92, 70, 24, 12); c.fill();
    rrect(c, cx + 44, base - 175, 26, 90, 13); c.fill(); rrect(c, cx, base - 110, 70, 24, 12); c.fill();
    c.restore();
    c.textAlign = 'center'; c.textBaseline = 'middle';

function beamMesh(xs, y, z, len, r){
  const parts = [];
  for (const x of xs){
    const g = new THREE.ConeGeometry(r, len, 12, 1, true); g.translate(0, -len / 2, 0);
    const p = g.attributes.position, c = new Float32Array(p.count * 3);

function profileExtrude(pts, depth, bevel){
  const sh = new THREE.Shape(); sh.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]); sh.closePath();

}

// ============================================================ choreography
function carZ(T){

}
function carSpeed(T){ return T < 9.5 ? 46 : T < 15 ? 22 : 26; }
const vanP0 = new THREE.Vector2(17, -126), vanP1 = new THREE.Vector2(3, -127), vanP2 = new THREE.Vector2(1.8, -143);

    return { x, z, yaw: Math.atan2(-dx, -dz), v: Math.hypot(dx, dz) / 1.3, turn: Math.sin(u * PI) };

}
function nightAt(T){ return T < 5.5 ? 0 : T < 9.5 ? .3 * (T - 5.5) / 4 : 1; }

  if (o.exp) g.gain.exponentialRampToValueAtTime(.0008, t + dur); else { g.gain.setValueAtTime(gain, t + Math.max(a, dur - (o.r ?? .05))); g.gain.linearRampToValueAtTime(0, t + dur); }

  s.start(t, Math.random()); s.stop(t + dur + .05);
}
// ---- instruments
function kick(t){ const c = A.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); g.gain.setValueAtTime(.95, t); g.gain.exponentialRampToValueAtTime(.001, t + .38); o.connect(g); g.connect(A.drums); o.start(t); o.stop(t + .4); }
function snare(t, v = 1){ noise(t, .22, { f: 1900, q: .7, gain: .42 * v, exp: true, dest: A.drums, rev: .9 }); tone(t, 200, .1, { type: 'triangle', gain: .22 * v, a: .002, r: .08, dest: A.drums, to: 150 }); }
function hat(t){ noise(t, .05, { type: 'highpass', f: 7500, gain: .09, exp: true, dest: A.drums }); }
const CH = { Am: [57, 60, 64], F: [53, 57, 60], C: [48, 55, 64], G: [55, 59, 62] };
const BAR = 2.4, S16 = .15;
const PROG = ['Am', 'F', 'C', 'G', 'Am', 'F', 'C', 'G', 'F', 'G'];
function buildEvents(){
  const ev = [];
  PROG.forEach((ch, b) => {
    const t0 = b * BAR, notes = CH[ch];
    ev.push([t0, t => { for (const n of notes){ for (const dt of [-9, 9]) tone(t, mtof(n), BAR + .35, { gain: .045, a: b === 0 ? 1.8 : .25, r: .5, detune: dt }); tone(t, mtof(n + 12), BAR + .3, { type: 'triangle', gain: .02, a: b === 0 ? 2 : .3, r: .5 }); } }]);
    if (b >= 2){ const root = notes[0] - 24 + (ch === 'C' ? 12 : 0);
      for (let i = 0; i < 8; i++) ev.push([t0 + i * .3, t => { tone(t, mtof(root + (i % 4 === 2 ? 12 : 0)), .26, { gain: .16, a: .005, r: .1 }); tone(t, mtof(root - 12), .26, { type: 'sine', gain: .2, a: .005, r: .1, dest: A.music }); }]); }
    if (b >= 4 && b < 9){
      const arp = [notes[0] + 12, notes[1] + 12, notes[2] + 12, notes[0] + 24];
      for (let i = 0; i < 16; i++) ev.push([t0 + i * S16, t => tone(t, mtof(arp[[0, 1, 2, 3, 2, 1, 2, 3][i % 8]]), .12, { type: 'square', gain: .028, a: .003, r: .08 })]);
      for (let i = 0; i < 4; i++){ const tb = t0 + i * .6; if (i % 2 === 0) ev.push([tb, kick]); else ev.push([tb, t => snare(t)]); ev.push([tb + .3, hat]); ev.push([tb, hat]); }
      if (b === 8) ev.push([t0 + 1.8, kick]);
    }
    if (b === 9){ for (let i = 0; i < 16; i++) ev.push([t0 + i * S16, t => snare(t, .25 + i / 16 * .9)]); ev.push([t0, kick]); }
  });
  // filter opens with the story
  ev.push([0, t => { const f = A.filt.frequency; f.cancelScheduledValues(t); f.setValueAtTime(350, t); f.exponentialRampToValueAtTime(1300, t + 4.8); f.exponentialRampToValueAtTime(3200, t + 9.6); f.exponentialRampToValueAtTime(5200, t + 19.2); }]);
  ev.push([0, t => { A.wind.gain.cancelScheduledValues(t); A.wind.gain.setValueAtTime(0, t); A.wind.gain.linearRampToValueAtTime(.12, t + 1.5); A.wind.gain.setValueAtTime(.12, t + 8.6); A.wind.gain.linearRampToValueAtTime(0, t + 9.6); }]);
  // sound effects
  ev.push([7.25, t => noise(t, .9, { f: 400, fTo: 2600, q: 1.2, gain: .55, a: .45, r: .4 })]);
  ev.push([7.72, t => { noise(t, .18, { type: 'lowpass', f: 900, gain: .9, exp: true, rev: .4 }); tone(t, 90, .18, { type: 'sine', gain: .5, a: .002, r: .15, to: 40, dest: A.sfx }); }]);
  ev.push([7.92, t => noise(t, .12, { type: 'lowpass', f: 800, gain: .6, exp: true })]);
  ev.push([16.3, t => { tone(t, 70, .2, { type: 'square', gain: .25, a: .002, r: .15, dest: A.sfx, to: 45 }); tone(t + .02, 600, .5, { type: 'sine', gain: .12, a: .01, r: .3, to: 2400, dest: A.sfx }); }]);
  ev.push([16.5, t => { noise(t, .75, { f: 2600, fTo: 1900, q: 9, gain: .35, a: .02, r: .3 }); tone(t, 1750, .7, { type: 'sawtooth', gain: .03, to: 1500, dest: A.sfx }); }]);
  ev.push([16.95, t => { const o = tone(t, 200, .42, { type: 'sawtooth', gain: .22, a: .02, r: .06, to: 430, glide: .34, dest: A.sfx }); tone(t + .44, 420, .32, { type: 'sawtooth', gain: .22, a: .01, r: .08, to: 300, dest: A.sfx }); }]);
  ev.push([18.6, t => { tone(t, 660, .12, { type: 'square', gain: .1, dest: A.sfx }); tone(t + .17, 660, .14, { type: 'square', gain: .1, dest: A.sfx }); }]);
  ev.push([19.45, t => noise(t, 3.6, { type: 'lowpass', f: 250, fTo: 3800, q: 2, gain: .32, a: 2.2, r: 1.2 })]);
  ev.push([21.8, t => noise(t, 2.2, { type: 'highpass', f: 600, fTo: 9000, q: 1, gain: .25, a: 2.1, r: .08 })]);
  ev.push([TITLE_T, sting]);
  ev.push([TITLE_T + .62, shineSfx]);
  ev.sort((a, b) => a[0] - b[0]);
  return ev;
}
function sting(t){
  const notes = [36, 48, 55, 60, 64, 67, 74, 79];
  for (const n of notes) for (const dt of [-7, 7]) tone(t, mtof(n), 3.4, { gain: .055, a: .01, r: 2.2, detune: dt, dest: A.music });
  for (const n of [48, 60, 64, 67]) tone(t, mtof(n), 3.2, { type: 'square', gain: .02, a: .01, r: 2.4, dest: A.revIn });
  tone(t, 55, 1.2, { type: 'sine', gain: .8, a: .002, r: 1.0, to: 30, dest: A.music });
  noise(t, 2.6, { type: 'highpass', f: 3000, gain: .35, exp: true, rev: .8, dest: A.music });
  kick(t); snare(t, 1.2);
  [84, 88, 91, 96].forEach((n, i) => tone(t + .1 + i * .07, mtof(n), .8, { type: 'sine', gain: .07, a: .005, r: .7, dest: A.revIn }));
}
function shineSfx(t){ tone(t, 1800, .55, { type: 'sine', gain: .08, a: .02, r: .4, to: 6200, dest: A.revIn }); [100, 103, 107].forEach((n, i) => tone(t + .25 + i * .06, mtof(n), .5, { type: 'triangle', gain: .045, a: .004, r: .45, dest: A.revIn })); }
let events = [], evIdx = 0, audioSkipped = false;
function scheduler(){
  if (!A.ctx || audioSkipped) return;
  const now = A.ctx.currentTime, horizon = now + .25;
  while (evIdx < events.length && A.t0 + events[evIdx][0] < horizon){ const [et, fn] = events[evIdx++]; const at = A.t0 + et; if (at > now - .05) fn(Math.max(at, now)); }
}
setInterval(scheduler, 40);
function audioStart(){
  if (!audioInit()) return;
  A.ctx.resume && A.ctx.resume();
  audioSkipped = false; events = buildEvents(); evIdx = 0;
  A.t0 = A.ctx.currentTime + .06;
  const n = A.ctx.currentTime; A.music.gain.cancelScheduledValues(n); A.music.gain.setValueAtTime(.5, n);
  scheduler();
}
function audioSkip(alreadyTitled){
  if (!A.ctx) return;
  audioSkipped = true;
  const n = A.ctx.currentTime;
  A.music.gain.cancelScheduledValues(n); A.music.gain.setTargetAtTime(0, n, .05);
  A.wind.gain.cancelScheduledValues(n); A.wind.gain.setTargetAtTime(0, n, .05);
  if (!alreadyTitled){ setTimeout(() => { const m = A.ctx.currentTime; A.music.gain.cancelScheduledValues(m); A.music.gain.setValueAtTime(.5, m); sting(m + .02); shineSfx(m + .64); }, 180); }
}
function audioFrame(T){
  if (!A.ctx) return;
  const now = A.ctx.currentTime;
  engineFrame(A.engCar, car, carSpeed(T), T >= 5.5 && !(finished && pressed) ? 1 : 0, 0, T);
  const vs = vanState(T);
  engineFrame(A.engVan, van, vs.v, T > 16.25 && !(finished && pressed) ? 1 : 0, 1, T);
}
const vel = new THREE.Vector3(), rel = new THREE.Vector3(), camR = new THREE.Vector3();
function engineFrame(E, obj, speed, on, isVan, T){
  const now = A.ctx.currentTime;
  rel.copy(camera.position).sub(obj.position); const d = rel.length(); rel.normalize();
  vel.set(-Math.sin(obj.rotation.y), 0, -Math.cos(obj.rotation.y)).multiplyScalar(speed);
  const vr = vel.dot(rel), dop = clamp(130 / (130 - vr), .55, 1.8);
  const base = isVan ? 34 + speed * .9 : 38 + speed * 1.5;
  let g = on * clamp(10 / (d + 4), 0, 1) * (isVan ? .45 : .6);
  if (T > TITLE_T) g *= Math.max(0, 1 - (T - TITLE_T) / 1.5);
  if (muted) g = 0;
  E.o1.frequency.setTargetAtTime(base * dop, now, .05); E.o2.frequency.setTargetAtTime(base * dop * .5, now, .05);
  E.lfo.frequency.setTargetAtTime((isVan ? 6 : 9) + speed * .12, now, .1);
  E.lp.frequency.setTargetAtTime((isVan ? 380 : 520) + speed * 14, now, .08);
  E.out.gain.setTargetAtTime(g, now, .06);
  if (E.pan){ camR.set(1, 0, 0).applyQuaternion(camera.quaternion); E.pan.pan.setTargetAtTime(clamp(-rel.dot(camR), -1, 1) * .8, now, .06); }
}
function setMuted(m){
  muted = m; try { localStorage.setItem('np2_muted', m ? '1' : '0'); } catch (e) {}
  $('waves').style.display = m ? 'none' : ''; $('xmark').style.display = m ? '' : 'none';
  $('mute').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  if (A.ctx) A.master.gain.setTargetAtTime(m ? 0 : .9, A.ctx.currentTime, .03);
}
setMuted(muted);

// ============================================================ flow, input, events
let T = 0, started = false, running = false, finished = false, pressed = false, finishAt = 0;
function emit(type, extra = {}){
  const detail = Object.assign({ type }, extra);
  try { window.dispatchEvent(new CustomEvent(type, { detail })); } catch (e) {}
  try { if (window.parent && window.parent !== window) window.parent.postMessage(detail, '*'); } catch (e) {}
}
function start(){
  if (started || DEBUG_T != null) return;
  started = true; running = true; T = 0;
  elStart.classList.add('gone');
  audioStart();
}
function finish(skipped){
  if (finished) return;
  finished = true; running = false; finishAt = performance.now();
  const had = elTitle.classList.contains('show');
  if (skipped){ elStart.classList.add('gone'); started = true; if (T < TITLE_T + .5) T = TITLE_T + .5; audioSkip(had || !A.ctx); }
  showTitle(false);
  elSkip.classList.add('gone');
  setTimeout(() => elEnd.classList.add('on'), skipped ? 900 : 0);
  emit('np2intro:finished', { skipped: !!skipped });
}
function pressStart(){
  if (!finished || pressed || performance.now() - finishAt < 700) return;
  pressed = true; elEnd.classList.remove('on');
  if (A.ctx){ const n = A.ctx.currentTime; A.master.gain.setTargetAtTime(0, n, .25); }
  emit('np2intro:start');
  setTimeout(() => { $('replay').style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:21'; document.body.appendChild($('replay')); }, 600);
}
function replay(){
  finished = false; pressed = false; started = true; running = true; T = 0;
  elTitle.className = 'layer'; elEnd.classList.remove('on'); elSkip.classList.remove('gone');
  const rb = $('replay'); rb.style.cssText = ''; elEnd.appendChild(rb);
  if (A.ctx) A.master.gain.setTargetAtTime(muted ? 0 : .9, A.ctx.currentTime, .03);
  audioStart();
}
elSkip.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); finish(true); });
$('mute').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); setMuted(!muted); if (!started) { /* first tap on mute also counts as the audio unlock */ } });
$('replay').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); replay(); });
elStart.addEventListener('pointerdown', e => { e.preventDefault(); if (ready) start(); else wantStart = true; });
window.addEventListener('pointerdown', () => { if (finished) pressStart(); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'Escape'){ if (!finished) finish(true); return; }
  if (e.key === 'm' || e.key === 'M'){ setMuted(!muted); return; }
  if (!started){ if (ready) start(); else wantStart = true; return; }
  if (finished) pressStart();
});
document.addEventListener('visibilitychange', () => {
  if (!A.ctx) return;
  if (document.hidden) A.ctx.suspend && A.ctx.suspend(); else if (!pressed) A.ctx.resume && A.ctx.resume();
});
window.NP2Intro = { skip: () => finish(true), replay, mute: m => setMuted(!!m), get time(){ return T; } };

// ============================================================ resize + adaptive quality
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  aspect = w / h; portrait = clamp((1.15 - aspect) / .6, 0, 1);
  renderer.setPixelRatio(PR); renderer.setSize(w, h, false);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(db.x, db.y);
  trafficU.uScale.value = db.y / 2;
}
window.addEventListener('resize', resize);
resize();
let perfN = 0, perfSum = 0, perfDrops = 0;
function perfSample(dt){
  if (!running || perfDrops >= 2) return;
  perfN++; if (perfN < 30) return;
  perfSum += dt;
  if (perfN >= 150){ const avg = perfSum / 120; if (avg > 1 / 38 && PR > 1){ PR = Math.max(1, PR * .75); resize(); perfDrops++; } perfN = 0; perfSum = 0; }
}

// ============================================================ main loop
const horiz = new THREE.Vector3();
let last = performance.now(), ready = false, wantStart = false;
function render(shimmer){
  if (shimmer > .01){
    camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
    horiz.copy(camera.position).addScaledVector(camDir, 1500); horiz.y = 0; horiz.project(camera);
    postMat.uniforms.uHor.value = horiz.y * .5 + .5; postMat.uniforms.uAmt.value = shimmer; postMat.uniforms.uTime.value = T;
    renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  } else renderer.render(scene, camera);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (DEBUG_T != null){ T = DEBUG_T; }
  else if (running){
    T += dt;
    if (A.ctx && A.ctx.state === 'running' && !audioSkipped){ const ta = A.ctx.currentTime - A.t0; const err = ta - T; if (Math.abs(err) > .3) T = ta; else T += err * .08; }
    if (T >= TITLE_T) showTitle(false);
    if (T >= END_T) finish(false);
    perfSample(dt);
  } else if (finished){ T += dt * .5; }
  T = Math.max(0, T);
  updateWorld(T);
  const shimmer = cameraAt(T);
  overlays(T);
  if (A.ctx && started) audioFrame(T);
  render(shimmer);
  window.__frames = (window.__frames || 0) + 1;
}
window.__np2boot = true;
ready = true;
if (DEBUG_T != null){
  elStart.classList.add('gone'); started = true;
  if (DEBUG_T >= TITLE_T) showTitle(true);
  if (DEBUG_T >= END_T){ elEnd.classList.add('on'); elSkip.classList.add('gone'); }
} else {
  $('startMsg').textContent = 'Click, tap, or press any key to play';
  if (wantStart) start();
}
requestAnimationFrame(frame);
window.__np2info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: PR });
</script>
