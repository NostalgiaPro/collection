*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07040f;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;color:#fff;font-family:NPSign,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.layer{position:fixed;inset:0;pointer-events:none}
#bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s ease}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
@media (orientation:landscape){#bars.on i{height:7.5vh}}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,0,25,.55) 100%);z-index:6}
#fade{background:#000;opacity:0;z-index:12}
#flare{background:radial-gradient(circle at 50% 50%,rgba(255,250,220,.95),rgba(255,230,150,.35) 30%,rgba(255,200,120,0) 65%);opacity:0;z-index:7;mix-blend-mode:screen}
#flash{background:#fff;opacity:0;z-index:11}
#flash.go{animation:flash .8s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#lens{z-index:9;opacity:0;mix-blend-mode:screen}
#lens .streak{position:absolute;left:-10%;right:-10%;top:calc(50% - 1.2vh);height:2.4vh;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.95) 0,rgba(140,220,255,.65) 18%,rgba(120,90,255,.25) 45%,rgba(0,0,0,0) 70%)}
#lens .core{position:absolute;left:50%;top:50%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,220,160,.6) 20%,rgba(255,120,200,.15) 50%,rgba(0,0,0,0) 70%)}
#lens .g{position:absolute;border-radius:50%;border:2px solid rgba(160,220,255,.35);background:radial-gradient(circle,rgba(255,120,220,.18),rgba(0,0,0,0) 70%)}
#lens.go{animation:lens 1.6s ease-out forwards}
#lens.go .sweep{animation:sweepL 1.2s .5s ease-in-out both}
#lens .sweep{position:absolute;inset:0}
@keyframes lens{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
@keyframes sweepL{0%{transform:translateX(-40vw)}100%{transform:translateX(40vw)}}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;padding-bottom:3vh}
#title.show{opacity:1}
#title .wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.tl{position:relative;font-family:NPTitle;line-height:.95;white-space:nowrap;letter-spacing:.01em}
.tl .sh,.tl .sn{position:absolute;left:0;top:0}
.tl .sh{color:#2a0b4d;text-shadow:0 .015em 0 #ff4fb0,0 .03em 0 #e83a9e,0 .045em 0 #c92b8c,0 .06em 0 #a8217b,0 .075em 0 #861a6c,0 .09em 0 #66145e,0 .105em 0 #4a0f52,0 .14em .08em rgba(0,0,0,.65)}
.tl .ch{position:relative;background:linear-gradient(180deg,#ffffff 0%,#e9f1ff 18%,#9fc0ec 40%,#3a3f78 49%,#1c1b3c 51%,#ff9f5a 53%,#ffe3a8 68%,#ffffff 80%,#ff8fdc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.012em rgba(255,255,255,.55)}
.tl .sn{background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 49%,rgba(255,255,255,0) 60%);background-size:260% 100%;background-position:160% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.t1{font-size:min(7.3vw,10.5vh)}
.t2{font-size:min(9vw,12.5vh);margin-top:.04em}
.two{background:linear-gradient(180deg,#fff 0%,#ffd1f1 25%,#ff4fb0 49%,#7a0c5a 51%,#ffb347 55%,#fff2b0 80%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#neon{font-family:NPSign;font-size:min(10.2vw,11.5vh);line-height:1.05;margin-top:.45em;transform:rotate(-4deg) scale(0);transform-origin:50% 50%;letter-spacing:.04em;white-space:nowrap;opacity:0;will-change:transform}
#neon span{display:inline-block;color:#4a1745;text-shadow:none;opacity:.25}
#neon.on span{animation:flickOn .7s both}
#neon.on span.lit{color:#fff}
@keyframes flickOn{0%{color:#4a1745;text-shadow:none;opacity:.25}12%{color:#fff;opacity:1;text-shadow:0 0 .06em #fff,0 0 .18em #ff3fd2,0 0 .4em #ff3fd2,0 0 .8em #b100ff}20%{color:#4a1745;opacity:.35;text-shadow:none}34%{color:#fff;opacity:1;text-shadow:0 0 .06em #fff,0 0 .18em #ff3fd2,0 0 .4em #ff3fd2,0 0 .8em #b100ff}44%{color:#6a2a64;opacity:.5;text-shadow:none}60%,100%{color:#fff;opacity:1;text-shadow:0 0 .06em #fff,0 0 .18em #ff3fd2,0 0 .4em #ff3fd2,0 0 .8em #b100ff}}
#neon.on span.buzz{animation:flickOn .7s both,buzz 3.1s 2.4s infinite}
@keyframes buzz{0%,86%,90%,100%{opacity:1}88%{opacity:.3}89%{opacity:1}}
.spark{position:absolute;width:min(14vw,16vh);height:min(14vw,16vh);right:-6%;top:-14%;opacity:0;background:radial-gradient(circle,#fff 0 6%,rgba(255,255,255,0) 22%),linear-gradient(0deg,rgba(255,255,255,0) 46%,#fff 50%,rgba(255,255,255,0) 54%),linear-gradient(90deg,rgba(255,255,255,0) 47%,#fff 50%,rgba(255,255,255,0) 53%);-webkit-mask:radial-gradient(circle,#000 0 30%,transparent 70%);mask:radial-gradient(circle,#000 0 30%,transparent 70%)}
#title.show .wrap{animation:punch .45s cubic-bezier(.2,1.8,.45,1) both}
#title.show .sn{animation:shine 1.2s .55s ease-in-out both}
#title.show .spark{animation:spark .9s 1.5s ease-out both}
@keyframes punch{0%{transform:scale(2.8);opacity:0;filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1.1) rotate(30deg)}100%{opacity:0;transform:scale(.6) rotate(70deg)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-7px 4px}50%{translate:6px -4px}75%{translate:-3px 2px}}
#title.static *{animation:none!important}
#title.static #neon span{color:#fff;opacity:1;text-shadow:0 0 .06em #fff,0 0 .18em #ff3fd2,0 0 .4em #ff3fd2,0 0 .8em #b100ff}
#start{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,rgba(255,94,58,.35),rgba(120,30,140,.25) 40%,rgba(8,4,20,.92) 75%),rgba(8,4,20,.6);cursor:pointer;transition:opacity .5s}
#start.gone{opacity:0;pointer-events:none}
#start .box{text-align:center;padding:24px}
#start .play{width:min(22vw,120px);height:min(22vw,120px);margin:0 auto 22px;border-radius:50%;border:4px solid #ff4fd8;box-shadow:0 0 18px #ff4fd8,inset 0 0 18px #ff4fd8;position:relative;animation:pulse 1.6s ease-in-out infinite}
#start .play:after{content:"";position:absolute;left:38%;top:28%;border-style:solid;border-width:calc(min(22vw,120px)*.22) 0 calc(min(22vw,120px)*.22) calc(min(22vw,120px)*.34);border-color:transparent transparent transparent #fff}
#startMsg{font-family:NPSign;font-size:min(6vw,30px);letter-spacing:.03em;text-shadow:0 0 10px #59f3ff,0 0 22px #59f3ff;line-height:1.3}

  const rate = 44100;
  const dur = Math.max(0.5, to - from);
  const off = new OfflineAudioContext(2, Math.ceil(rate * dur), rate);
  const saved = { ctx: window.NP2A.ctx, master: A.master, live: A.live };
  A.master = null; A.live = false;
  window.NP2A.ctx = off;
  audioBuild();
  const evs = buildEvents().filter(e => e[0] >= from - 0.05 && e[0] < to);
  for (const [et, fn] of evs) { try { fn(0.05 + (et - from)); } catch (e) {} }
  const buf = await off.startRendering();
  A.master = saved.master; A.live = saved.live; window.NP2A.ctx = saved.ctx;
  const ch0 = buf.getChannelData(0), ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : ch0;
  const n = buf.length, bytes = n * 4 + 44;
  const ab = new ArrayBuffer(bytes), v = new DataView(ab);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, bytes - 8, true); wstr(8, 'WAVE'); wstr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    const l = Math.max(-1, Math.min(1, ch0[i])), r = Math.max(-1, Math.min(1, ch1[i]));
    v.setInt16(44 + i * 4, l * 32767, true); v.setInt16(46 + i * 4, r * 32767, true);
  }
  return ab;
}
window.NP2Intro = { skip: () => finish(true), replay, mute: m => setMuted(!!m), renderSpan, get time(){ return T; }, get audioState(){ return A.ctx ? A.ctx.state : 'none'; }, get audioEvents(){ return evIdx; } };

// ============================================================ resize + adaptive quality
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  aspect = w / h; portrait = clamp((1.15 - aspect) / .6, 0, 1);
  renderer.setPixelRatio(PR); renderer.setSize(w, h, false);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2()); rt.setSize(db.x, db.y); uScaleG.value = db.y / 2;
  const fd = Math.min(window.devicePixelRatio || 1, 2); fx.width = Math.round(w * fd); fx.height = Math.round(h * fd);
}
window.addEventListener('resize', resize); resize();
let perfN = 0, perfSum = 0, perfDrops = 0;
function perfSample(dt){
  if (!running || perfDrops >= 2) return;
  perfN++; if (perfN < 30) return; perfSum += dt;
  if (perfN >= 150){ const avg = perfSum / 120; if (avg > 1 / 38 && PR > 1){ PR = Math.max(1, PR * .75); resize(); perfDrops++; } perfN = 0; perfSum = 0; }
}

// ============================================================ main loop
const horiz = new THREE.Vector3();
let last = performance.now();
function render(shimmer){
  if (shimmer > .01){
    camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
    horiz.copy(camera.position).addScaledVector(camDir, 1500); horiz.y = 0; horiz.project(camera);
    postMat.uniforms.uHor.value = horiz.y * .5 + .5; postMat.uniforms.uAmt.value = shimmer;
    renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  } else renderer.render(scene, camera);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (DEBUG_T != null) T = DEBUG_T;
  else if (running){
    T += dt;
    if (T >= TITLE_T) showTitle(false);
    if (T >= END_T) finish(false);
    perfSample(dt);
  } else if (finished) T += dt * (T < END_T ? 1 : .5);
  T = Math.max(0, T);
  updateWorld(T);
  const shimmer = cameraAt(T);
  overlays(T);
  if (started) audioFrame(T);
  render(shimmer);
  window.__frames = (window.__frames || 0) + 1;
}
window.__np2boot = true;
window.__np2score = { build: audioBuild, events: buildEvents, arm(ctx){ window.NP2A.ctx = ctx; A.master = null; A.ctx = ctx; } };
if (DEBUG_T != null){
  elStart.classList.add('gone'); started = true;
  window.__setT = t => { DEBUG_T = t; if (t >= TITLE_T) showTitle(true); };
  if (DEBUG_T >= TITLE_T) showTitle(true);
  if (DEBUG_T >= END_T){ elEnd.classList.add('on'); elSkip.classList.add('gone'); }
} else {
  $('startMsg').textContent = 'Click, tap, or press any key to play';

  if (window.NP2A.pending) start();
}
requestAnimationFrame(frame);
window.__np2info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: PR });
