<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashback</title>
<style>
html,body{margin:0;height:100%;background:#0c0614;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .12s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .5s}
#fade.on{opacity:1}
#vhs{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#snow{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0}
#tag{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:7;color:#ffe14d;font:700 15px/1 ui-monospace,monospace;letter-spacing:.18em;text-shadow:2px 2px 0 #5a2048}
#rew{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;color:#fff8e8;font:800 46px/1 ui-monospace,monospace;letter-spacing:.12em;text-shadow:4px 4px 0 #1a1028;display:none}
.bubble{position:fixed;z-index:6;max-width:min(460px,80vw);background:#fff8e8;color:#1a1028;border:4px solid #1a1028;border-radius:16px 16px 16px 4px;padding:14px 18px 16px;font:22px/1.3 system-ui,sans-serif;box-shadow:7px 7px 0 #1a1028;display:none}
.bubble b{display:block;font:700 12px/1 system-ui,sans-serif;letter-spacing:.12em;margin-bottom:6px}
#bDonny{left:5vw;top:calc(70px + env(safe-area-inset-top))}
#bRadio{right:5vw;bottom:18vh;border-radius:16px 16px 4px 16px;background:#14081f;color:#ffe14d;border-color:#ffe14d;box-shadow:7px 7px 0 #5a2048}
#bRadio span{filter:blur(1.4px);letter-spacing:.08em}
#skip{position:fixed;top:16px;right:16px;z-index:9;background:#fff;color:#1a1028;border:0;border-radius:999px;padding:10px 16px;font-weight:700}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three-0.160.0/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="snow"></canvas>
<div id="vhs"></div>
<div id="fade"></div>
<div id="tag">FLASHBACK &nbsp;CLOSING TIME</div>
<div id="rew">&#9664;&#9664; REWIND</div>
<div id="bDonny" class="bubble"><b>DONNY</b><span></span></div>
<div id="bRadio" class="bubble"><b>RADIO</b><span></span></div>
<button id="skip" type="button">SKIP</button>
<script type="module">
// The midgame flashback (mission 15). Normal Donny closes the Storage Beers shop. The radio on the counter comes
// on by itself while his keys are still in his hand. He walks over to it; the picture breaks up and, for a few
// frames, his face is not his own. Then dark. The radio's voice and words stay indistinct, and nothing here
// says who or what is on the other end. Characters are the approved illustrated Donny (as he is before, the
// same art as the rescued Donny) and, in single-frame glimpses only, the approved armored Donny.
import * as THREE from 'three';
import { radioVoice, radioStatic } from '../vendor/np2_radio.js';

const HUM = 'Hm hm hmm. Hm.';
const GLYPHS = '░▒▓~ ';
const bDonny = document.getElementById('bDonny');
const bRadio = document.getElementById('bRadio');
const fade = document.getElementById('fade');
const rew = document.getElementById('rew');
const snow = document.getElementById('snow');
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a0f2a');
scene.fog = new THREE.Fog('#1a0f2a', 12, 30);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);
const hemi = new THREE.HemisphereLight('#b9a7e0', '#2a1438', 0.75);
scene.add(hemi);
const ceiling = new THREE.PointLight('#fff1d6', 26, 14);
ceiling.position.set(0, 3.6, 1.2);
scene.add(ceiling);
const street = new THREE.PointLight('#59f3ff', 10, 10);
street.position.set(-4.5, 2.2, 2);
scene.add(street);

function std(color, emissive, rough) {
  return new THREE.MeshStandardMaterial({ color, emissive: emissive || '#000', roughness: rough == null ? 0.6 : rough, metalness: 0.05 });
}
function box(w, h, d, m) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); }
function textTex(words, w, h, bg, fg, fontPx) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = Math.max(128, Math.round(1024 * h / w));
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  let px = fontPx;
  g.font = '800 ' + px + 'px system-ui,sans-serif';
  while (g.measureText(words).width > c.width - 64 && px > 24) { px -= 4; g.font = '800 ' + px + 'px system-ui,sans-serif'; }
  g.fillText(words, c.width / 2, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---- the shop at closing time: back wall, shelves of crates, a counter, the door to the street
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), std('#2b2238', '#000', 0.9));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const back = box(14, 5, 0.2, std('#3a2460')); back.position.set(0, 2.5, -3); scene.add(back);
const left = box(0.2, 5, 8, std('#33204f')); left.position.set(-5.2, 2.5, 0.5); scene.add(left);
const right = box(0.2, 5, 8, std('#33204f')); right.position.set(5.2, 2.5, 0.5); scene.add(right);
for (let s = 0; s < 3; s++) {
  const shelf = box(5.4, 0.08, 0.7, std('#6a4a32')); shelf.position.set(0.3, 0.7 + s * 1.05, -2.6); scene.add(shelf);
  for (let k = 0; k < 6; k++) {
    if ((k + s) % 4 === 3) continue;
    const cr = box(0.7, 0.6, 0.55, std(['#8a6a44', '#a07c50', '#7a5a3a'][(k + s) % 3]));
    cr.position.set(-2.0 + k * 0.9, 1.04 + s * 1.05, -2.6); scene.add(cr);
    const stamp = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.2), new THREE.MeshBasicMaterial({ map: textTex('SB', 0.42, 0.2, '#7a5a3a', '#2a1a10', 300) }));
    stamp.position.set(-2.0 + k * 0.9, 1.04 + s * 1.05, -2.32); scene.add(stamp);
  }
}
// the shop sign on the back wall: lit until he closes up
const signMat = new THREE.MeshBasicMaterial({ map: textTex('STORAGE BEERS', 4.2, 0.7, '#14081f', '#ff4fd8', 220) });
const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.7), signMat);
sign.position.set(0.4, 4.25, -2.88); scene.add(sign);
const signGlow = new THREE.PointLight('#ff4fd8', 14, 8); signGlow.position.set(-0.6, 4.1, -2.2); scene.add(signGlow);
// the front door at the back left, open onto the neon street
const doorFrame = box(1.7, 2.9, 0.14, std('#14081f')); doorFrame.position.set(-3.55, 1.45, -2.86); scene.add(doorFrame);
const outside = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.65), new THREE.MeshBasicMaterial({ color: '#2a8fb0' }));
outside.position.set(-3.55, 1.38, -2.78); scene.add(outside);
const streetSign = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.34), new THREE.MeshBasicMaterial({ map: textTex('OPEN', 1.1, 0.34, '#14081f', '#7dff6a', 220) }));
streetSign.position.set(-3.55, 2.45, -2.76); scene.add(streetSign);
// the counter and the radio on it
const counter = box(2.4, 1.05, 0.9, std('#5a3a5a')); counter.position.set(3.2, 0.52, 0.2); scene.add(counter);
const counterTop = box(2.5, 0.06, 1.0, std('#2a1a2a')); counterTop.position.set(3.2, 1.07, 0.2); scene.add(counterTop);
const radio = new THREE.Group(); radio.position.set(3.25, 1.1, 0.25); scene.add(radio);
const radioBody = box(0.78, 0.44, 0.28, std('#2a2a30', '#000', 0.4)); radioBody.position.y = 0.22; radio.add(radioBody);
const grille = box(0.32, 0.3, 0.02, std('#4a4a50')); grille.position.set(-0.18, 0.22, 0.15); radio.add(grille);
const dialMat = new THREE.MeshStandardMaterial({ color: '#3a2a10', emissive: '#ffe14d', emissiveIntensity: 0 });
const dial = box(0.28, 0.12, 0.02, dialMat); dial.position.set(0.18, 0.28, 0.15); radio.add(dial);
const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.04, 12), std('#c0c0c8')); knob.rotation.x = Math.PI / 2; knob.position.set(0.18, 0.12, 0.16); radio.add(knob);
const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.7, 6), std('#d0d0d8')); antenna.position.set(0.3, 0.75, -0.05); antenna.rotation.z = -0.35; radio.add(antenna);
const radioLight = new THREE.PointLight('#ffe14d', 0, 3.2); radioLight.position.set(0, 0.5, 0.5); radio.add(radioLight);

// ---- Donny, the approved illustration as a flat figure standing in the room
const loader = new THREE.TextureLoader();
function sprite(file, h, aspect) {
  const tex = loader.load(file); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.45, depthWrite: true });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(h * aspect, h), m);
  mesh.geometry.translate(0, h / 2, 0);
  return mesh;
}
const donny = new THREE.Group(); scene.add(donny);
const DONNY_H = 2.3;
const plain = sprite('donny_clean2.png', DONNY_H, 274 / 640); donny.add(plain);
// two tinted copies, offset sideways while the picture breaks up (a red and a blue ghost)
const ghosts = [['#ff3060', -1], ['#30d0ff', 1]].map(([col, side]) => {
  const g = sprite('donny_clean2.png', DONNY_H, 274 / 640);
  g.material = g.material.clone(); g.material.color = new THREE.Color(col); g.material.opacity = 0.55; g.material.depthWrite = false;
  g.userData.side = side; g.visible = false; donny.add(g); return g;
});
// the glimpse: the approved armored Donny, shown for single frames only, in the same spot
const glimpse = sprite('donny_glimpse_clean2.png', DONNY_H * 1.0, 480 / 640); glimpse.visible = false; donny.add(glimpse);
// his keys, in his hand the whole time
const keys = new THREE.Group();
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 16), std('#d8d2c0', '#000', 0.3)); keys.add(ring);
for (const [x, r] of [[0.05, 0.4], [-0.03, -0.3], [0.0, 0.1]]) {
  const k = box(0.03, 0.12, 0.01, std('#e8d690', '#000', 0.25)); k.position.set(x, -0.1, 0.01); k.rotation.z = r; keys.add(k);
}
keys.position.set(0.36, 1.02, 0.04); donny.add(keys);

// ---- timing
const HOLD = parseFloat(new URLSearchParams(location.search).get('hold') || 'NaN');   // review pictures only
let t = isNaN(HOLD) ? 0 : HOLD, done = false, last = performance.now();
const DOOR = new THREE.Vector3(-3.0, 0, -1.6), COUNTER = new THREE.Vector3(2.0, 0, 1.15);
const FLASHES = [[14.4, 0.09], [16.0, 0.11], [17.2, 0.13], [18.3, 0.16]];
let flashesSeen = 0, lastFlash = -1, voiced = { a: false, b: false }, clicked = false, staticDone = false;
function beatName() {
  if (t >= 21.0) return 'black';
  if (t >= 19.4) return 'static';
  if (t >= 12.0) return 'approach';
  if (t >= 8.4) return 'radio';
  if (t >= 6.2) return 'lights';
  if (t >= 1.8) return 'closing';
  return 'rewind';
}
function distortion() { return t < 11 ? 0 : Math.min(1, (t - 11) / 8.2); }
function flashing() {
  for (let i = 0; i < FLASHES.length; i++) {
    const [s, d] = FLASHES[i];
    if (t >= s && t < s + d) { if (lastFlash !== i) { lastFlash = i; flashesSeen++; radioStatic(0.12, 0.12); } return true; }
  }
  return false;
}
function garble(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  return s;
}
function drawSnow(level) {
  if (level <= 0) { snow.style.opacity = 0; return; }
  const w = snow.width = 160, h = snow.height = 100;
  const g = snow.getContext('2d'); const img = g.createImageData(w, h);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  snow.style.width = '100%'; snow.style.height = '100%'; snow.style.imageRendering = 'pixelated';
  snow.style.opacity = level;
}
function show(beat, glimpsed) {
  rew.style.display = beat === 'rewind' ? 'block' : 'none';
  bDonny.style.display = beat === 'closing' ? 'block' : 'none';
  bDonny.querySelector('span').textContent = HUM;
  const talking = (beat === 'radio' && t >= 9.0) || (beat === 'approach' && t >= 15.0 && t < 18.8);
  bRadio.style.display = talking ? 'block' : 'none';
  if (talking && Math.floor(t * 8) !== show.k) { show.k = Math.floor(t * 8); bRadio.querySelector('span').textContent = garble(18); }
  fade.classList.toggle('on', beat === 'black');
  document.getElementById('skip').style.visibility = beat === 'black' ? 'hidden' : 'visible';
  document.body.dataset.beat = beat;
  window.__np2flashback = {
    t: +t.toFixed(2), beat, black: beat === 'black', radio_on: t >= 8.4, keys_in_hand: keys.parent === donny && keys.visible,
    sign_on: signMat.color.r > 0.5, flashes: flashesSeen, glimpse_now: glimpsed, distortion: +distortion().toFixed(2),
    donny_x: +donny.position.x.toFixed(2), radio_text: talking ? bRadio.querySelector('span').textContent : '',
    donny_text: beat === 'closing' ? HUM : '', voice: window.__np2radio ? window.__np2radio.played : 0, done
  };
}
function finish() {
  if (done) return;
  done = true;
  fade.classList.add('on');
  if (window.__np2flashback) window.__np2flashback.done = true;
  const msg = { type: 'np2flashback:finished' };
  if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!done && isNaN(HOLD)) t += dt;
  const beat = beatName();
  // where Donny is: at the door, then walking to the counter
  const walk = Math.min(1, Math.max(0, (t - 12.2) / 5.4));
  donny.position.lerpVectors(DOOR, COUNTER, walk * walk * (3 - 2 * walk));
  donny.position.y = walk > 0 && walk < 1 ? Math.abs(Math.sin(t * 6)) * 0.04 : 0;
  donny.rotation.y = 0.12;
  keys.rotation.z = Math.sin(t * 7) * 0.35 * (walk > 0 && walk < 1 ? 1 : 0.4);
  // the sign and the lights go off when he closes up
  const off = t >= 6.2;
  const flick = t >= 6.2 && t < 7.4 && Math.sin(t * 60) > 0.2;
  signMat.color.setScalar(off && !flick ? 0.12 : 1);
  signGlow.intensity = off && !flick ? 0 : 14;
  ceiling.intensity = t < 6.6 ? 26 : 5;
  // the radio comes on by itself, keys still in his hand
  const on = t >= 8.4;
  dialMat.emissiveIntensity = on ? 1.4 + Math.sin(t * 9) * 0.4 : 0;
  radioLight.intensity = on ? 4 + Math.sin(t * 11) * 1.2 : 0;
  if (on && !clicked) { clicked = true; radioStatic(0.35, 0.2); }
  if (t >= 9.0 && !voiced.a) { voiced.a = true; radioVoice({ syllables: 9, garble: 0.75, rate: 3.2 }); }
  if (t >= 15.0 && !voiced.b) { voiced.b = true; radioVoice({ syllables: 11, garble: 0.85, rate: 3.4, pitch: 104 }); }
  // the picture breaking up as he gets close
  const d = distortion();
  const glimpsed = flashing();
  plain.visible = !glimpsed;
  glimpse.visible = glimpsed;
  ghosts.forEach((g) => { g.visible = d > 0.15 && !glimpsed; g.position.x = g.userData.side * (0.03 + d * 0.12) * (1 + Math.sin(t * 23)); });
  plain.position.x = d > 0.3 ? (Math.random() - 0.5) * d * 0.12 : 0;
  canvas.style.filter = d > 0 ? `contrast(${1 + d * 0.5}) saturate(${1 - d * 0.5}) hue-rotate(${(Math.sin(t * 3) * d * 40).toFixed(0)}deg)` : 'none';
  drawSnow(beat === 'static' ? 0.9 : (glimpsed ? 0.2 : d * 0.1));
  if (beat === 'static' && !staticDone) { staticDone = true; radioStatic(1.5, 0.22); }
  // the camera: wide at the door, then in on him at the counter
  const push = Math.min(1, Math.max(0, (t - 11.5) / 7));
  camera.position.set(-0.9 + push * 2.8, 2.0 - push * 0.3, 7.6 - push * 3.4);
  camera.lookAt(-0.7 + push * 2.9, 1.35, -0.6 + push * 0.6);
  if (beat === 'rewind') camera.position.x += Math.sin(t * 40) * 0.03;
  show(beat, glimpsed);
  if (t >= 22.0) finish();
  renderer.render(scene, camera);
  if (!done) requestAnimationFrame(frame);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  // same rule as the rescue scene: a phone held upright keeps at least the side-to-side view of a 5:4 screen
  const BASE = 42, MIN_ASPECT = 1.25;
  camera.fov = camera.aspect >= MIN_ASPECT ? BASE : Math.min(96, 2 * Math.atan(Math.tan(BASE * Math.PI / 360) * MIN_ASPECT / camera.aspect) * 180 / Math.PI);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
// SKIP (or Esc) goes to black and hands back to the game straight away
function skip() { t = 21.05; show('black', false); finish(); }
document.getElementById('skip').addEventListener('pointerdown', skip);
addEventListener('keydown', (e) => { if (e.key === 'Escape') skip(); });
show('rewind', false);
requestAnimationFrame(frame);
</script>
</body>
</html>
