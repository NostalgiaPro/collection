name: GameEye shelf sync

on:
  schedule:
    # 5:00 AM America/Phoenix (no DST) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameye-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync from GameEye
        id: sync
        run: |
          set -euo pipefail
          python3 tools/gameye_sync.py | tee /tmp/gameye-sync.log
          if git diff --quiet -- index.html stats.html consoles.html data/shelf-games.json data/daily.json tools/data/gameye_baseline.json tools/data/gameye_pending_new.json tools/data/gameye_removed_flags.json tools/data/gameye_sync_state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "gameye-sync[bot]"
          git config user.email "gameye-sync[bot]@users.noreply.github.com"
          git add index.html stats.html consoles.html data/shelf-games.json data/daily.json \
            tools/data/gameye_baseline.json tools/data/gameye_pending_new.json \
            tools/data/gameye_removed_flags.json tools/data/gameye_sync_state.json
          # Summary for the commit message
          msg="GameEye sync: update shelf from thenostalgiapro"
          if grep -q "adding " /tmp/gameye-sync.log; then
            msg=$(grep "adding " /tmp/gameye-sync.log | head -1)
            msg="GameEye sync: ${msg}"
          fi
          git commit -m "$msg"
          git push
