name: GameEye shelf sync

on:
  schedule:
    # 5:00 AM America/Phoenix (no DST) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gameye-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync from GameEye
        id: sync
        run: |
          set -euo pipefail
          python3 tools/gameye_sync.py | tee /tmp/gameye-sync.log
          # Commit only when the shelf or tracking lists actually change.
          # Ignore gameye_sync_state.json alone (it always bumps last_run).
          if git diff --quiet -- index.html stats.html consoles.html \
              data/shelf-games.json data/daily.json \
              tools/data/gameye_baseline.json \
              tools/data/gameye_pending_new.json \
              tools/data/gameye_removed_flags.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- tools/data/gameye_sync_state.json || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "gameye-sync[bot]"
          git config user.email "gameye-sync[bot]@users.noreply.github.com"
          git add index.html stats.html consoles.html data/shelf-games.json data/daily.json \
            tools/data/gameye_baseline.json tools/data/gameye_pending_new.json \
            tools/data/gameye_removed_flags.json tools/data/gameye_sync_state.json
          msg="GameEye sync: update shelf from thenostalgiapro"
          if grep -q "adding " /tmp/gameye-sync.log; then
            msg=$(grep "adding " /tmp/gameye-sync.log | head -1)
            msg="GameEye sync: ${msg}"
          fi
          git commit -m "$msg"
          git push


      - name: Ensure Pages deploy for latest commit
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rapid pushes can leave an older pages-build-deployment "in progress"
          # and make newer deploys fail with HTTP 400. Cancel older in-progress
          # pages runs, then wait for (or re-run) the deploy for HEAD.
          sleep 20
          HEAD=$(git rev-parse HEAD)
          # Cancel in-progress pages runs that are not for HEAD
          gh run list --workflow=pages-build-deployment --status in_progress --limit 10             --json databaseId,headSha | python3 -c '
import json,sys,subprocess
for r in json.load(sys.stdin):
  if r["headSha"] != "'"$HEAD"'":
    print("cancelling superseded pages run", r["databaseId"], r["headSha"][:7])
    subprocess.run(["gh","run","cancel",str(r["databaseId"])], check=False)
'
          # Wait up to ~4 minutes for a successful pages deploy of HEAD
          for i in $(seq 1 24); do
            row=$(gh run list --workflow=pages-build-deployment --commit "$HEAD" --limit 1               --json databaseId,status,conclusion -q '.[0] // empty')
            if [ -z "$row" ] || [ "$row" = "null" ]; then
              echo "waiting for pages run to appear ($i)"
              sleep 10
              continue
            fi
            status=$(echo "$row" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            conclusion=$(echo "$row" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            id=$(echo "$row" | python3 -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')
            echo "pages run $id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "Pages deploy ok for $HEAD"
              exit 0
            fi
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "re-running failed pages deploy $id"
              gh run rerun "$id" --failed
              sleep 20
              continue
            fi
            sleep 10
          done
          echo "WARNING: Pages deploy for $HEAD not confirmed success within timeout"
          exit 0
