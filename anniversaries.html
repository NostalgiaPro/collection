<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(90,110,180,.14), transparent 62%),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 22px 90px}

  header{padding:44px 0 0}
  .wordmark{font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0 0 22px}
  h1{font-family:"Press Start 2P",monospace;font-size:clamp(15px,3.3vw,30px);line-height:1.55;margin:0}
  .standfirst{color:var(--dim);font-size:15px;margin:14px 0 0;max-width:60ch}
  .navrow{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
  .navbtn{
    display:inline-flex;align-items:center;border:2px solid var(--line);color:var(--dim);
    text-decoration:none;font-family:"Silkscreen",monospace;font-size:11px;
    letter-spacing:.05em;padding:9px 14px;border-radius:2px;
  }
  .navbtn:hover{border-color:var(--hot);color:var(--hot)}
  .navbtn.here{border-color:var(--hot);background:var(--hot);color:#12070a}

  .headline{
    margin:34px 0 0;background:var(--bg2);border:2px solid var(--hot);
    border-radius:2px;display:flex;flex-wrap:wrap;
  }
  .hero-shot{
    flex:1 1 260px;min-height:200px;background:var(--panel) center/cover no-repeat;
    border-right:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.06em;
    color:var(--dim);text-align:center;padding:16px;word-break:break-all;
  }
  .hero-body{flex:2 1 320px;padding:24px}
  .countdown{font-family:"Silkscreen",monospace;font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--hot);margin-bottom:14px}
  .headline h2{font-family:"Press Start 2P",monospace;font-size:19px;line-height:1.5;margin:0}
  .headline .big{font-family:"Press Start 2P",monospace;font-size:30px;color:var(--hot);display:block;margin:12px 0 0}
  .headline p{margin:14px 0 0;color:var(--dim);font-size:14px}
  .riders{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
  .riders b{color:var(--text);font-weight:500}

  .today{margin:20px 0 0;background:var(--bg2);border:2px solid var(--line);border-radius:2px;padding:18px 20px}
  .today h3{font-family:"Silkscreen",monospace;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--dim);margin:0 0 10px}
  .today p{margin:0;font-size:15px}
  .today .quiet{color:var(--dim);font-size:14px;margin-top:6px}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 6px}
  .chip{
    font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.05em;cursor:pointer;
    background:transparent;color:var(--dim);border:2px solid var(--line);
    border-radius:2px;padding:9px 14px;
  }
  .chip[aria-pressed="true"]{background:var(--hot);color:#12070a;border-color:var(--hot)}

  .day{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
  .date{flex:0 0 46px;text-align:center;padding-top:2px}
  .date .mon{font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.1em;color:var(--dim)}
  .date .num{font-family:"Press Start 2P",monospace;font-size:15px;display:block;margin-top:6px}
  .entries{flex:1;min-width:0}
  .entry{display:flex;align-items:center;gap:12px;padding:5px 0}
  .shot{flex:none;width:52px;height:52px;object-fit:cover;border:1px solid var(--line);border-radius:2px;background:var(--panel)}
  .shot.missing{
    display:flex;align-items:center;justify-content:center;font-family:"Silkscreen",monospace;
    font-size:7px;letter-spacing:.04em;color:var(--dim);text-align:center;
    border-style:dashed;padding:3px;line-height:1.3;word-break:break-all;
  }
  .meta{min-width:0}
  .title{font-size:15px;display:block}
  .title b{font-weight:600}
  .sys{font-size:12px;color:var(--c,var(--dim))}
  .yrs{font-family:"Silkscreen",monospace;font-weight:700;font-size:11px;letter-spacing:.05em;color:var(--dim);white-space:nowrap;margin-left:auto;padding-left:12px}
  .yrs.round{color:var(--hot)}
  .monthhead{
    font-family:"Silkscreen",monospace;font-weight:700;font-size:11px;letter-spacing:.1em;
    color:var(--dim);margin:44px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .monthhead span{display:block;font-weight:400;letter-spacing:.04em;margin-top:7px;text-transform:none;font-size:10px}
  .mrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .mrow .t{flex:1;min-width:0;font-size:15px}
  .mrow .c{flex:none;font-size:12px;color:var(--c,var(--dim))}
  .mrow .a{font-family:"Silkscreen",monospace;font-weight:700;font-size:11px;color:var(--dim);white-space:nowrap;margin-left:12px}
  .mrow .a.round{color:var(--hot)}
  .note{font-size:13px;color:var(--dim);margin-top:28px;max-width:64ch}
</style>
</head>

  "NES":"#d3d0c8","Famicom":"#d1553f","SNES":"#8f6fd6","Nintendo 64":"#3fa65b",
  "GameCube":"#6f68c9","Game Boy":"#9bbc0f","Game Boy Color":"#3fb8b0",

  "Xbox Series X/S":"#2ed15a","Sega Genesis":"#e04a3c","Sega Dreamcast":"#f2793f",
  "Sega Saturn":"#4a63c9","Atari 7800+":"#e07a35","Sega Master System":"#c94a4a","Intellivision":"#d1a83a","PC":"#9aa3b5"
};

const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const slug = (t,c) => (t+"-"+c).toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

/* next time this anniversary comes round, and how old it turns.
   A day of 0 means the month is all that's on record. */
function next(e){
  const [m,d,y] = e;
  const day = d || 1;
  let when = new Date(today.getFullYear(), m-1, day);
  if (when < today) when = new Date(today.getFullYear()+1, m-1, day);
  return { when, age: when.getFullYear() - y,
           days: Math.round((when - today) / 86400000) };
}
const isRound = n => n % 5 === 0;

const all = EVENTS.map(e => ({
  m:e[0], d:e[1], y:e[2], name:e[3], con:e[4], hw:e[5]==="hw",
  monthOnly:e[1]===0, ...next(e)
})).sort((a,b) => a.days - b.days || (b.hw?1:0) - (a.hw?1:0));

/* weight: rounder and bigger anniversaries lead */
const weight = x => (isRound(x.age)?40:0) + (x.age%10===0?30:0) + (x.hw?25:0) + x.age/10;

const dated  = all.filter(x => !x.monthOnly);
const todays = dated.filter(x => x.days === 0);
const ahead  = dated.filter(x => x.days > 0);

/* month-only entries, grouped by the month they fall in */
const thisMonth = all.filter(x => x.monthOnly && x.m === now.getMonth()+1)
  .sort((a,b) => a.y - b.y);

/* ---- hero: the biggest thing coming up in the next 90 days ---- */
const hero = ahead.filter(x => x.days <= 90).sort((a,b)=>weight(b)-weight(a))[0] || ahead[0];
if (hero) {
  const sameDay = ahead.filter(x => x.days === hero.days && x !== hero);
  const sl = slug(hero.name, hero.con);
  document.getElementById("hero").innerHTML =
    `<div class="hero-shot" id="heroShot" data-shot="${sl}">images/${sl}.jpg</div>
     <div class="hero-body">
       <div class="countdown">${hero.days === 1 ? "Tomorrow" : "In " + hero.days + " days"}</div>
       <h2>${hero.name}</h2>
       <span class="big">${hero.age} years</span>
       <p>${hero.hw ? "North American launch" : hero.con}, ${MON[hero.m-1].charAt(0)+MON[hero.m-1].slice(1).toLowerCase()} ${hero.d}, ${hero.y}.</p>
       ${sameDay.length ? `<div class="riders">Same day: ${
         sameDay.map(x=>`<b>${x.name}</b>`).join(" and ")} ${sameDay.length>1?"both turn":"turns"} ${sameDay[0].age}.</div>` : ""}
     </div>`;
  const probe = new Image();
  probe.onload = () => {
    const h = document.getElementById("heroShot");
    h.style.backgroundImage = `url('images/${sl}.jpg')`; h.textContent = "";
  };
  probe.src = "images/" + sl + ".jpg";
}

/* ---- today ---- */
const tb = document.getElementById("todayBox");
if (todays.length) {
  tb.innerHTML = `<h3>Today</h3>` + todays.map(x =>
    `<p><b>${x.name}</b> turns ${x.age}${x.hw?"":" &middot; "+x.con}</p>`).join("");
} else {
  const nx = ahead[0];
  tb.innerHTML = `<h3>Today</h3><p>Nothing on the shelf has an anniversary today.</p>` +
    (nx ? `<p class="quiet">Next up is ${nx.name}, ${nx.days === 1 ? "tomorrow" : "in " + nx.days + " days"}.</p>` : "");
}

/* ---- the list ---- */
let mode = "all";
function draw(){
  const rows = ahead.filter(x =>
    mode === "hw" ? x.hw : mode === "round" ? isRound(x.age) : true).slice(0, 40);
  const byDay = new Map();
  rows.forEach(x => {
    const k = x.when.toDateString();
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(x);
  });
  document.getElementById("list").innerHTML = [...byDay].map(([k, xs]) => {
    const w = xs[0].when;
    return `<div class="day">
      <div class="date"><div class="mon">${MON[w.getMonth()]}</div><span class="num">${w.getDate()}</span></div>
      <div class="entries">${xs.map(x => {
        const sl = slug(x.name, x.con);
        return `<div class="entry" data-shot="${sl}">
          <span class="meta"><span class="title">${x.hw?`<b>${x.name}</b>`:x.name}</span>
          <span class="sys" style="--c:${COLORS[x.con]||"#8e93a2"}">${x.hw?"North American launch":x.con}</span></span>
          <span class="yrs${isRound(x.age)?" round":""}">${x.age} yrs</span></div>`;
      }).join("")}</div></div>`;
  }).join("");

  document.querySelectorAll(".entry[data-shot]").forEach(entry => {
    const sl = entry.dataset.shot, img = new Image();
    img.className = "shot"; img.loading = "lazy"; img.alt = "";
    img.onerror = () => {
      const box = document.createElement("span");
      box.className = "shot missing"; box.textContent = sl + ".jpg";
      img.replaceWith(box);
    };
    img.src = "images/" + sl + ".jpg";
    entry.prepend(img);
  });
}
/* ---- month-only block ---- */
const MONTHNAME=["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
if (thisMonth.length) {
  document.getElementById("monthHead").innerHTML =
    MONTHNAME[now.getMonth()] + " anniversaries" +
    `<span>These only have a month on record, not a day. ${thisMonth.length} this month.</span>`;
  document.getElementById("monthList").innerHTML = thisMonth.map(x =>
    `<div class="mrow">
      <span class="t">${x.name}</span>
      <span class="c" style="--c:${COLORS[x.con]||"#8e93a2"}">${x.con}</span>
      <span class="a${isRound(x.age)?" round":""}">${x.age} yrs</span>
    </div>`).join("");
}

const chips = {all:document.getElementById("f-all"),hw:document.getElementById("f-hw"),round:document.getElementById("f-round")};
Object.entries(chips).forEach(([k,el]) => el.addEventListener("click", () => {
  mode = k;
  Object.entries(chips).forEach(([j,e2]) => e2.setAttribute("aria-pressed", String(j===k)));
  draw();
}));
draw();
</script>
