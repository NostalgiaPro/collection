<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101219">
<meta name="description" content="Christmas Eve, 1994. Run the mall in 3D and reach the toy store before the grille comes down. A free seasonal game in the Nostalgia Pro Arcade.">
<title>Mall Santa Dash '94 | Nostalgia Pro Arcade</title>
<link rel="stylesheet" href="../shared/shell.css">
<link rel="modulepreload" href="../shared/three.module.min.js">
<style>
/* Hidden test page only. Phone polish for this game (the shared shell is untouched). */
.np-bar, .np-ov { touch-action: manipulation; }
.np-stage:not(:has(.np-ov.on)) { touch-action: none; }
.np-back { flex-shrink: 0; }
#np-ov-over .np-row span { white-space: nowrap; }
#np-ov-over .np-row b { text-align: right; }
#np-ov-title .np-card [data-act=start] {
  position: sticky; bottom: 0; z-index: 1;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 4px 0 16px var(--panel);
}
#np-ov-title .np-tip { margin-top: 18px; }
#np-ov-over .np-card { padding-bottom: 0; }
#np-ov-over .np-actions { position: sticky; bottom: 0; z-index: 1; padding: 8px 0 14px; background: var(--panel); }
#np-ov-over .np-small { margin-bottom: 18px; }
@media (pointer: coarse), (max-width: 600px) {
  #np-ov-over .np-actions { padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
  #np-ov-over .np-small { margin-bottom: max(56px, env(safe-area-inset-bottom, 0px)); }
}
body .npt-wrap.npt-low { top: calc(env(safe-area-inset-top) + 4px); bottom: auto; }
@media (max-width: 340px) { .np-bar { gap: 6px; padding: 6px; } .np-back { padding: 0 8px; } }
@media (orientation: landscape) and (max-height: 500px) {
  .np-app { flex-direction: row; }
  .np-bar { flex: 0 0 112px; flex-wrap: wrap; align-content: space-between; justify-content: center; min-height: 0; padding: 8px; border-bottom: 0; border-right: 2px solid var(--line); }
  .np-back { width: 100%; padding: 0 6px; }
  .np-title { flex: 1 0 100%; font-size: 9px; line-height: 1.6; -webkit-line-clamp: 4; }
  .np-flash b { font-size: 16px; }
  .np-flash span { font-size: 12px; margin-top: 4px; }
  .np-ov { padding: 10px; }
  #np-ov-over .np-actions { grid-template-columns: 1fr 1fr; }
  body .npt-wrap, body .npt-wrap.npt-low { top: calc(env(safe-area-inset-top) + 8px); bottom: auto; }
}
/* Shoe picker on the title card */
.msd3-shoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 12px; }
.msd3-shoes-h { grid-column: 1 / -1; margin: 0; font: 400 9px/1.4 var(--display, "Press Start 2P", monospace); color: var(--dim); }
.msd3-shoes button { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 8px; border-radius: 6px; border: 2px solid var(--line);
  background: var(--bg); color: var(--text); font: 700 11px/1.2 "Silkscreen", monospace; text-align: left; cursor: pointer; }
.msd3-shoes button i { flex: 0 0 12px; height: 12px; border-radius: 3px; }
.msd3-shoes button[aria-pressed=true] { border-color: #3fd07a; color: #ffd23f; }
.msd3-shoes button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:monospace;color:#eceae2;background:#101219">Mall Santa Dash needs JavaScript turned on. <a href="../index.html" style="color:#3fd07a">Back to the arcade</a></p></noscript>
<script src="../shared/config.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/trophy-list.js"></script>
<script src="../shared/trophies.js"></script>
<script src="../shared/rewards.js"></script>
<script src="../shared/hiscores.js"></script>
<!-- game.js is an ES module: it imports the self-hosted three.js from ../shared/three.module.min.js.
     If WebGL or three.js is unavailable it loads game-2d.js (the classic 2D game) instead. -->
<script type="module" src="game.js"></script>
</body>
</html>
