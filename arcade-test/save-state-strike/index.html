<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Save State Strike</title>
<style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b12; overflow: hidden; font-family: monospace; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    /* HUD above the play area */
    #hud { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; padding: 8px 10px 6px; background: #141424; border-bottom: 2px solid #2de0c8; color: #fff; font-weight: bold; font-size: 16px; line-height: 1.25; letter-spacing: 0.5px; }
    #hud span { white-space: nowrap; }
    #h-hero { color: #ffd166; }
    #h-lives { color: #ff6b9a; }
    #h-meter { flex: 1 0 100%; height: 6px; background: #2a2a40; margin-top: 3px; }
    #h-meter i { display: block; height: 100%; width: 0; background: #2de0c8; }

    #main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage stage" "pl pr"; }
    #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

    .pad { display: flex; align-items: center; gap: 12px; padding: 12px 10px 16px; background: #0b0b12; min-width: 0; position: relative; }
    #pad-l { grid-area: pl; justify-content: flex-start; }
    #pad-r { grid-area: pr; justify-content: flex-end; }
    .pad-row { display: flex; gap: 10px; }
    
    .touch-btn { position: relative; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.55); border-radius: 50%; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: rgba(255,255,255,0.85); touch-action: none; }
    .touch-btn:active, .touch-btn.on { background: rgba(45,224,200,0.35); }
    #btn-shoot { border-color: #ff6b9a; }
    #btn-jump { border-color: #2de0c8; }
    
    #btn-swap { position: absolute; top: -56px; right: 10px; width: 56px; height: 56px; font-size: 14px; border-color: #ffd166; }

    /* Landscape phones: controls sit in side columns, never over the play area */
    @media (orientation: landscape) {
        #main { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); grid-template-areas: "pl stage pr"; }
        .pad { flex-direction: column; justify-content: center !important; gap: 12px; padding: 8px 10px; }
        .pad-row { flex-direction: column; gap: 12px; }
        #hud { font-size: 14px; padding: 5px 12px 4px; }
        #h-meter { flex: 0 0 120px; margin-top: 0; }
        .touch-btn { width: 62px; height: 62px; font-size: 16px; }
        #btn-swap { position: relative; top: auto; right: auto; width: 62px; height: 62px; font-size: 16px; }
    }
    /* Desktop: keyboard play, no touch buttons */
    @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
        #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); grid-template-areas: "stage"; }
        .pad { display: none; }
        #hud { font-size: 18px; padding: 8px 20px 6px; }
        #h-meter { flex: 0 0 200px; }
    }

    #menu-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; z-index: 5; }
    h1 { font-size: 40px; margin: 0 0 10px; color: #00FFCC; text-shadow: 3px 3px 0 #FF00FF; text-align: center; }
    p { font-size: 16px; margin: 0 0 26px; text-align: center; max-width: 600px; line-height: 1.5; white-space: pre-line; }
    .action-btn { padding: 15px 30px; font-size: 24px; font-family: monospace; background: #FF00FF; color: white; border: 4px solid #FFF; cursor: pointer; text-transform: uppercase; font-weight: bold; margin: 5px; }
    .action-btn:active { background: #00FFCC; color: #000; }
    #menu-art { image-rendering: pixelated; margin-bottom: 14px; }
    
    #title-card { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; text-align: center; padding: 20px; }
    #btn-mute { position: fixed; z-index: 30; top: 0; left: 0; width: 40px; height: 40px; padding: 0; border-radius: 8px; border: 2px solid rgba(255,255,255,0.45); background: rgba(11,11,18,0.6); color: rgba(255,255,255,0.85); font: bold 18px monospace; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #btn-mute.muted { color: #ff6b9a; border-color: #ff6b9a; }
    #btn-mute.muted::after { content: ''; position: absolute; left: 5px; right: 5px; top: 17px; height: 2px; background: #ff6b9a; transform: rotate(-45deg); }
    #title-card h2 { font-size: 48px; color: #FF00FF; margin: 0; text-shadow: 2px 2px 0 #00FFCC; }
</style>
</head>
<body>
<div id="app">
    <div id="hud">
        <span id="h-score">SCORE 000000</span>
        <span id="h-lives">LIVES 3</span>
        <span id="h-hero">THE COVER SHOOTER</span>
        <span id="h-res">RESCUES 0/6</span>
        <div id="h-meter"><i id="h-meter-fill"></i></div>
    </div>
    <div id="main">
        <div class="pad" id="pad-l"><div class="pad-row"><div class="touch-btn" id="btn-left">&lt;</div><div class="touch-btn" id="btn-right">&gt;</div></div></div>
        <div id="stage">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="title-card"><h2 id="tc-name">STAGE</h2></div>
        </div>
        <div class="pad" id="pad-r">
            <div class="touch-btn" id="btn-swap">SWP</div>
            <div class="pad-row"><div class="touch-btn" id="btn-shoot">FIRE</div><div class="touch-btn" id="btn-jump">JMP</div></div>
        </div>
    </div>
</div>

<div id="menu-screen">
    <canvas id="menu-art" width="1" height="1"></canvas>
    <h1 id="menu-title">SAVE STATE STRIKE</h1>
    <p id="menu-desc">The Glitch Empire has corrupted the source code! Run, gun, and smash cages to swap heroes.

Keyboard: Arrows/WASD to move, Space/J to Fire, E/Shift to Swap, Up/K to Jump.
Touch: On-screen buttons.</p>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;" id="lvl-btns">
        <button class="action-btn" id="start-btn">START MISSION</button>
        <button class="action-btn" id="next-btn" style="display:none;">NEXT: LEVEL 2</button>
        <button class="action-btn" id="next3-btn" style="display:none;">PLAY LEVEL 3</button>
    </div>
</div>
<button id="btn-mute" tabindex="-1" aria-label="Sound on" title="Sound on (M)">&#9835;</button>
<script>
const canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');
const GW_BASE = 800, GH = 600;
let GW = 800;
let VIEW_SCALE = 1, DPR = 1, VY = 0;

// Game State Persistence
let maxLevel = parseInt(localStorage.getItem('sss_max_level') || '1');
let startBtnLevel = 1; // level the main button starts (retry uses the current level)
let unlockedHeroes = parseInt(localStorage.getItem('sss_unlocked_heroes') || '3');

// ---------- Sound: original synthesized Web Audio (oscillators + noise, no files) ----------
const AU = { ctx: null, master: null, sfxG: null, musG: null, noise: null, muted: localStorage.getItem('sss_muted') === '1', unlocked: false, calls: {}, last: {}, song: 0, step: 0, nextT: 0 };
const AU_MASTER = 0.5;
function auInit() {
    if (AU.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
        const c = new AC(); AU.ctx = c;
        const comp = c.createDynamicsCompressor(); AU.comp = comp; comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
        AU.master = c.createGain(); AU.master.gain.value = AU.muted ? 0 : AU_MASTER; AU.master.connect(comp); comp.connect(c.destination);
        AU.sfxG = c.createGain(); AU.sfxG.gain.value = 0.55; AU.sfxG.connect(AU.master);
        AU.musG = c.createGain(); AU.musG.gain.value = 0.22; AU.musG.connect(AU.master);
        const n = c.createBuffer(1, c.sampleRate, c.sampleRate), d = n.getChannelData(0); let s = 12345;
        for (let i = 0; i < d.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
        AU.noise = n;
    } catch (e) { AU.ctx = null; }
}
function auUnlock() {
    auInit(); const c = AU.ctx; if (!c) return;
    if (c.state !== 'running' && !document.hidden) { const p = c.resume(); if (p && p.catch) p.catch(() => {}); }
    if (!AU.unlocked) { try { const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); } catch (e) {} AU.unlocked = true; }
}
['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, auUnlock, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { const c = AU.ctx; if (!c) return; if (document.hidden) { if (c.state === 'running') c.suspend().catch(() => {}); } else if (AU.unlocked) c.resume().catch(() => {}); });

function tone(type, f0, f1, dur, vol, delay, dest) {
    const c = AU.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || AU.sfxG); o.start(t); o.stop(t + dur + 0.02);
}
function noiseHit(dur, vol, ftype, f0, f1, delay, dest) {
    const c = AU.ctx, t = c.currentTime + (delay || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = AU.noise; f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(f0 || 2000, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || AU.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const NOTE = (m) => 440 * Math.pow(2, (m - 69) / 12);
function sfx(name) {
    AU.calls[name] = (AU.calls[name] || 0) + 1;
    const c = AU.ctx; if (!c) return;
    const now = c.currentTime; if (AU.last[name] !== undefined && now - AU.last[name] < 0.03 && c.state === 'running') return; AU.last[name] = now;
    try {
        switch (name) {
            case 'shoot_shoot': tone('square', 900, 260, 0.08, 0.16); noiseHit(0.05, 0.12, 'highpass', 3000); break;
            case 'shoot_melee': noiseHit(0.14, 0.22, 'bandpass', 900, 3500); tone('triangle', 260, 620, 0.12, 0.14); break;
            case 'shoot_fireball': tone('sawtooth', 160, 520, 0.2, 0.12); tone('triangle', 320, 900, 0.18, 0.1, 0.02); break;
            case 'shoot_roll': tone('square', 520, 820, 0.06, 0.12); tone('square', 820, 600, 0.07, 0.1, 0.06); break;
            case 'jump': tone('square', 280, 620, 0.12, 0.11); break;
            case 'djump': tone('triangle', 520, 1040, 0.1, 0.14); tone('square', 780, 1560, 0.1, 0.06, 0.05); break;
            case 'swap': tone('triangle', 660, 990, 0.07, 0.14); tone('triangle', 990, 1320, 0.07, 0.12, 0.07); break;
            case 'ehit': tone('square', 240, 130, 0.06, 0.12); break;
            case 'edeath': noiseHit(0.28, 0.3, 'lowpass', 2400, 200); tone('square', 420, 60, 0.25, 0.12); break;
            case 'crate': noiseHit(0.18, 0.28, 'lowpass', 1200, 150); tone('triangle', 140, 70, 0.15, 0.15); break;
            case 'block': tone('square', 1250, 1250, 0.05, 0.08); tone('square', 1680, 1500, 0.06, 0.06, 0.01); noiseHit(0.05, 0.1, 'highpass', 5000); break;
            case 'hurt': tone('sawtooth', 420, 70, 0.38, 0.18); noiseHit(0.25, 0.22, 'lowpass', 1500, 200); break;
            case 'rescue': [72, 76, 79, 84].forEach((m, i) => tone('square', NOTE(m), NOTE(m), 0.09, 0.1, i * 0.07)); tone('triangle', NOTE(88), NOTE(88), 0.25, 0.1, 0.28); noiseHit(0.12, 0.15, 'highpass', 2500); break;
            case 'bosshit': tone('square', 160, 90, 0.07, 0.13); noiseHit(0.06, 0.14, 'bandpass', 1800); break;
            case 'roar': tone('sawtooth', 75, 42, 1.0, 0.18); tone('sawtooth', 79, 44, 1.0, 0.16); noiseHit(0.9, 0.2, 'lowpass', 600, 120); break;
            case 'bossdie': noiseHit(1.6, 0.4, 'lowpass', 3000, 80); for (let i = 0; i < 5; i++) tone('sawtooth', 300 - i * 40, 40, 0.4, 0.1, i * 0.18); break;
            case 'start': [64, 67, 71, 76].forEach((m, i) => tone('square', NOTE(m), NOTE(m), 0.1, 0.1, i * 0.09)); tone('triangle', NOTE(52), NOTE(52), 0.4, 0.14); break;
            case 'clear': [[72,0],[76,0.12],[79,0.24],[84,0.36],[79,0.54],[84,0.66]].forEach(([m, d]) => { tone('square', NOTE(m), NOTE(m), 0.14, 0.11, d); tone('triangle', NOTE(m - 12), NOTE(m - 12), 0.14, 0.1, d); }); tone('square', NOTE(88), NOTE(88), 0.5, 0.1, 0.8); break;
            case 'over': [[67,0],[63,0.22],[60,0.44],[55,0.7]].forEach(([m, d]) => tone('triangle', NOTE(m), NOTE(m) * 0.97, 0.3, 0.16, d)); noiseHit(0.5, 0.1, 'lowpass', 500, 100, 0.7); break;
            case 'menu': tone('square', 880, 880, 0.05, 0.1); tone('square', 1320, 1320, 0.06, 0.08, 0.05); break;
            case 'zap_charge': tone('sawtooth', 220, 900, 0.6, 0.05); noiseHit(0.6, 0.05, 'bandpass', 1500, 4000); break;
            case 'zap': noiseHit(0.15, 0.22, 'highpass', 2500); tone('square', 1500, 300, 0.12, 0.1); break;
            case 'bat': tone('triangle', 2400, 1800, 0.07, 0.06); tone('triangle', 2700, 2000, 0.07, 0.05, 0.1); break;
            case 'drone_aim': tone('square', 1800, 1800, 0.04, 0.06); tone('square', 1800, 1800, 0.04, 0.06, 0.12); break;
            case 'drone_drop': tone('square', 900, 200, 0.16, 0.1); break;
            case 'mantis_roar': tone('sawtooth', 110, 55, 1.2, 0.15); tone('square', 220, 90, 1.0, 0.07, 0.1); noiseHit(1.0, 0.18, 'bandpass', 900, 200); [0, 0.3, 0.6].forEach(d => tone('square', 1600, 1200, 0.06, 0.05, d)); break;
            case 'mantis_hit': tone('square', 700, 320, 0.05, 0.1); noiseHit(0.05, 0.12, 'highpass', 4000); break;
            case 'mantis_die': noiseHit(2.0, 0.4, 'lowpass', 4000, 60); for (let i = 0; i < 8; i++) tone('square', 1300 - i * 140, 120, 0.18, 0.07, i * 0.12); break;
            case 'charge': tone('sawtooth', 300, 1200, 0.5, 0.06); tone('square', 600, 2400, 0.5, 0.03); break;
            case 'laser': tone('sawtooth', 1300, 150, 0.25, 0.11); tone('square', 650, 80, 0.25, 0.05); break;
            case 'rain': for (let i = 0; i < 3; i++) tone('triangle', 1600, 400, 0.2, 0.08, i * 0.05); break;
            case 'pounce': tone('sawtooth', 150, 650, 0.35, 0.11); noiseHit(0.3, 0.12, 'bandpass', 600, 2000); break;
            case 'slam': noiseHit(0.45, 0.4, 'lowpass', 900, 60); tone('sine', 90, 35, 0.4, 0.3); break;
            case 'phase': tone('square', 300, 1200, 0.3, 0.09); tone('square', 450, 1800, 0.3, 0.07, 0.1); noiseHit(0.3, 0.14, 'bandpass', 2000); break;
            case 'mute': tone('triangle', 660, 990, 0.08, 0.12); break;
        }
    } catch (e) {}
}

// Looping chiptunes, one per level (original melodies). 16 steps per bar, 4 bars.
const SONGS = {
    1: { bpm: 138,
         lead: 'A4 . C5 E5 . A5 . G5 E5 . D5 . E5 . . . F5 . E5 D5 . C5 . D5 E5 . . . A4 . . . A4 . C5 E5 . A5 . B5 C6 . B5 . G5 . . . A5 . G5 E5 . D5 . C5 B4 . C5 . A4 . . .',
         bass: 'A2 . A3 . A2 . A3 . A2 . A3 . A2 . G2 . F2 . F3 . F2 . F3 . F2 . F3 . G2 . G3 . C3 . C4 . C3 . C4 . G2 . G3 . G2 . B2 . E2 . E3 . E2 . E3 . E2 . E3 . G2 . G#2 .',
         drums: 'k.h.s.h.k.k.s.hh', leadW: 'square', leadV: 0.07, bassW: 'triangle', bassV: 0.16 },
    2: { bpm: 112,
         lead: 'D4 . . F4 . . A4 . . . G4 . F4 . E4 . D4 . . . . . A3 . . . C4 . D4 . . . F4 . . A4 . . C5 . . . A4 . G4 . F4 . E4 . . . G4 . . . E4 . D4 . . . . .',
         bass: 'D2 . . . D2 . . D3 D2 . . . D2 . C2 . A#1 . . . A#1 . . A#2 A#1 . . . A#1 . C2 . F2 . . . F2 . . F3 F2 . . . F2 . E2 . A1 . . . A1 . . A2 A1 . . . C2 . C#2 .',
         drums: 'k...h...k.k.h..h', leadW: 'triangle', leadV: 0.1, bassW: 'square', bassV: 0.05, echo: true },
    3: { bpm: 150,
         lead: 'E5 . B4 E5 . G5 . B5 A5 . G5 . F#5 . D5 . E5 . . . B4 . D5 . E5 . . . G5 . F#5 . C5 . G4 C5 . E5 . G5 F#5 . E5 . D5 . B4 . B4 . D5 . F#5 . A5 . B5 . A5 . F#5 . D#5 .',
         bass: 'E2 . E3 . E2 . E3 . E2 . E3 . E2 . E3 . E2 . E3 . E2 . E3 . E2 . E3 . G2 . G3 . C2 . C3 . C2 . C3 . C2 . C3 . C2 . C3 . B1 . B2 . B1 . B2 . B1 . B2 . D#2 . F#2 .',
         drums: 'k.hhs.hhk.hks.hh', leadW: 'square', leadV: 0.055, bassW: 'sawtooth', bassV: 0.04 }
};
function parseNotes(str) { const nm = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }; return str.trim().split(/\s+/).map(t => { if (t === '.') return 0; const m = /^([A-G])(#?)(\d)$/.exec(t); return m ? 12 * (+m[3] + 1) + nm[m[1]] + (m[2] ? 1 : 0) : 0; }); }
Object.values(SONGS).forEach(s => { s.L = parseNotes(s.lead); s.B = parseNotes(s.bass); });
function musicStart(lvl) { AU.song = lvl; AU.step = 0; AU.nextT = 0; }
function musicStop() { AU.song = 0; }
function musStep(s, i, t) {
    const c = AU.ctx, dur = 60 / s.bpm / 4, L = s.L[i % s.L.length], B = s.B[i % s.B.length], dr = s.drums[i % 16];
    const play = (w, f, d, v, at) => { const o = c.createOscillator(), g = c.createGain(); o.type = w; o.frequency.setValueAtTime(f, at); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(v, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + d); o.connect(g); g.connect(AU.musG); o.start(at); o.stop(at + d + 0.02); };
    if (L) { play(s.leadW, NOTE(L), dur * 1.8, s.leadV, t); if (s.echo) play(s.leadW, NOTE(L), dur * 1.6, s.leadV * 0.35, t + dur * 3); AU.calls.music_note = (AU.calls.music_note || 0) + 1; }
    if (B) play(s.bassW, NOTE(B), dur * 1.6, s.bassV, t);
    if (dr === 'k') { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.connect(g); g.connect(AU.musG); o.start(t); o.stop(t + 0.16); }
    else if (dr === 's') noiseHit(0.12, 0.22, 'bandpass', 1800, 900, t - c.currentTime, AU.musG);
    else if (dr === 'h') noiseHit(0.03, 0.1, 'highpass', 7000, 0, t - c.currentTime, AU.musG);
}
setInterval(() => {
    const c = AU.ctx, s = SONGS[AU.song]; if (!c || !s || c.state !== 'running') return;
    const dur = 60 / s.bpm / 4;
    if (AU.nextT < c.currentTime) AU.nextT = c.currentTime + 0.05;
    try { while (AU.nextT < c.currentTime + 0.2) { musStep(s, AU.step, AU.nextT); AU.nextT += dur; AU.step = (AU.step + 1) % 64; } } catch (e) {}
}, 40);

function setMuted(m) {
    AU.muted = m; localStorage.setItem('sss_muted', m ? '1' : '0');
    if (AU.master) AU.master.gain.setValueAtTime(m ? 0 : AU_MASTER, AU.ctx.currentTime);
    const b = document.getElementById('btn-mute'); if (b) { b.classList.toggle('muted', m); b.setAttribute('aria-label', m ? 'Sound off' : 'Sound on'); b.title = m ? 'Sound off (M)' : 'Sound on (M)'; }
    if (!m) sfx('mute');
}


// ---------- Pixel art, drawn in code ----------
const PX = 2;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const BG = { 1: null, 2: null };
const BG_TOP = -60, BG_H = 330;
function bgRng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function bgLayer(w, fn) { const c = mk(w, BG_H), g = c.getContext('2d'); g.imageSmoothingEnabled = false; const p = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), ww, hh); }; fn(p, g, w); return c; }

function pxText(p, str, x, y, col) { for (const ch of str) { const g = FONT35[ch]; if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') p(x + (i % 3), y + Math.floor(i / 3), 1, 1, col); x += 4; } }
function pxTextW(str) { return str.length * 4 - 1; }
function radial(g, x, y, r, col) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }

function buildBgL1() {
    const L = { lights: [], screens: [], leds: [], stars: [] };
    // 1. far: night sky, digital moon, horizon glow, stars
    L.far = bgLayer(640, (p, g, W) => {
        const gr = g.createLinearGradient(0, 0, 0, BG_H);
        gr.addColorStop(0, '#07071a'); gr.addColorStop(0.45, '#100f2a'); gr.addColorStop(0.72, '#1f1838'); gr.addColorStop(0.86, '#171329'); gr.addColorStop(1, '#0b0a16');
        g.fillStyle = gr; g.fillRect(0, 0, W, BG_H);
        const r = bgRng(11);
        for (let i = 0; i < 140; i++) { const x = r() * W, y = r() * 200, b = r(); p(x, y, 1, 1, b > 0.85 ? '#5a5d8c' : (b > 0.5 ? '#36385e' : '#25264a')); if (b > 0.93) L.stars.push([Math.round(x), Math.round(y)]); }
        // moon with 3-tone shading and scanlines
        const mx = 470, my = 72, R = 26;
        radial(g, mx, my, 70, 'rgba(120,90,200,0.16)');
        for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
            const d = dx * dx + dy * dy; if (d > R * R) continue;
            const lit = (dx + 9) * (dx + 9) + (dy + 9) * (dy + 9), shade = (dx - 10) * (dx - 10) + (dy - 10) * (dy - 10);
            let col = '#3d3a66'; if (lit < 170) col = '#625f9c'; else if (lit < 420) col = '#4e4b84'; else if (shade < 160) col = '#2d2a52';
            if (((dy + R) % 4) === 0) col = '#2a2849';

        p(mx + 6, my - 8, 6, 4, '#2f2d55'); p(mx - 12, my + 6, 8, 5, '#2f2d55'); p(mx + 10, my + 10, 4, 3, '#34325c');
        // perspective grid floor near the horizon, very faint
        g.fillStyle = 'rgba(160,80,220,0.10)';

            // Ceilings for droppers
            if (Math.random() > 0.3) blocks.push({x: x*T, y: -T, w: T, h: T*3.5, solid: true, type: 'ceil'}); // bottom edge at y 100 so portrait (which trims 80 rows of sky) still shows it
            
            if (x > 20 && x < L_END - 20 && Math.random() < 0.2 && pitRun === 0 && !nearCage) {
                blocks.push({x: x*T, y: GH - T*3, w: T, h: T, solid: true, type: 'dest', hp: 3});
            }
            if (x > 15 && x < L_END - 20 && Math.random() < 0.1) {
                let py = GH - T*5 - Math.random() * T * 2;
                blocks.push({x: x*T, y: py, w: T*3, h: T, solid: true, type: 'plat'});
                if (Math.random() < 0.5) enemies.push({x: x*T+T, y: py-28, w: 28, h: 28, vx: -1.5, vy: 0, hp: 2, type: 'turret', flash: 0, dir: -1, lockedDir: -1, aimT: 0});
            }
            if (cageTile) cages.push({x: x*T, y: GH - T*2 - 40, w: 40, h: 40, active: true});
            
            if (x > 15 && x < L_END - 20 && Math.random() < 0.12 && pitRun === 0 && !nearCage) {
                let et = Math.random();
                if (et < 0.4) enemies.push({x: x*T, y: GH - T*3, w: 28, h: 28, vx: -2, vy: 0, hp: 2, type: 'hop', flash: 0});
                else if (et < 0.7) {
                    // Place dropper under a ceiling block if possible
                    let cx = x*T;
                    if (blocks.some(b => b.type==='ceil' && b.x === cx)) {
                        enemies.push({x: cx, y: T*2.5, w: 28, h: 28, vx: 0, vy: 0, hp: 1, type: 'drop', flash: 0, dropped: false});
                    }
                }
                else enemies.push({x: x*T, y: GH - T*3, w: 28, h: 44, vx: 0, vy: 0, hp: 3, type: 'turret', flash: 0, dir: -1, lockedDir: -1, aimT: 0});
            }
        }
    }
    blocks.push({x: L_END*T, y: -T, w: T, h: GH+T*2, solid: true, type: 'wall'});
    
    if (currentLevel === 2) {
        for (let i=0; i<6; i++) boss.segments.push({x: L_END*T + i*32, y: GH/2, w: 44, h: 44, hp: 12, maxHp: 12, flash: 0, type: i===0?'head':'body'});
    }

    if (currentLevel === 3) setupBoss3();
    const title = currentLevel === 1 ? "STAGE 1: CHECKERED ZONE" : (currentLevel === 2 ? "STAGE 2: CARTRIDGE CAVERNS" : "STAGE 3: SILICON CITADEL");
    sfx('start'); musicStop();
    showTitleCard(title, () => { state = 'PLAY'; musicStart(currentLevel); });
}

function spawnParticles(x, y, color, n) {
    for (let i=0; i<(n||12); i++) particles.push({ x: x+16, y: y+16, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 15+Math.random()*15, max: 30, c: color });
}

function shoot(h) {
    sfx('shoot_' + h.type);
    let bx = player.dir === 1 ? player.x + player.w : player.x - h.pW;
    let by = player.y + 15 - h.pH/2;
    if (h.type === 'melee') {
        bullets.push({x: bx, y: player.y + player.h/2 - h.pH/2, w: h.pW, h: h.pH, vx: player.vx, vy: 0, life: 8, isPlayer: true, dmg: 2, c: h.pColor, melee: true, dir: player.dir, hits: []});
        player.vx = player.dir * 8; player.lungeT = 12; // Dash framing
    } else if (h.type === 'fireball') {
        bullets.push({x: bx, y: player.y + 18 - h.pH/2, w: h.pW, h: h.pH, vx: h.pSpd * player.dir, vy: 0, life: 60, isPlayer: true, dmg: 3, c: h.pColor, orb: true});
    } else if (h.type === 'roll') {
        let sd = player.dir;
        bullets.push({x: bx, y: player.y + player.h - h.pH - 4, w: h.pW, h: h.pH, vx: h.pSpd * sd, vy: -2, life: 80, isPlayer: true, dmg: 2, c: h.pColor, roll: true, spinDir: sd, hits: []});
        player.muzzle = 4;
    } else {
        bullets.push({x: bx + player.dir * 6, y: by + 10, w: h.pW, h: h.pH, vx: h.pSpd * player.dir, vy: 0, life: 60, isPlayer: true, dmg: 1, c: h.pColor});
        player.muzzle = 4;
    }
}

function safeSpot(prefX) {
    const pw = player.w, ph = player.h, minX = cx + 20, maxX = cx + GW - 60;
    let best = null, bd = Infinity;
    for (const b of blocks) {
        if (!b.solid || (b.type !== 'ground' && b.type !== 'plat')) continue;
        const lo = Math.max(b.x, minX), hi = Math.min(b.x + b.w - pw, maxX);
        if (hi < lo) continue;
        const x = Math.min(Math.max(prefX, lo), hi);
        const test = { x: x - 4, y: b.y - ph - 2, w: pw + 8, h: ph + 2 };
        if (blocks.some(o => o.solid && rectIntersect(test, o))) continue;
        let d = Math.abs(x - prefX);
        if (b.type === 'plat') d += 160;
        if (b.type === 'ground') {
            const left = blocks.some(o => o.solid && o.type === 'ground' && o.x === b.x - T);
            const right = blocks.some(o => o.solid && o.type === 'ground' && o.x === b.x + T);
            if (!left || !right) d += 80;
        }
        if (enemies.some(e => e.hp > 0 && Math.abs(e.x - x) < 70 && Math.abs(e.y - b.y) < 80)) d += 120;
        if (d < bd) { bd = d; best = { x: x, y: b.y - ph }; }
    }
    return best || { x: cx + 100, y: GH - T*2 - ph };
}

function damagePlayer(fromPit) {
    if (player.invuln > 0 && !fromPit) return;
    shake = 15; lives--; player.flash = 10;
    sfx('hurt');
    spawnParticles(player.x - 5, player.y, '#ffffff', 10);
    if (lives <= 0) {
        state = 'OVER'; musicStop(); sfx('over');
        document.getElementById('menu-screen').style.display = 'flex';
        document.getElementById('menu-title').innerText = 'GAME OVER';
        document.getElementById('menu-title').style.color = '#FF0000';
        document.getElementById('menu-desc').innerText = `Final Score: ${score}\nRescues: ${rescues}`;
        document.getElementById('start-btn').innerText = 'RETRY MISSION';
        startBtnLevel = currentLevel;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('next3-btn').style.display = 'none';
        
    } else {
        const s = safeSpot(fromPit ? player.safeX : player.x);
        player.x = s.x; player.y = s.y; player.vx = 0; player.vy = 0; player.grounded = true; player.invuln = RESPAWN_INVULN; player.jumps = 0;
        bullets.forEach(b => { if (!b.isPlayer) b.life = 0; });
        popups.push({x: player.x - 20, y: player.y - 10, t: "READY!", l: 60});
    }
}

function winLevel() {
    state = 'WIN'; musicStop(); sfx('clear');
    if (currentLevel === 1 && maxLevel < 2) {
        maxLevel = 2; localStorage.setItem('sss_max_level', '2');
    }
    if (currentLevel === 2 && maxLevel < 3) {
        maxLevel = 3; localStorage.setItem('sss_max_level', '3');
    }
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('menu-title').innerText = 'MISSION CLEAR';
    document.getElementById('menu-title').style.color = '#00FFCC';
    document.getElementById('menu-desc').innerText = (currentLevel === 1 ? 'You destroyed the Glitch Core!' : (currentLevel === 2 ? 'You stopped the Rewind Wurm!' : 'You shut down the Mainframe Mantis!')) + `\nFinal Score: ${score}\nRescues: ${rescues}`;
    const nb = document.getElementById('next-btn');
    if (currentLevel === 1) {
        startBtnLevel = 1; document.getElementById('start-btn').innerText = 'RETRY LEVEL 1';
        nb.innerText = 'NEXT: LEVEL 2'; nb.style.display = 'block';
    } else if (currentLevel === 2) {
        startBtnLevel = 1; document.getElementById('start-btn').innerText = 'PLAY LEVEL 1';
        nb.innerText = 'PLAY LEVEL 2 AGAIN'; nb.style.display = 'block';
        const n3 = document.getElementById('next3-btn'); n3.innerText = 'NEXT: LEVEL 3'; n3.style.display = 'block';
    } else {
        startBtnLevel = 1; document.getElementById('start-btn').innerText = 'PLAY LEVEL 1';
        nb.innerText = 'PLAY LEVEL 2'; nb.style.display = 'block';
        const n3 = document.getElementById('next3-btn'); n3.innerText = 'PLAY LEVEL 3 AGAIN'; n3.style.display = 'block';
    }
}

function update() {
    tick++;
    for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 0.5; p.l--; if (p.l <= 0) popups.splice(i, 1); }
    for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.y += 6; if (d.y > GH) drops.splice(i, 1); }

    if (shake > 0) shake--;
    if (boss.flash > 0) boss.flash--;
    
    // Spawn drops in Level 2
    if (currentLevel === 2 && state === 'PLAY' && Math.random() < 0.05) {
        let sx = cx + Math.random() * GW;
        let ceil = blocks.find(b => b.type === 'ceil' && Math.abs(b.x - sx) < T);
        if (ceil) drops.push({x: ceil.x + Math.random()*T, y: ceil.y + ceil.h});
    }

    if (state !== 'PLAY') return;
    
    let hInfo = HEROES[currentHero];
    if (player.h !== hInfo.h) player.y += player.h - hInfo.h;
    player.w = hInfo.w; player.h = hInfo.h;

    let mv = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) mv = -hInfo.speed;
    if (keys['ArrowRight'] || keys['KeyD']) mv = hInfo.speed;
    if (Math.abs(player.vx) > hInfo.speed && player.fireTimer > hInfo.fireDelay - 6) player.vx *= 0.8;
    else player.vx = mv;
    if (mv !== 0) player.dir = Math.sign(mv);

    const swapNow = !!(keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyE']);
    if ((swapNow || swapQueued) && !player.swapHeld) {
        currentHero = (currentHero + 1) % unlockedHeroes;
        sfx('swap');
        spawnParticles(player.x, player.y, '#fff', 10);
        popups.push({x: player.x-20, y: player.y-20, t: "SWAPPED!", l: 30});
    }
    player.swapHeld = swapNow; swapQueued = false;

    const jumpNow = !!(keys['ArrowUp'] || keys['KeyW'] || keys['KeyK']);
    if (jumpNow && !player.jumpHeld) {
        if (player.grounded) {
            player.vy = hInfo.jump; player.grounded = false; player.jumps = 1; sfx('jump');
        } else if (currentHero === 3 && player.jumps < 2) {
            player.vy = hInfo.jump; player.jumps = 2; sfx('djump');
            spawnParticles(player.x, player.y+player.h, '#fff', 10);
        }
    }
    player.jumpHeld = jumpNow;

    if ((keys['Space'] || keys['KeyJ']) && player.fireTimer <= 0) { shoot(hInfo); player.fireTimer = hInfo.fireDelay; }

    if (player.fireTimer > 0) player.fireTimer--;
    if (player.invuln > 0) player.invuln--;
    if (player.flash > 0) player.flash--;
    if (player.muzzle > 0) player.muzzle--;
    if (player.lungeT > 0) player.lungeT--;

    player.vy += 0.6; player.vy = Math.min(player.vy, 12);
    player.x += player.vx;
    let hitX = blocks.find(b => b.solid && rectIntersect(player, b));
    if (hitX) { player.x = player.vx > 0 ? hitX.x - player.w : hitX.x + hitX.w; player.vx = 0; }

    player.y += player.vy; player.grounded = false;
    let hitY = blocks.find(b => b.solid && rectIntersect(player, b));
    if (hitY) {
        if (player.vy > 0) {
            player.y = hitY.y - player.h; player.grounded = true; player.jumps = 0;
            if (hitY.type === 'ground' || hitY.type === 'plat') player.safeX = Math.min(Math.max(player.x, hitY.x), hitY.x + hitY.w - player.w);
        } else { player.y = hitY.y + hitY.h; }
        player.vy = 0;
    }
    if (player.grounded && player.vx !== 0) player.runT++; else player.runT = 0;

    if (player.y > GH + 100) damagePlayer(true);
    if (player.x < cx) player.x = cx;

    let camTarget = player.x - GW/3;
    if (camTarget > L_END*T - GW) camTarget = L_END*T - GW;
    cx = Math.max(cx, camTarget);
    
    // Y Camera to keep action visible on tall screens (mostly for L2 droppers)
    let cyTarget = (currentLevel === 2 || currentLevel === 3) ? player.y - GH/2 + 50 : 0;
    if (cyTarget > 0) cyTarget = 0;
    if (cyTarget < -T) cyTarget = -T;
    cy += (cyTarget - cy) * 0.1;
    
    if (cx >= L_END*T - GW - 10) { if (!boss.active) sfx(currentLevel === 3 ? 'mantis_roar' : 'roar'); boss.active = true; }

    enemies.forEach(e => {
        if (e.hp <= 0) return;
        if (e.flash > 0) e.flash--;
        
        if (e.type === 'bot' || e.type === 'hop' || e.type === 'spark') {
            e.vy += 0.6; e.vy = Math.min(e.vy, 12);
            e.y += e.vy;
            if (e.y > GH + 200) { e.hp = 0; return; }
            let hy = blocks.find(b => b.solid && rectIntersect(e, b));
            if (hy) {
                if (e.vy > 0) { e.y = hy.y - e.h; e.grounded = true; } else { e.y = hy.y + hy.h; }
                e.vy = 0;
            } else { e.grounded = false; }
            
            if (e.type === 'hop' && e.grounded && Math.random() < 0.02 && Math.abs(player.x - e.x) < 300) {
                e.vy = -10; e.vx = (player.x < e.x ? -3.5 : 3.5); e.grounded = false;
            }
            
            e.x += e.vx;
            let hx = blocks.find(b => b.solid && rectIntersect(e, b));
            if (hx) { e.vx *= -1; e.x += e.vx; }

            if (e.type === 'bot' && e.x > cx && e.x < cx+GW && Math.random() < 0.004) {
                let dx = player.x < e.x ? -1 : 1;
                bullets.push({x: dx<0 ? e.x-10 : e.x+e.w, y: e.y+e.h/2-4, w:8, h:8, vx: dx*3.5, vy: 0, life: 110, player: false, dmg: 1, c: '#ffd23f'});
            }
            if (e.type === 'spark') updateSpark(e);
        } else if (e.type === 'drop') {
            if (!e.dropped && Math.abs(player.x - e.x) < 60) e.dropped = true;
            if (e.dropped) {
                e.vy += 0.6; e.vy = Math.min(e.vy, 12); e.y += e.vy;
                if (blocks.find(b => b.solid && rectIntersect(e, b))) { e.hp = 0; spawnParticles(e.x, e.y, '#888', 8); return; }
            }
        } else if (e.type === 'bat') { updateBat(e); if (e.hp <= 0) return;
        } else if (e.type === 'drone') { updateDrone(e); if (e.hp <= 0) return;
        } else if (e.type === 'turret') {
            // Fixed facing that turns slowly
            // turns only after the player has been behind it for 1.5 s
            if (e.lockedDir === undefined) e.lockedDir = e.dir || -1;
            const pDir = player.x + player.w/2 < e.x + e.w/2 ? -1 : 1;
            if (pDir !== e.lockedDir) { e.aimT = (e.aimT > 0 ? e.aimT : 0) + 1; if (e.aimT >= 90) { e.lockedDir = pDir; e.aimT = 0; } }
            else e.aimT = 0;
            e.dir = e.lockedDir;

            if (Math.abs(player.x - e.x) < 400 && Math.random() < 0.008) {
                bullets.push({x: e.dir<0 ? e.x-12 : e.x+e.w, y: e.y+4, w:12, h:4, vx: e.dir*4.5, vy: 0, life: 110, player: false, dmg: 1, c: '#ff3355'});
            }
        }
        if (player.invuln <= 0 && rectIntersect(player, e)) damagePlayer();
    });

    if (currentLevel === 3) nameNewEnemies3();
    if (boss.active && !boss.dead) {
        if (currentLevel === 3) updateBoss3();
        else if (currentLevel === 1) {
            boss.y += boss.vy;
            if ((boss.y < Math.max(50, VY + 40) && boss.vy < 0) || (boss.y > GH - 200 && boss.vy > 0)) boss.vy *= -1;
            boss.timer++;
            if (boss.timer > 80) {
                boss.timer = 0;
                for (let a = -2; a <= 2; a++) bullets.push({x: boss.x, y: boss.y + boss.h/2, w: 12, h: 12, vx: -6, vy: a*1.5, life: 150, player: false, dmg: 1, c: '#ff2bd6'});
            }
            if (player.invuln <= 0 && rectIntersect(player, boss)) damagePlayer();
        } else {
            let allDead = true;
            boss.timer++;
            boss.segments.forEach((seg, i) => {
                if (seg.hp <= 0) return;
                allDead = false;
                if (seg.flash > 0) seg.flash--;
                let lead = null; for (let k = i - 1; k >= 0; k--) if (boss.segments[k].hp > 0) { lead = boss.segments[k]; break; }
                let tgtX = !lead ? cx + GW - 120 + Math.sin(boss.timer/30)*80 : lead.x + 36;
                let tgtY = !lead ? GH/2 + 20 + Math.sin(boss.timer/25)*160 : lead.y;
                seg.x += (tgtX - seg.x) * 0.15;
                seg.y += (tgtY - seg.y) * 0.15;
                if (player.invuln <= 0 && rectIntersect(player, seg)) damagePlayer();
            });
            if (allDead) {
                boss.dead = true; score += 10000; shake = 30; sfx('bossdie');
                for (let k = 0; k < 8; k++) spawnParticles(boss.segments[0].x + Math.random()*100, GH/2 + (Math.random()-0.5)*200, '#ff2bd6', 14);
                setTimeout(winLevel, 2000);
            }
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if (b.melee) { b.x = b.dir === 1 ? player.x + player.w : player.x - b.w; b.y = player.y + player.h/2 - b.h/2; }
        else if (b.roll) {
            b.vy += 0.5; b.x += b.vx; b.y += b.vy;
            let hy = blocks.find(blk => blk.solid && rectIntersect({x:b.x, y:b.y, w:b.w, h:b.h}, blk));
            if (hy) { b.y = b.vy > 0 ? hy.y - b.h : hy.y + hy.h; b.vy = -6; }
            let hx = blocks.find(blk => blk.solid && rectIntersect({x:b.x, y:b.y, w:b.w, h:b.h}, blk));
            if (hx) { b.vx *= -1; b.x += b.vx; } // Keep spin direction same even after bounce
        }
        else { b.x += b.vx; b.y += b.vy; }
        
        b.life--;
        if (b.life <= 0) { bullets.splice(i,1); continue; }

        let hitB = blocks.find(blk => blk.solid && rectIntersect(b, blk));
        if (hitB) {
            if (hitB.type === 'dest' && (!b.melee || !b.hits.includes(hitB))) {
                if (b.melee || b.roll) b.hits.push(hitB);
                hitB.hp -= b.dmg; hitB.flash = 5; sfx(hitB.hp <= 0 ? 'crate' : 'ehit');
                if (hitB.hp <= 0) { hitB.solid = false; spawnParticles(hitB.x, hitB.y, '#a0703f'); score += 50; shake = 4; }
            }
            if (!b.melee && !b.roll) { spawnParticles(b.x - 14, b.y - 14, b.c, 4); bullets.splice(i,1); continue; }
        }

        if (b.isPlayer) {
            let hitE = enemies.find(e => e.hp > 0 && rectIntersect(b, e) && (!b.melee || !b.hits.includes(e)) && (!b.roll || !b.hits.includes(e)));
            if (hitE) {
                if (hitE.type === 'turret') {
                    let hitsFront = (b.vx > 0 && hitE.dir === -1) || (b.vx < 0 && hitE.dir === 1);
                    if (hitsFront && !b.melee && player.lungeT <= 0) { 
                        sfx('block');
                        spawnParticles(b.x, b.y, '#2de0c8', 4); 
                        if(!b.roll) bullets.splice(i, 1); 
                        continue; 
                    }
                }
                if (b.melee || b.roll) b.hits.push(hitE);
                hitE.hp -= b.dmg; hitE.flash = 6; sfx(hitE.hp <= 0 ? 'edeath' : 'ehit');
                if (hitE.hp <= 0) { spawnParticles(hitE.x, hitE.y, '#ff5544'); spawnParticles(hitE.x, hitE.y, '#ffcc00', 6); score += 100; popups.push({x: hitE.x, y: hitE.y, t: "+100", l: 30}); shake = 3; }
                if (!b.melee && !b.roll) { bullets.splice(i,1); continue; }
            }
            
            if (boss.active && !boss.dead) {
                if ((currentLevel === 1 || currentLevel === 3) && rectIntersect(b, boss) && (!b.melee || !b.hits.includes(boss)) && (!b.roll || !b.hits.includes(boss))) {
                    if (b.melee || b.roll) b.hits.push(boss);
                    boss.hp -= b.dmg; boss.flash = 4; spawnParticles(b.x + Math.random()*20 - 16, b.y - 10, '#ffff66', 6); sfx(currentLevel === 3 ? 'mantis_hit' : 'bosshit');
                    if (boss.hp <= 0 && currentLevel === 3) {
                        boss.dead = true; score += 15000; shake = 30; sfx('mantis_die'); boss.marks = [];
                        for (let k = 0; k < 8; k++) spawnParticles(boss.x + Math.random()*110, boss.y + Math.random()*110, k % 2 ? '#3fe07a' : '#ffd166', 14);
                        setTimeout(winLevel, 2000);
                    } else if (boss.hp <= 0) {
                        boss.dead = true; score += 5000; shake = 30; sfx('bossdie');
                        for (let k = 0; k < 5; k++) spawnParticles(boss.x + Math.random()*100, boss.y + Math.random()*100, k % 2 ? '#ff2bd6' : '#20f0ff', 14);
                        setTimeout(winLevel, 2000);
                    }
                    if (!b.melee && !b.roll) { bullets.splice(i,1); continue; }
                } else if (currentLevel === 2) {
                    let hitSeg = boss.segments.find(s => s.hp > 0 && rectIntersect(b, s) && (!b.melee || !b.hits.includes(s)) && (!b.roll || !b.hits.includes(s)));
                    if (hitSeg) {
                        if (b.melee || b.roll) b.hits.push(hitSeg);
                        hitSeg.hp -= b.dmg; hitSeg.flash = 4; spawnParticles(b.x, b.y, '#fff', 4); sfx(hitSeg.hp <= 0 ? 'edeath' : 'bosshit');
                        if (!b.melee && !b.roll) { bullets.splice(i,1); continue; }
                    }
                }
            }
            let hitC = cages.find(c => c.active && rectIntersect(b, c));
            if (hitC) {
                hitC.active = false; sfx('rescue'); spawnParticles(hitC.x, hitC.y, '#c2c8d2'); spawnParticles(hitC.x, hitC.y, '#ffe066', 8); rescues++; score += 500;
                if (currentLevel >= 2 && unlockedHeroes === 3) {
                    unlockedHeroes = 4; localStorage.setItem('sss_unlocked_heroes', '4');
                    popups.push({x: hitC.x-80, y: hitC.y-20, t: "TURBO COURIER UNLOCKED!", l: 90});
                } else {
                    popups.push({x: hitC.x-40, y: hitC.y-20, t: "RESCUED!", l: 60});
                }
                currentHero = (currentHero + 1) % unlockedHeroes;
                shake = 10; player.invuln = Math.max(player.invuln, 60);
                if (!b.melee && !b.roll) { bullets.splice(i,1); continue; }
            }
        } else {
            if (player.invuln <= 0 && rectIntersect(b, player)) { damagePlayer(); bullets.splice(i,1); continue; }
        }
    }
}

// ---------- Drawing ----------
function heroPose() {
    if (player.flash > 0) return 'hit';
    const h = HEROES[currentHero];
    if (player.fireTimer > h.fireDelay - (h.type === 'shoot' ? 5 : 10)) return 'shoot';
    if (!player.grounded) return 'jump';
    if (player.vx !== 0) return 'run' + (Math.floor(player.runT / 6) % 4);
    return Math.floor(tick / 32) % 2 ? 'idle1' : 'idle0';
}
function drawHero() {
    const set = SPR.heroes[currentHero][heroPose()];
    const white = player.flash > 0;
    const img = player.dir === 1 ? (white ? set.wr : set.r) : (white ? set.wl : set.l);
    const sw = img.width * PX, sh = img.height * PX;
    const left = player.dir === 1 ? player.x + player.w/2 - 11.5*PX : player.x + player.w/2 - (img.width - 11.5)*PX;
    const top = player.y + player.h - 25*PX;
    ctx.drawImage(img, Math.round(left), Math.round(top), sw, sh);
    if (currentHero === 0 && player.muzzle > 0) {
        const mx = player.dir === 1 ? left + 25*PX : left + (img.width - 25)*PX;
        const my = top + 12.5*PX;
        glow(mx, my, 12, 'rgba(255,220,120,0.45)');
        ctx.fillStyle = '#fff6c0'; ctx.fillRect(mx - 4, my - 2, 8, 4); ctx.fillRect(mx - 2, my - 5, 4, 10);
        ctx.fillStyle = '#ffb020'; ctx.fillRect(mx + player.dir * 4 - 2, my - 1, 6 * player.dir || 6, 2);
    }
}
function glow(x, y, r, col) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();
}
function drawBullet(b) {
    const mx = b.x + b.w/2, my = b.y + b.h/2;
    if (b.melee) {
        const a = b.life / 8, d = b.dir;
        ctx.save(); ctx.globalAlpha = Math.min(1, a + 0.2); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = '#ff9ad0'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(mx - d * 10, my, 18, d === 1 ? -1.2 : Math.PI - 1.2, d === 1 ? 1.2 : Math.PI + 1.2); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx - d * 10, my, 18, d === 1 ? -0.9 : Math.PI - 0.9, d === 1 ? 0.9 : Math.PI + 0.9); ctx.stroke();
        ctx.restore(); return;
    }
    if (b.roll) {
        ctx.save(); ctx.translate(mx, my); ctx.rotate(tick * 0.5 * b.spinDir);
        ctx.fillStyle = '#a0703f'; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
        ctx.fillStyle = '#d6dbe4'; ctx.fillRect(-b.w/2, -2, b.w, 4); ctx.fillRect(-2, -b.h/2, 4, b.h);
        ctx.restore(); return;
    }
    if (b.orb) {
        glow(mx, my, 16, 'rgba(196,92,255,0.35)'); glow(mx, my, 10, 'rgba(45,224,200,0.5)');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(mx - 4, my - 4, 8, 8);
        ctx.fillStyle = '#2de0c8'; const s = (tick % 8 < 4) ? 7 : 5; ctx.fillRect(mx - s, my - 1, 2, 2); ctx.fillRect(mx + s - 2, my - 1, 2, 2); ctx.fillRect(mx - 1, my - s, 2, 2); ctx.fillRect(mx - 1, my + s - 2, 2, 2);
        return;
    }
    if (b.isPlayer) {
        glow(mx, my, 8, 'rgba(127,246,255,0.35)');
        ctx.fillStyle = '#7ff6ff'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(b.vx > 0 ? b.x + b.w - 5 : b.x, b.y + 1, 5, 2); return;
    }
    glow(mx, my, b.w, b.glow || (b.c === '#ff2bd6' ? 'rgba(255,43,214,0.4)' : 'rgba(255,210,63,0.4)'));
    ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + b.w/4, b.y + b.h/4, b.w/2, b.h/2);
}
function drawBoss() {
    if (currentLevel === 3) { drawBoss3(); return; }
    if (currentLevel === 1) {
        const f = boss.flash > 0 ? 0 : (tick % 60 < 5 ? 2 : Math.floor(tick / 15) % 2);
        const src = boss.flash > 0 ? SPR.bossW : SPR.boss[f];
        const bx = boss.x - PX, by = boss.y - PX, S = src.width * PX;
        const glitchy = Math.random() < (boss.hp < boss.maxHp / 2 ? 0.45 : 0.25);
        if (glitchy) {
            ctx.save(); ctx.globalAlpha = 0.45; ctx.globalCompositeOperation = 'lighter';
            ctx.drawImage(SPR.bossM, bx - 5, by, S, S); ctx.drawImage(SPR.bossC, bx + 5, by, S, S); ctx.restore();
        }
        if (Math.random() < 0.04) ctx.globalAlpha = 0.35;
        const strips = 11, sh = src.height / strips;
        for (let s = 0; s < strips; s++) {
            const dx = glitchy && Math.random() < 0.35 ? Math.round((Math.random() - 0.5) * 18) : 0;
            ctx.drawImage(src, 0, s * sh, src.width, sh, bx + dx, by + s * sh * PX, S, sh * PX);
        }
        ctx.globalAlpha = 1;
        if (glitchy) {
            for (let k = 0; k < 3; k++) { ctx.fillStyle = Math.random() < 0.5 ? '#ff2bd6' : '#20f0ff'; ctx.fillRect(bx + Math.random() * S, by + Math.random() * S, 6 + Math.random() * 22, 2); }
        }
        const hy = Math.max(boss.y - 22, VY + 22);
        ctx.fillStyle = '#400'; ctx.fillRect(boss.x, hy, boss.w, 10);
        ctx.fillStyle = '#ff2bd6'; ctx.fillRect(boss.x, hy, boss.w * (boss.hp/boss.maxHp), 10);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left'; ctx.fillText('GLITCH CORE', boss.x, hy - 6);
    } else {
        boss.segments.forEach((seg, i) => {
            if (seg.hp <= 0) return;
            const src = seg.flash > 0 ? tintC(SPR.wurm[i===0?0:1].r, '#fff') : SPR.wurm[i===0?0:1].r;
            ctx.save(); ctx.translate(seg.x + seg.w/2, seg.y + seg.h/2); ctx.rotate((tick + i*10) * 0.1);
            ctx.drawImage(src, -24, -24, 48, 48); ctx.restore();
            const hy = seg.y - 12;
            ctx.fillStyle = '#400'; ctx.fillRect(seg.x, hy, seg.w, 4);
            ctx.fillStyle = '#ff2bd6'; ctx.fillRect(seg.x, hy, seg.w * (seg.hp/seg.maxHp), 4);
        });
    }
}
function tileAt(img, x, y) { ctx.drawImage(img, 1, 1, 20, 20, x, y, T, T); }

function draw() {
    ctx.setTransform(VIEW_SCALE * DPR, 0, 0, VIEW_SCALE * DPR, 0, -(VY + cy) * VIEW_SCALE * DPR);
    ctx.imageSmoothingEnabled = false;
    
    if (currentLevel === 1) drawBgL1(); else if (currentLevel === 2) drawBgL2(); else drawBgL3();

    ctx.save();
    let sx = shake > 0 ? (Math.random()-0.5)*shake : 0;
    let sy = shake > 0 ? (Math.random()-0.5)*shake : 0;
    ctx.translate(Math.round(-cx + sx), Math.round(sy));

    const tSet = currentLevel === 1 ? SPR.tile : (currentLevel === 2 ? SPR.tile2 : SPR.tile3);
    blocks.forEach(b => {
        if (!b.solid || b.x + b.w < cx - 50 || b.x > cx + GW + 50) return;
        if (b.type === 'ground') { tileAt(tSet.top, b.x, b.y); for (let yy = b.y + T; yy < b.y + b.h; yy += T) tileAt(tSet.fill, b.x, yy); }
        else if (b.type === 'ceil') { tileAt(tSet.ceil, b.x, b.y + b.h - T); for (let yy = b.y; yy < b.y + b.h - T; yy += T) tileAt(tSet.fill, b.x, yy); }
        else if (b.type === 'plat') { for (let xx = b.x; xx < b.x + b.w; xx += T) tileAt(tSet.plat, xx, b.y); }
        else if (b.type === 'dest') {
            tileAt(tSet.crate, b.x, b.y); tileAt(tSet.crate, b.x, b.y + T);
            if (b.hp < 3) { ctx.fillStyle = '#2a1a0c'; ctx.fillRect(b.x+10, b.y+12, 4, 14); ctx.fillRect(b.x+14, b.y+24, 8, 4); }
            if (b.hp < 2) { ctx.fillRect(b.x+24, b.y+48, 4, 18); ctx.fillRect(b.x+18, b.y+62, 8, 4); }
            if (b.flash > 0) { b.flash--; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(b.x, b.y, b.w, b.h); }
        }
    });

    cages.forEach(c => {
        if (!c.active || c.x + c.w < cx - 50 || c.x > cx + GW + 50) return;
        const img = SPR.cage[Math.floor(tick / 20) % 2];
        ctx.drawImage(img, c.x - PX, c.y - PX, img.width * PX, img.height * PX);
        if (Math.floor(tick / 30) % 2) { ctx.fillStyle = '#ffe066'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.fillText('HELP!', c.x + c.w/2, c.y - 8); }
    });
    
    // Draw Drops
    ctx.fillStyle = '#4aa';
    drops.forEach(d => { ctx.fillRect(d.x, d.y, 2, 6); });

    enemies.forEach(e => {
        if (e.hp <= 0 || e.x + e.w < cx - 50 || e.x > cx + GW + 50) return;
        const right = (e.type==='turret') ? (e.dir===1) : ((e.type==='spark' || e.type==='drone') ? e.face === 1 : (e.vx > 0)), wf = e.flash > 0;
        let set;
        if (e.type === 'bot') set = SPR.bot[Math.floor((tick + e.x) / 5) % 4];
        else if (e.type === 'drop') set = SPR.drop[Math.floor(tick / 10) % 2];
        else if (e.type === 'hop') set = SPR.hop[e.grounded ? 0 : 1];
        else if (e.type === 'turret') set = SPR.turret[0];
        else if (e.type === 'spark') set = SPR.spark[e.st === 'charge' ? (tick % 8 < 4 ? 2 : 0) : (e.st === 'zap' ? 3 : Math.floor((tick + e.x) / 8) % 2)];
        else if (e.type === 'bat') set = SPR.bat[[0, 1, 2, 1][Math.floor((tick + e.x) / 5) % 4]];
        else if (e.type === 'drone') set = SPR.drone[e.st === 'aim' ? (tick % 6 < 3 ? 2 : 0) : Math.floor(tick / 3) % 2];
        
        const img = right ? (wf ? set.wr : set.r) : (wf ? set.wl : set.l);
        ctx.drawImage(img, Math.round(e.x + e.w/2 - img.width*PX/2), Math.round(e.y + e.h - (img.height-1)*PX), img.width*PX, img.height*PX);
    });

    if (boss.active && !boss.dead) drawBoss();
    if (state === 'PLAY' && (player.invuln === 0 || player.flash > 0 || Math.floor(tick / 5) % 2 === 0)) drawHero();

    bullets.forEach(drawBullet);
    particles.forEach(p => { ctx.fillStyle = p.c; let s = Math.max(2, Math.round((p.life/p.max)*8)); ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s); });

    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
    popups.forEach(p => { ctx.fillStyle = '#000'; ctx.fillText(p.t, p.x + 2, p.y + 2); ctx.fillStyle = '#FFF'; ctx.fillText(p.t, p.x, p.y); });

    ctx.restore();
    updateHud();
}

const hud = { score: document.getElementById('h-score'), lives: document.getElementById('h-lives'), hero: document.getElementById('h-hero'), res: document.getElementById('h-res'), fill: document.getElementById('h-meter-fill') };
let hudKey = '';
function updateHud() {
    const k = score + '|' + lives + '|' + currentHero + '|' + rescues + '|' + cages.length;
    if (k === hudKey) return; hudKey = k;
    hud.score.textContent = 'SCORE ' + score.toString().padStart(6, '0');
    hud.lives.textContent = 'LIVES ' + Math.max(0, lives);
    hud.hero.textContent = HEROES[currentHero].name;
    hud.res.textContent = 'RESCUES ' + rescues + '/' + (cages.length || 6);
    hud.fill.style.width = (cages.length ? 100 * rescues / cages.length : 0) + '%';
}

(function menuArt() {
    const m = document.getElementById('menu-art'), s = 3;
    m.width = 26 * 4 * s + 30; m.height = 26 * s; const g = m.getContext('2d'); g.imageSmoothingEnabled = false;
    SPR.heroes.forEach((set, i) => g.drawImage(set.idle0.r, i * (26 * s + 10), 0, 26 * s, 26 * s));
})();

const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;
function loop(now) {
    let dt = now - lastT; lastT = now;
    if (dt > 250) dt = 250; if (dt < 0) dt = 0;
    if (Math.abs(dt - STEP) < 1.5) dt = STEP; 
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { update(); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
