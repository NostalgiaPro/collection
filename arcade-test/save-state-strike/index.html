<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Save State Strike</title>
<style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b12; overflow: hidden; font-family: monospace; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    /* HUD above the play area */
    #hud { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; padding: 8px 10px 6px; background: #141424; border-bottom: 2px solid #2de0c8; color: #fff; font-weight: bold; font-size: 16px; line-height: 1.25; letter-spacing: 0.5px; }
    #hud span { white-space: nowrap; }
    #h-hero { color: #ffd166; }
    #h-lives { color: #ff6b9a; }
    #h-meter { flex: 1 0 100%; height: 6px; background: #2a2a40; margin-top: 3px; }
    #h-meter i { display: block; height: 100%; width: 0; background: #2de0c8; }

    #main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage stage" "pl pr"; }
    #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

    .pad { display: flex; align-items: center; gap: 12px; padding: 12px 10px 16px; background: #0b0b12; min-width: 0; position: relative; }
    #pad-l { grid-area: pl; justify-content: flex-start; }
    #pad-r { grid-area: pr; justify-content: flex-end; }
    .pad-row { display: flex; gap: 10px; }
    
    .touch-btn { position: relative; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.55); border-radius: 50%; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: rgba(255,255,255,0.85); touch-action: none; }
    .touch-btn:active, .touch-btn.on { background: rgba(45,224,200,0.35); }
    #btn-shoot { border-color: #ff6b9a; }
    #btn-jump { border-color: #2de0c8; }
    
    #btn-swap { position: absolute; top: -56px; right: 10px; width: 56px; height: 56px; font-size: 14px; border-color: #ffd166; }

    /* Landscape phones: controls sit in side columns, never over the play area */
    @media (orientation: landscape) {
        #main { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); grid-template-areas: "pl stage pr"; }
        .pad { flex-direction: column; justify-content: center !important; gap: 12px; padding: 8px 10px; }
        .pad-row { flex-direction: column; gap: 12px; }
        #hud { font-size: 14px; padding: 5px 12px 4px; }
        #h-meter { flex: 0 0 120px; margin-top: 0; }
        .touch-btn { width: 62px; height: 62px; font-size: 16px; }
        #btn-swap { position: relative; top: auto; right: auto; width: 62px; height: 62px; font-size: 16px; }
    }
    /* Desktop: keyboard play, no touch buttons */
    @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
        #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); grid-template-areas: "stage"; }
        .pad { display: none; }
        #hud { font-size: 18px; padding: 8px 20px 6px; }
        #h-meter { flex: 0 0 200px; }
    }

    #menu-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; z-index: 5; }
    h1 { font-size: 40px; margin: 0 0 10px; color: #00FFCC; text-shadow: 3px 3px 0 #FF00FF; text-align: center; }
    p { font-size: 16px; margin: 0 0 26px; text-align: center; max-width: 600px; line-height: 1.5; }
    button { padding: 15px 30px; font-size: 24px; font-family: monospace; background: #FF00FF; color: white; border: 4px solid #FFF; cursor: pointer; text-transform: uppercase; font-weight: bold; }
    button:active { background: #00FFCC; color: #000; }
    #menu-art { image-rendering: pixelated; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app">
    <div id="hud">
        <span id="h-score">SCORE 000000</span>
        <span id="h-lives">LIVES 3</span>
        <span id="h-hero">THE COVER SHOOTER</span>
        <span id="h-res">RESCUES 0/6</span>
        <div id="h-meter"><i id="h-meter-fill"></i></div>
    </div>
    <div id="main">
        <div class="pad" id="pad-l"><div class="pad-row"><div class="touch-btn" id="btn-left">&lt;</div><div class="touch-btn" id="btn-right">&gt;</div></div></div>
        <div id="stage"><canvas id="gameCanvas" width="800" height="600"></canvas></div>
        <div class="pad" id="pad-r">
            <div class="touch-btn" id="btn-swap">SWP</div>
            <div class="pad-row"><div class="touch-btn" id="btn-shoot">FIRE</div><div class="touch-btn" id="btn-jump">JMP</div></div>
        </div>
    </div>
</div>

<div id="menu-screen">
    <canvas id="menu-art" width="1" height="1"></canvas>
    <h1 id="menu-title">SAVE STATE STRIKE</h1>
    <p id="menu-desc">The Glitch Empire has corrupted the source code! Run, gun, and smash cages to swap heroes.<br><br>Keyboard: Arrows/WASD to move, Space/J to Fire, E/Shift to Swap, Up/K to Jump.<br>Touch: On-screen buttons.</p>
    <button id="start-btn">START MISSION</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');
const GW_BASE = 800, GH = 600;
let GW = 800;
let VIEW_SCALE = 1, DPR = 1, VY = 0;

// ---------- Pixel art, drawn in code ----------
const PX = 2; // world units per art pixel
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function art(w, h, fn, outline) {
    const c = mk(w + 2, h + 2), g = c.getContext('2d');
    const p = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, ww, hh); };
    fn(p, g);
    if (outline !== false) {
        const id = g.getImageData(0, 0, c.width, c.height), d = id.data, W = c.width, H = c.height;
        const a = new Uint8Array(W * H);
        for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const i = y * W + x; if (a[i]) continue;
            if ((x > 0 && a[i - 1]) || (x < W - 1 && a[i + 1]) || (y > 0 && a[i - W]) || (y < H - 1 && a[i + W])) {
                d[i * 4] = 18; d[i * 4 + 1] = 12; d[i * 4 + 2] = 26; d[i * 4 + 3] = 255;
            }
        }
        g.putImageData(id, 0, 0);
    }
    return c;
}
function flipC(c) { const o = mk(c.width, c.height), g = o.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return o; }
function tintC(c, col) { const o = mk(c.width, c.height), g = o.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, o.width, o.height); return o; }
function pack(c) { const l = flipC(c); return { r: c, l: l, wr: tintC(c, '#ffffff'), wl: tintC(l, '#ffffff') }; }

// THE COVER SHOOTER: helmet, vest, rifle
function artSoldier(pose) {
    return art(24, 24, (p) => {
        const H1='#36401c',H2='#56652a',H3='#88994a',S1='#eab48a',S2='#b97c50',E='#141414',V1='#7d6c3c',V2='#a8935a',V3='#544726',SH='#3b422b',P1='#56603a',P2='#394026',B='#2a211c',G1='#25292f',G2='#545c66',G3='#a3acb6';
        let dy = (pose === 'idle1' || pose === 'run0' || pose === 'run2') ? 1 : 0;
        let dx = 0; if (pose === 'hit') { dx = -2; dy = 0; } // dy 0 keeps the helmet and hair inside the 24px frame
        const gx = pose === 'shoot' ? -1 : 0;
        
        // legs
        if (pose === 'hit') { p(10+dx,16+dy,4,6,P2); p(9+dx,22+dy,5,2,B); p(12+dx,14+dy,4,6,P1); p(13+dx,20+dy,5,2,B); }
        else if (pose === 'run0') { p(7,16,3,2,P2); p(5,18,3,2,P2); p(4,20,3,2,P2); p(2,22,4,2,B); p(11,16,3,2,P1); p(12,18,3,2,P1); p(13,20,3,2,P1); p(13,22,4,2,B); }
        else if (pose === 'run1') { p(8,16,3,6,P2); p(7,22,4,2,B); p(11,16,3,2,P1); p(12,17,3,2,P1); p(11,19,3,2,P1); p(11,21,4,2,B); }
        else if (pose === 'run2') { p(11,16,3,2,P2); p(12,18,3,2,P2); p(13,20,3,2,P2); p(13,22,4,2,B); p(7,16,3,2,P1); p(5,18,3,2,P1); p(4,20,3,2,P1); p(2,22,4,2,B); }
        else if (pose === 'run3') { p(11,16,3,2,P2); p(12,17,3,2,P2); p(11,19,3,2,P2); p(11,21,4,2,B); p(8,16,3,6,P1); p(7,22,4,2,B); }
        else if (pose === 'jump') { p(7,16,3,2,P2); p(5,17,3,3,P2); p(4,20,4,2,B); p(11,16,4,2,P1); p(13,17,3,2,P1); p(12,19,3,1,P1); p(12,20,4,2,B); }
        else if (pose === 'shoot') { p(6,16,3,6,P2); p(5,22,4,2,B); p(12,16,3,6,P1); p(12,22,4,2,B); p(12,18,3,1,V3); }
        else { p(7,16,3,6,P2); p(6,22,4,2,B); p(11,16,3,6,P1); p(11,22,4,2,B); p(11,18,3,1,V3); }
        const y = dy;
        
        // back arm
        if (pose === 'hit') { p(4+dx,7+dy,2,4,SH); p(3+dx,11+dy,2,2,S2); }
        else { p(5,9+y,2,4,SH); p(5,13+y,2,1,S2); }
        
        // helmet
        p(6+dx,0+dy,8,1,H2); p(5+dx,1+dy,10,2,H2); p(7+dx,1+dy,3,1,H3); p(6+dx,0+dy,2,1,H3); p(9+dx,2+dy,1,1,H1); p(12+dx,1+dy,1,1,H1); p(4+dx,3+dy,12,1,H1);
        
        // face
        if (pose === 'hit') {
            p(7+dx,4+dy,7,3,S1); p(7+dx,4+dy,7,1,S2); p(12+dx,5+dy,1,1,S1); p(10+dx,5+dy,1,1,'#000'); p(11+dx,6+dy,2,1,'#000'); p(7+dx,5+dy,1,2,S2); p(8+dx,7+dy,5,1,S2); p(9+dx,8+dy,3,1,S2);
        } else {
            p(7+dx,4+dy,7,3,S1); p(7+dx,4+dy,7,1,S2); p(13+dx,5+dy,1,1,S1); p(11+dx,5+dy,1,1,E); p(7+dx,5+dy,1,2,S2); p(8+dx,7+dy,5,1,S2); p(8+dx,5+dy,1,2,'#2b2b1c'); p(9+dx,8+dy,3,1,S2);
        }
        
        // vest
        p(6+dx,9+dy,8,6,V1); p(6+dx,9+dy,8,1,V2); p(7+dx,10+dy,1,4,V2); p(9+dx,12+dy,2,2,V3); p(12+dx,12+dy,2,2,V3); p(6+dx,15+dy,8,1,V3); p(9+dx,15+dy,2,1,'#c8b060');
        
        // front arm and rifle
        p(11+dx,9+dy,3,2,SH);
        
        if (pose === 'hit') {
            p(4+dx,13+dy,3,3,G1); p(7+dx,13+dy,10,2,G1); p(8+dx,13+dy,8,1,G2); p(17+dx,13+dy,6,1,G2); p(22+dx,13+dy,1,1,G3); p(12+dx,15+dy,2,2,G1); p(13+dx,12+dy,3,1,G1);
            p(10+dx,14+dy,2,2,S1); p(13+dx,15+dy,3,1,SH); p(16+dx,14+dy,2,2,S1);
        } else {
            p(4+gx,11+y,3,3,G1); p(7+gx,11+y,10,2,G1); p(8+gx,11+y,8,1,G2); p(17+gx,11+y,6,1,G2); p(22+gx,11+y,1,1,G3); p(12+gx,13+y,2,2,G1); p(13+gx,10+y,3,1,G1);
            p(10+gx,12+y,2,2,S1); p(13,13+y,3,1,SH); p(16+gx,12+y,2,2,S1);
        }
    });
}
// THE RADICAL MASCOT: orange lizard, purple jacket, shades, chunky sneakers
function artLizard(pose) {
    return art(24, 24, (p) => {
        const O1='#f2892a',O2='#bf5a12',O3='#ffd08e',SG='#ff3e9a',J1='#6e2fa6',J2='#9c5ad6',J3='#47197a',Z='#2de0c8',SN='#f5f5f5',SO='#e0306a',SHT='#24243a',M='#7a2e0c';
        let dy = (pose === 'idle1' || pose === 'run0' || pose === 'run2') ? 1 : 0;
        let dx = 0; if (pose === 'hit') { dx = -2; dy = 0; } // dy 0 keeps the helmet and hair inside the 24px frame
        const y = dy;
        
        // tail
        if (pose === 'hit') { p(2+dx,15+dy,3,2,O1); p(0+dx,16+dy,3,2,O1); }
        else if (pose === 'run0' || pose === 'idle1' || pose === 'attack') { p(4,13+y,3,2,O1); p(2,14+y,3,2,O1); p(0,13+y,3,2,O1); p(0,12+y,2,1,O2); }
        else { p(4,14+y,3,2,O1); p(2,15+y,3,2,O1); p(0,17+y,3,2,O1); p(0,19+y,2,1,O2); }
        
        // legs and sneakers
        const shoe = (x, yy, w) => { p(x,yy,w,2,SN); p(x,yy+2,w,1,SO); p(x+2,yy,2,1,Z); };
        
        if (pose === 'hit') { p(10+dx,17+dy,2,2,O1); p(8+dx,19+dy,2,2,O1); shoe(5+dx,20+dy,5); p(13+dx,15+dy,2,2,O1); p(15+dx,17+dy,2,2,O1); shoe(14+dx,19+dy,5); }
        else if (pose === 'run0') { p(6,17,2,2,O1); p(4,19,2,2,O1); shoe(1,20,5); p(11,17,2,2,O1); p(13,19,2,2,O1); shoe(13,21,5); }
        else if (pose === 'run1') { p(8,17,2,4,O1); shoe(7,21,5); p(11,17,3,2,O1); p(13,18,2,2,O1); shoe(12,19,5); }
        else if (pose === 'run2') { p(11,17,2,2,O1); p(13,19,2,2,O1); shoe(13,21,5); p(6,17,2,2,O1); p(4,19,2,2,O1); shoe(1,20,5); }
        else if (pose === 'run3') { p(11,17,3,2,O1); p(13,18,2,2,O1); shoe(12,19,5); p(8,17,2,4,O1); shoe(7,21,5); }
        else if (pose === 'jump') { p(7,17,2,2,O1); shoe(4,19,5); p(11,17,2,2,O1); shoe(12,18,5); }
        else if (pose === 'attack') { p(8,17,2,4,O1); shoe(7,21,5); p(11,16,5,2,O1); p(16,15,5,3,SN); p(21,15,1,3,SO); p(17,15,2,1,Z); }
        else { p(7,17,2,4,O1); p(11,17,2,4,O1); shoe(6,21,5); shoe(11,21,5); }
        
        // shorts
        p(6+dx,15+dy,8,2,SHT);
        
        // back arm
        if (pose === 'attack') { p(3,9+y,3,2,J3); p(1,9+y,2,2,O2); } 
        else if (pose === 'hit') { p(4+dx,7+dy,2,4,J3); p(3+dx,11+dy,2,2,O2); }
        else { p(5,9+y,2,4,J3); p(5,13+y,2,1,O2); }
        
        // jacket
        if (pose === 'attack') {
            p(7,7+y,8,8,J1); p(7,7+y,8,1,J2); p(6,7+y,2,2,J2); p(14,7+y,2,2,J2); p(11,8+y,2,6,O3); p(10,8+y,1,7,Z); p(13,8+y,1,7,Z); p(7,14+y,8,1,J3); p(8,9+y,1,3,J2);
        } else {
            p(6+dx,8+dy,8,7,J1); p(6+dx,8+dy,8,1,J2); p(5+dx,8+dy,2,2,J2); p(13+dx,8+dy,2,2,J2); p(10+dx,9+dy,2,5,O3); p(9+dx,9+dy,1,6,Z); p(12+dx,9+dy,1,6,Z); p(6+dx,14+dy,8,1,J3); p(7+dx,10+dy,1,3,J2);
        }
        
        // head
        if (pose === 'attack') {
            p(8,0+y,5,1,O1); p(7,1+y,7,1,O1); p(7,2+y,12,1,O1); p(7,3+y,13,1,O1); p(7,4+y,13,1,O1); p(8,5+y,11,1,O1);
            p(10,6+y,8,1,O1); p(11,7+y,5,1,O2); p(8,1+y,3,1,O3); p(13,5+y,6,1,M); p(18,3+y,1,1,O2);
            p(11,2+y,5,1,SG); p(12,3+y,3,1,SG); p(12,2+y,1,1,'#ffffff'); p(8,2+y,3,1,'#2a1030');
            p(9,7+y,3,2,O1);
        } else if (pose === 'hit') {
            p(7+dx,1+dy,5,1,O1); p(6+dx,2+dy,7,1,O1); p(6+dx,3+dy,12,1,O1); p(6+dx,4+dy,13,1,O1); p(6+dx,5+dy,13,1,O1); p(7+dx,6+dy,11,1,O1);
            p(9+dx,7+dy,8,1,O1); p(10+dx,8+dy,5,1,O2); p(7+dx,2+dy,3,1,O3); p(12+dx,6+dy,6,1,M); p(17+dx,4+dy,1,1,O2);
            p(10+dx,3+dy,5,1,SG); p(11+dx,4+dy,3,1,SG); p(11+dx,3+dy,1,1,'#ffffff'); p(10+dx,5+dy,2,1,'#000'); p(12+dx,6+dy,2,1,'#000');
            p(8+dx,8+dy,3,2,O1);
        } else {
            p(7,0+y,5,1,O1); p(6,1+y,7,1,O1); p(6,2+y,12,1,O1); p(6,3+y,13,1,O1); p(6,4+y,13,1,O1); p(7,5+y,11,1,O1);
            p(9,6+y,8,1,O1); p(10,7+y,5,1,O2); p(7,1+y,3,1,O3); p(12,5+y,6,1,M); p(17,3+y,1,1,O2);
            p(10,2+y,5,1,SG); p(11,3+y,3,1,SG); p(11,2+y,1,1,'#ffffff'); p(7,2+y,3,1,'#2a1030');
            p(8,7+y,3,2,O1);
        }
        
        // front arm
        if (pose === 'run0') { p(13,10+y,3,2,J2); p(16,10+y,2,2,O1); }
        else if (pose === 'run1') { p(12,10+y,2,3,J2); p(11,13+y,2,2,O1); }
        else if (pose === 'run2') { p(13,10+y,3,2,J2); p(16,10+y,2,2,O1); }
        else if (pose === 'run3') { p(12,10+y,2,3,J2); p(11,13+y,2,2,O1); }
        else if (pose === 'jump') { p(13,8+y,2,2,J2); p(14,6+y,2,2,O1); }
        else if (pose === 'attack') { p(14,8+y,2,2,J2); p(16,7+y,2,2,O1); }
        else if (pose === 'hit') { p(11+dx,12+dy,2,3,J2); p(10+dx,15+dy,2,2,O1); }
        else { p(13,9+y,2,4,J2); p(13,13+y,2,2,O1); }
    });
}
// THE QUARTER-CIRCLE BRAWLER: ponytail, tank top, hand wraps, cargo pants
function artBrawler(pose) {
    return art(24, 24, (p) => {
        const K1='#c07f4f',K2='#8e5530',HR='#1d1416',TIE='#2de0c8',T1='#f0b62a',T2='#bd8614',Q1='#5a3384',Q2='#3a1f5c',W='#f1e7d0',W2='#c9bc9c',E='#141414';
        let dy = (pose === 'idle1' || pose === 'run0' || pose === 'run2') ? 1 : 0;
        let dx = 0; if (pose === 'hit') { dx = -2; dy = 0; } // dy 0 keeps the helmet and hair inside the 24px frame
        const y = dy;
        
        // ponytail

// ---------- Layout: fit the canvas to the stage, keep world height 600 ----------
const stage = document.getElementById('stage');
function resize() {
    const r = stage.getBoundingClientRect();
    let w = Math.max(1, r.width), h = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    VY = (w / h < 0.9) ? 80 : 0;           // portrait: trim some empty sky so sprites draw bigger
    let scale = h / (GH - VY), vw = w / scale;
    if (vw > 1100) { vw = 1100; w = vw * scale; }            // very wide: pillarbox
    if (vw < 300) { vw = 300; scale = w / vw; h = (GH - VY) * scale; } // very tall: letterbox
    GW = Math.round(vw); VIEW_SCALE = scale;
    canvas.style.width = Math.round(w) + 'px'; canvas.style.height = Math.round(h) + 'px';
    canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// Input
const keys = {};

function bindBtn(id, keyCodes) {
    const el = document.getElementById(id);
    const down = (e) => { e.preventDefault(); if (id === 'btn-swap') swapQueued = true; keyCodes.forEach(k => keys[k] = true); el.classList.add('on'); };
    const up = (e) => { e.preventDefault(); keyCodes.forEach(k => keys[k] = false); el.classList.remove('on'); };
    el.addEventListener('touchstart', down, { passive: false }); el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', down); el.addEventListener('mouseup', up); el.addEventListener('mouseleave', up);
}

window.addEventListener('keydown', e => { if (!e.repeat && ['ShiftLeft','ShiftRight','KeyE'].includes(e.code)) swapQueued = true; if (state === 'PLAY' && ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); keys[e.code] = true; });
window.addEventListener('keyup', e => keys[e.code] = false);

// Hero Definitions (speeds are per 1/60 s step)
const HEROES = [
    { name: "THE COVER SHOOTER", speed: 4, jump: -10, fireDelay: 10, w: 22, h: 44, pW: 12, pH: 4, pSpd: 14, type: "shoot", pColor: "#7ff6ff" },
    { name: "THE RADICAL MASCOT", speed: 6.5, jump: -13, fireDelay: 20, w: 22, h: 42, pW: 34, pH: 30, pSpd: 0, type: "melee", pColor: "#ff9ad0" },
    { name: "THE QUARTER-CIRCLE BRAWLER", speed: 3.5, jump: -11.5, fireDelay: 35, w: 22, h: 44, pW: 18, pH: 18, pSpd: 8, type: "fireball", pColor: "#c45cff" }
];
let currentHero = 0;
let player = {};

// Entities
const T = 40; // Tile size
const L_END = 250; // Level length in tiles
const RESPAWN_INVULN = 150; // 2.5 seconds
let blocks = [], enemies = [], cages = [], bullets = [], particles = [], popups = [], boss = {};

function rectIntersect(r1, r2) {
    return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y); // edge contact is not overlap
}

function startGame() {
    swapQueued = false;
    state = 'PLAY'; score = 0; lives = 3; rescues = 0; cx = 0; shake = 0; currentHero = 0;
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('start-btn').blur();
    const h0 = HEROES[0];
    player = { x: 100, y: GH - T*2 - h0.h, w: h0.w, h: h0.h, vx: 0, vy: 0, dir: 1, grounded: false, fireTimer: 0, invuln: 0, flash: 0, muzzle: 0, runT: 0, safeX: 100, swapHeld: false };
    boss = { x: L_END*T - 170, y: GH/2 - 64, w: 128, h: 128, hp: 60, maxHp: 60, active: false, dead: false, vy: 3, timer: 0, flash: 0 };
    blocks = []; enemies = []; cages = []; bullets = []; particles = []; popups = [];

    // Generate Level
    let pitRun = 0;
    for (let x = 0; x < L_END; x++) {
        const cageTile = x > 30 && x % 40 === 0;
        const nearCage = x > 30 && (x % 40 <= 1 || x % 40 === 39);
        if (x < 15 || x > L_END - 20 || nearCage || pitRun >= 2 || Math.random() > 0.15) {
            blocks.push({x: x*T, y: GH - T*2, w: T, h: T*2, solid: true, type: 'ground'}); // Floor
            pitRun = 0;
        } else pitRun++;
        if (x > 15 && x < L_END - 20 && Math.random() < 0.15) {
            let py = GH - T*4 - 8 - Math.random() * T * 3;
            blocks.push({x: x*T, y: py, w: T*3, h: T, solid: true, type: 'plat'}); // Platform
            if (Math.random() < 0.5) enemies.push({x: x*T+T, y: py-T, w: 28, h: 28, vx: -1.5, vy: 0, hp: 2, type: 'bot', flash: 0});
        }
        if (x > 20 && x < L_END - 20 && !nearCage && Math.random() < 0.05) {
            blocks.push({x: x*T, y: GH - T*4, w: T, h: T*2, solid: true, type: 'dest', hp: 3}); // Destructible wall
        }
        if (cageTile) {
            cages.push({x: x*T, y: GH - T*2 - 40, w: 40, h: 40, active: true}); // Prisoner Cage
        }
        if (x > 15 && x < L_END - 20 && Math.random() < 0.1) {
            enemies.push({x: x*T, y: GH - T*3, w: 28, h: 28, vx: -1.5, vy: 0, hp: 2, type: 'bot', flash: 0}); // Ground enemy
        }
    }
    blocks.push({x: L_END*T, y: 0, w: T, h: GH, solid: true, type: 'wall'}); // Boss wall
}

function spawnParticles(x, y, color, n) {
    for (let i=0; i<(n||12); i++) {
        particles.push({ x: x+16, y: y+16, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 15+Math.random()*15, max: 30, c: color });
    }
}

function shoot(h) {
    let bx = player.dir === 1 ? player.x + player.w : player.x - h.pW;
    let by = player.y + 15 - h.pH/2;
    if (h.type === 'melee') {
        bullets.push({x: bx, y: player.y + player.h/2 - h.pH/2, w: h.pW, h: h.pH, vx: player.vx, vy: 0, life: 8, isPlayer: true, dmg: 2, c: h.pColor, melee: true, dir: player.dir, hits: []});
        player.vx = player.dir * 8; // slight lunge
    } else if (h.type === 'fireball') {
        bullets.push({x: bx, y: player.y + 18 - h.pH/2, w: h.pW, h: h.pH, vx: h.pSpd * player.dir, vy: 0, life: 60, isPlayer: true, dmg: 3, c: h.pColor, orb: true});
    } else {
        bullets.push({x: bx + player.dir * 6, y: by + 10, w: h.pW, h: h.pH, vx: h.pSpd * player.dir, vy: 0, life: 60, isPlayer: true, dmg: 1, c: h.pColor});
        player.muzzle = 4;
    }
}

// Find safe standing ground on screen, closest to prefX. Never over a pit.
function safeSpot(prefX) {
    const pw = player.w, ph = player.h;
    const minX = cx + 20, maxX = cx + GW - 60;
    let best = null, bd = Infinity;
    for (const b of blocks) {
        if (!b.solid || (b.type !== 'ground' && b.type !== 'plat')) continue;
        const lo = Math.max(b.x, minX), hi = Math.min(b.x + b.w - pw, maxX);
        if (hi < lo) continue;
        const x = Math.min(Math.max(prefX, lo), hi);
        const test = { x: x - 4, y: b.y - ph - 2, w: pw + 8, h: ph + 2 };
        if (blocks.some(o => o.solid && rectIntersect(test, o))) continue;
        let d = Math.abs(x - prefX);
        if (b.type === 'plat') d += 160;
        if (b.type === 'ground') {
            const left = blocks.some(o => o.solid && o.type === 'ground' && o.x === b.x - T);
            const right = blocks.some(o => o.solid && o.type === 'ground' && o.x === b.x + T);
            if (!left || !right) d += 80;
        }
        if (enemies.some(e => e.hp > 0 && Math.abs(e.x - x) < 70 && Math.abs(e.y - b.y) < 80)) d += 120;
        if (d < bd) { bd = d; best = { x: x, y: b.y - ph }; }
    }
    return best || { x: cx + 100, y: GH - T*2 - ph };
}

function damagePlayer(fromPit) {
    if (player.invuln > 0 && !fromPit) return;
    shake = 15; lives--; player.flash = 10;
    spawnParticles(player.x - 5, player.y, '#ffffff', 10);
    if (lives <= 0) {
        state = 'OVER';
        document.getElementById('menu-screen').style.display = 'flex';
        document.getElementById('menu-title').innerText = 'GAME OVER';
        document.getElementById('menu-title').style.color = '#FF0000';
        document.getElementById('menu-desc').innerText = `Final Score: ${score}\nRescues: ${rescues}`;
        document.getElementById('start-btn').innerText = 'RETRY MISSION';
    } else {
        const s = safeSpot(fromPit ? player.safeX : player.x);
        player.x = s.x; player.y = s.y; player.vx = 0; player.vy = 0; player.grounded = true; player.invuln = RESPAWN_INVULN;
        bullets.forEach(b => { if (!b.isPlayer) b.life = 0; }); // clear enemy shots in place (we may be inside the bullet loop)
        popups.push({x: player.x - 20, y: player.y - 10, t: "READY!", l: 60});
    }
}

function update() {
    tick++;
    // effects keep running on the end screens
    for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0) particles.splice(i, 1); }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 0.5; p.l--; if (p.l <= 0) popups.splice(i, 1); }
    if (shake > 0) shake--;
    if (boss.flash > 0) boss.flash--;
    if (state !== 'PLAY') return;
    let hInfo = HEROES[currentHero];
    if (player.h !== hInfo.h) player.y += player.h - hInfo.h;
    player.w = hInfo.w; player.h = hInfo.h;

    // Player Input
    let mv = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) mv = -hInfo.speed;
    if (keys['ArrowRight'] || keys['KeyD']) mv = hInfo.speed;
    if (Math.abs(player.vx) > hInfo.speed && player.fireTimer > hInfo.fireDelay - 6) player.vx *= 0.8; // melee lunge decays
    else player.vx = mv;
    if (mv !== 0) player.dir = Math.sign(mv);

    // Swap on press, including taps shorter than one update step
    const swapNow = !!(keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyE']);
    if ((swapNow || swapQueued) && !player.swapHeld) {
        currentHero = (currentHero + 1) % HEROES.length;
        spawnParticles(player.x, player.y, '#fff', 10);
        popups.push({x: player.x-20, y: player.y-20, t: "SWAPPED!", l: 30});
    }
    player.swapHeld = swapNow; swapQueued = false;

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['KeyK']) && player.grounded) {
        player.vy = hInfo.jump; player.grounded = false;
    }
    if ((keys['Space'] || keys['KeyJ']) && player.fireTimer <= 0) {
        shoot(hInfo); player.fireTimer = hInfo.fireDelay;
    }

    if (player.fireTimer > 0) player.fireTimer--;
    if (player.invuln > 0) player.invuln--;
    if (player.flash > 0) player.flash--;
    if (player.muzzle > 0) player.muzzle--;

    // Player Physics
    player.vy += 0.6; player.vy = Math.min(player.vy, 12);
    player.x += player.vx;
    let hitX = blocks.find(b => b.solid && rectIntersect(player, b));
    if (hitX) { player.x = player.vx > 0 ? hitX.x - player.w : hitX.x + hitX.w; player.vx = 0; }

    player.y += player.vy; player.grounded = false;
    let hitY = blocks.find(b => b.solid && rectIntersect(player, b));
    if (hitY) {
        if (player.vy > 0) {
            player.y = hitY.y - player.h; player.grounded = true;
            if (hitY.type === 'ground' || hitY.type === 'plat') player.safeX = Math.min(Math.max(player.x, hitY.x), hitY.x + hitY.w - player.w);
        }
        else { player.y = hitY.y + hitY.h; }
        player.vy = 0;
    }
    if (player.grounded && player.vx !== 0) player.runT++; else player.runT = 0;

    if (player.y > GH + 100) damagePlayer(true);
    if (player.x < cx) player.x = cx; // Screen left bound

    // Camera Lock
    let camTarget = player.x - GW/3;
    if (camTarget > L_END*T - GW) camTarget = L_END*T - GW;
    cx = Math.max(cx, camTarget);
    if (cx >= L_END*T - GW - 10) boss.active = true;

    // Enemies
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        if (e.flash > 0) e.flash--;
        e.vy += 0.6; e.vy = Math.min(e.vy, 12);
        e.y += e.vy;
        if (e.y > GH + 200) { e.hp = 0; return; }
        let hy = blocks.find(b => b.solid && rectIntersect(e, b));
        if (hy) { e.y = e.vy > 0 ? hy.y - e.h : hy.y + hy.h; e.vy = 0; }

        e.x += e.vx;
        let hx = blocks.find(b => b.solid && rectIntersect(e, b));
        if (hx) { e.vx *= -1; e.x += e.vx; }

        if (e.x > cx && e.x < cx+GW && Math.random() < 0.004) {
            let dx = player.x < e.x ? -1 : 1;
            bullets.push({x: dx<0 ? e.x-10 : e.x+e.w, y: e.y+e.h/2-4, w:8, h:8, vx: dx*3.5, vy: 0, life: 110, player: false, dmg: 1, c: '#ffd23f'});
        }
        if (player.invuln <= 0 && rectIntersect(player, e)) damagePlayer();
    });

    // Boss
    if (boss.active && !boss.dead) {
        boss.y += boss.vy;
        if ((boss.y < Math.max(50, VY + 40) && boss.vy < 0) || (boss.y > GH - 200 && boss.vy > 0)) boss.vy *= -1;
        boss.timer++;
        if (boss.timer > 80) {
            boss.timer = 0;
            for (let a = -2; a <= 2; a++) {
                bullets.push({x: boss.x, y: boss.y + boss.h/2, w: 12, h: 12, vx: -6, vy: a*1.5, life: 150, player: false, dmg: 1, c: '#ff2bd6'});
            }
        }
        if (player.invuln <= 0 && rectIntersect(player, boss)) damagePlayer();
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if (b.melee) { b.x = b.dir === 1 ? player.x + player.w : player.x - b.w; b.y = player.y + player.h/2 - b.h/2; }
        else { b.x += b.vx; b.y += b.vy; }
        b.life--;
        if (b.life <= 0) { bullets.splice(i,1); continue; }

        let hitB = blocks.find(blk => blk.solid && rectIntersect(b, blk));
        if (hitB) {
            if (hitB.type === 'dest' && (!b.melee || !b.hits.includes(hitB))) {
                if (b.melee) b.hits.push(hitB);
                hitB.hp -= b.dmg; hitB.flash = 5;
                if (hitB.hp <= 0) { hitB.solid = false; spawnParticles(hitB.x, hitB.y, '#a0703f'); score += 50; shake = 4; }
            }
            if (!b.melee) { spawnParticles(b.x - 14, b.y - 14, b.c, 4); bullets.splice(i,1); continue; }
        }

        if (b.isPlayer) {
            let hitE = enemies.find(e => e.hp > 0 && rectIntersect(b, e) && (!b.melee || !b.hits.includes(e)));
            if (hitE) {
                if (b.melee) b.hits.push(hitE);
                hitE.hp -= b.dmg; hitE.flash = 6;
                if (hitE.hp <= 0) { spawnParticles(hitE.x, hitE.y, '#ff5544'); spawnParticles(hitE.x, hitE.y, '#ffcc00', 6); score += 100; popups.push({x: hitE.x, y: hitE.y, t: "+100", l: 30}); shake = 3; }
                if (!b.melee) { bullets.splice(i,1); continue; }
            }
            if (boss.active && !boss.dead && rectIntersect(b, boss) && (!b.melee || !b.hits.includes(boss))) {
                if (b.melee) b.hits.push(boss);
                boss.hp -= b.dmg; boss.flash = 4; spawnParticles(b.x + Math.random()*20 - 16, b.y - 10, '#ffff66', 6);
                if (boss.hp <= 0) {
                    boss.dead = true; score += 5000; shake = 30;
                    for (let k = 0; k < 5; k++) spawnParticles(boss.x + Math.random()*100, boss.y + Math.random()*100, k % 2 ? '#ff2bd6' : '#20f0ff', 14);
                    setTimeout(() => {
                        state = 'WIN';
                        document.getElementById('menu-screen').style.display = 'flex';
                        document.getElementById('menu-title').innerText = 'MISSION CLEAR';
                        document.getElementById('menu-title').style.color = '#00FFCC';
                        document.getElementById('menu-desc').innerText = `You destroyed the Glitch Core!\nFinal Score: ${score}\nRescues: ${rescues}`;
                        document.getElementById('start-btn').innerText = 'PLAY AGAIN';
                    }, 2000);
                }
                if (!b.melee) { bullets.splice(i,1); continue; }
            }
            let hitC = cages.find(c => c.active && rectIntersect(b, c));
            if (hitC) {
                hitC.active = false; spawnParticles(hitC.x, hitC.y, '#c2c8d2'); spawnParticles(hitC.x, hitC.y, '#ffe066', 8); rescues++; score += 500;
                currentHero = (currentHero + 1) % HEROES.length;
                popups.push({x: hitC.x-60, y: hitC.y-20, t: "NEW RENEGADE UNLOCKED!", l: 90});
                shake = 10; player.invuln = Math.max(player.invuln, 60);
                if (!b.melee) { bullets.splice(i,1); continue; }
            }
        } else {
            if (player.invuln <= 0 && rectIntersect(b, player)) { damagePlayer(); bullets.splice(i,1); continue; }
        }
    }
}

// ---------- Drawing ----------
function heroPose() {
    if (player.flash > 0) return 'hit';
    const h = HEROES[currentHero];
    if (player.fireTimer > h.fireDelay - (h.type === 'shoot' ? 5 : 10)) return 'shoot';
    if (!player.grounded) return 'jump';
    if (player.vx !== 0) return 'run' + (Math.floor(player.runT / 6) % 4);
    return Math.floor(tick / 32) % 2 ? 'idle1' : 'idle0';
}
// Sprite art is drawn so the body center sits at art column 11.5 and the feet at row 25.
function drawHero() {
    const set = SPR.heroes[currentHero][heroPose()];
    const white = player.flash > 0;
    const img = player.dir === 1 ? (white ? set.wr : set.r) : (white ? set.wl : set.l);
    const sw = img.width * PX, sh = img.height * PX;
    const left = player.dir === 1 ? player.x + player.w/2 - 11.5*PX : player.x + player.w/2 - (img.width - 11.5)*PX;
    const top = player.y + player.h - 25*PX;
    ctx.drawImage(img, Math.round(left), Math.round(top), sw, sh);
    if (currentHero === 0 && player.muzzle > 0) {
        const mx = player.dir === 1 ? left + 25*PX : left + (img.width - 25)*PX;
        const my = top + 12.5*PX;
        glow(mx, my, 12, 'rgba(255,220,120,0.45)');
        ctx.fillStyle = '#fff6c0'; ctx.fillRect(mx - 4, my - 2, 8, 4); ctx.fillRect(mx - 2, my - 5, 4, 10);
        ctx.fillStyle = '#ffb020'; ctx.fillRect(mx + player.dir * 4 - 2, my - 1, 6 * player.dir || 6, 2);
    }
}
function glow(x, y, r, col) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();
}
function drawBullet(b) {
    const mx = b.x + b.w/2, my = b.y + b.h/2;
    if (b.melee) {
        const a = b.life / 8, d = b.dir;
        ctx.save(); ctx.globalAlpha = Math.min(1, a + 0.2); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = '#ff9ad0'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(mx - d * 10, my, 18, d === 1 ? -1.2 : Math.PI - 1.2, d === 1 ? 1.2 : Math.PI + 1.2); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx - d * 10, my, 18, d === 1 ? -0.9 : Math.PI - 0.9, d === 1 ? 0.9 : Math.PI + 0.9); ctx.stroke();
        ctx.restore();
        return;
    }
    if (b.orb) {
        glow(mx, my, 16, 'rgba(196,92,255,0.35)'); glow(mx, my, 10, 'rgba(45,224,200,0.5)');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(mx - 4, my - 4, 8, 8);
        ctx.fillStyle = '#2de0c8'; const s = (tick % 8 < 4) ? 7 : 5; ctx.fillRect(mx - s, my - 1, 2, 2); ctx.fillRect(mx + s - 2, my - 1, 2, 2); ctx.fillRect(mx - 1, my - s, 2, 2); ctx.fillRect(mx - 1, my + s - 2, 2, 2);
        return;
    }
    if (b.isPlayer) {
        glow(mx, my, 8, 'rgba(127,246,255,0.35)');
        ctx.fillStyle = '#7ff6ff'; ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(b.vx > 0 ? b.x + b.w - 5 : b.x, b.y + 1, 5, 2);
        return;
    }
    glow(mx, my, b.w, b.c === '#ff2bd6' ? 'rgba(255,43,214,0.4)' : 'rgba(255,210,63,0.4)');
    ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + b.w/4, b.y + b.h/4, b.w/2, b.h/2);
}
function drawBoss() {
    const f = boss.flash > 0 ? 0 : (tick % 60 < 5 ? 2 : Math.floor(tick / 15) % 2);
    const src = boss.flash > 0 ? SPR.bossW : SPR.boss[f];
    const bx = boss.x - PX, by = boss.y - PX, S = src.width * PX;
    const glitchy = Math.random() < (boss.hp < boss.maxHp / 2 ? 0.45 : 0.25);
    if (glitchy) {
        ctx.save(); ctx.globalAlpha = 0.45; ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(SPR.bossM, bx - 5, by, S, S); ctx.drawImage(SPR.bossC, bx + 5, by, S, S); ctx.restore();
    }
    if (Math.random() < 0.04) ctx.globalAlpha = 0.35; // flicker
    const strips = 11, sh = src.height / strips;
    for (let s = 0; s < strips; s++) {
        const dx = glitchy && Math.random() < 0.35 ? Math.round((Math.random() - 0.5) * 18) : 0;
        ctx.drawImage(src, 0, s * sh, src.width, sh, bx + dx, by + s * sh * PX, S, sh * PX);
    }
    ctx.globalAlpha = 1;
    if (glitchy) {
        for (let k = 0; k < 3; k++) { ctx.fillStyle = Math.random() < 0.5 ? '#ff2bd6' : '#20f0ff'; ctx.fillRect(bx + Math.random() * S, by + Math.random() * S, 6 + Math.random() * 22, 2); }
    }
    const hy = Math.max(boss.y - 22, VY + 22);
    ctx.fillStyle = '#400'; ctx.fillRect(boss.x, hy, boss.w, 10);
    ctx.fillStyle = '#ff2bd6'; ctx.fillRect(boss.x, hy, boss.w * (boss.hp/boss.maxHp), 10);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left'; ctx.fillText('GLITCH CORE', boss.x, hy - 6);
}
function tileAt(img, x, y) { ctx.drawImage(img, 1, 1, 20, 20, x, y, T, T); }

function draw() {
    ctx.setTransform(VIEW_SCALE * DPR, 0, 0, VIEW_SCALE * DPR, 0, -VY * VIEW_SCALE * DPR);
    ctx.imageSmoothingEnabled = false;
    // Background: dark sky with a slow parallax grid
    ctx.fillStyle = '#12121c'; ctx.fillRect(0, 0, GW, GH);
    const bgPos = cx * 0.3, bgOff = bgPos % 100;
    ctx.fillStyle = '#191a28';
    for (let i = -bgOff; i < GW + 100; i += 100) {
        const col = Math.round((i + bgPos) / 100);
        for (let j = 0; j < GH; j += 100) if ((col + j / 100) % 2 === 1) ctx.fillRect(Math.round(i), j, 100, 100);
    }
    ctx.fillStyle = '#20223a';
    const farOff = (cx * 0.15) % 160;
    for (let i = -160; i < GW + 160; i += 160) { ctx.fillRect(i - farOff, 330, 70, 200); ctx.fillRect(i - farOff + 80, 380, 50, 150); }
    ctx.fillStyle = '#2b2f52';
    for (let i = -160; i < GW + 160; i += 160) { ctx.fillRect(i - farOff + 10, 345, 6, 6); ctx.fillRect(i - farOff + 40, 375, 6, 6); ctx.fillRect(i - farOff + 95, 400, 6, 6); }

    ctx.save();
    let sx = shake > 0 ? (Math.random()-0.5)*shake : 0;
    let sy = shake > 0 ? (Math.random()-0.5)*shake : 0;
    ctx.translate(Math.round(-cx + sx), Math.round(sy));

    // Blocks
    blocks.forEach(b => {
        if (!b.solid) return;
        if (b.x + b.w < cx - 50 || b.x > cx + GW + 50) return; // Culling
        if (b.type === 'ground') { tileAt(SPR.tile.top, b.x, b.y); for (let yy = b.y + T; yy < b.y + b.h; yy += T) tileAt(SPR.tile.fill, b.x, yy); }
        else if (b.type === 'plat') { for (let xx = b.x; xx < b.x + b.w; xx += T) tileAt(SPR.tile.plat, xx, b.y); }
        else if (b.type === 'dest') {
            tileAt(SPR.tile.crate, b.x, b.y); tileAt(SPR.tile.crate, b.x, b.y + T);
            if (b.hp < 3) { ctx.fillStyle = '#2a1a0c'; ctx.fillRect(b.x+10, b.y+12, 4, 14); ctx.fillRect(b.x+14, b.y+24, 8, 4); }
            if (b.hp < 2) { ctx.fillRect(b.x+24, b.y+48, 4, 18); ctx.fillRect(b.x+18, b.y+62, 8, 4); }
            if (b.flash > 0) { b.flash--; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(b.x, b.y, b.w, b.h); }
        }
    });

    // Cages
    cages.forEach(c => {
        if (!c.active || c.x + c.w < cx - 50 || c.x > cx + GW + 50) return;
        const img = SPR.cage[Math.floor(tick / 20) % 2];
        ctx.drawImage(img, c.x - PX, c.y - PX, img.width * PX, img.height * PX);
        if (Math.floor(tick / 30) % 2) { ctx.fillStyle = '#ffe066'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.fillText('HELP!', c.x + c.w/2, c.y - 8); }
    });

    // Enemies
    enemies.forEach(e => {
        if (e.hp <= 0 || e.x + e.w < cx - 50 || e.x > cx + GW + 50) return;
        const set = SPR.bot[Math.floor((tick + e.x) / 5) % 4];
        const right = e.vx > 0, wf = e.flash > 0;
        const img = right ? (wf ? set.wr : set.r) : (wf ? set.wl : set.l);
        ctx.drawImage(img, Math.round(e.x + e.w/2 - img.width*PX/2), Math.round(e.y + e.h - 17*PX), img.width*PX, img.height*PX);
    });

    // Boss
    if (boss.active && !boss.dead) drawBoss();

    // Player
    if (state === 'PLAY' && (player.invuln === 0 || player.flash > 0 || Math.floor(tick / 5) % 2 === 0)) drawHero();

    // Bullets & Particles
    bullets.forEach(drawBullet);
    particles.forEach(p => { ctx.fillStyle = p.c; let s = Math.max(2, Math.round((p.life/p.max)*8)); ctx.fillRect(Math.round(p.x), Math.round(p.y), s, s); });

    // Popups
    ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
    popups.forEach(p => { ctx.fillStyle = '#000'; ctx.fillText(p.t, p.x + 2, p.y + 2); ctx.fillStyle = '#FFF'; ctx.fillText(p.t, p.x, p.y); });

    ctx.restore();
    updateHud();
}

// HUD lives in the page above the play area, so it stays readable on phones
const hud = { score: document.getElementById('h-score'), lives: document.getElementById('h-lives'), hero: document.getElementById('h-hero'), res: document.getElementById('h-res'), fill: document.getElementById('h-meter-fill') };
let hudKey = '';
function updateHud() {
    const k = score + '|' + lives + '|' + currentHero + '|' + rescues + '|' + cages.length;
    if (k === hudKey) return; hudKey = k;
    hud.score.textContent = 'SCORE ' + score.toString().padStart(6, '0');
    hud.lives.textContent = 'LIVES ' + Math.max(0, lives);
    hud.hero.textContent = HEROES[currentHero].name;
    hud.res.textContent = 'RESCUES ' + rescues + '/' + (cages.length || 6);
    hud.fill.style.width = (cages.length ? 100 * rescues / cages.length : 0) + '%';
}

// Title art: the three heroes
(function menuArt() {
    const m = document.getElementById('menu-art'), s = 3;
    m.width = 26 * 3 * s + 20; m.height = 26 * s; const g = m.getContext('2d'); g.imageSmoothingEnabled = false;
    SPR.heroes.forEach((set, i) => g.drawImage(set.idle0.r, i * (26 * s + 10), 0, 26 * s, 26 * s));
})();

// Fixed 60 steps per second, so 120Hz screens do not run at double speed
const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;
function loop(now) {
    let dt = now - lastT; lastT = now;
    if (dt > 250) dt = 250; if (dt < 0) dt = 0;
    if (Math.abs(dt - STEP) < 1.5) dt = STEP; // smooth out timer jitter on 60Hz screens
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { update(); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
