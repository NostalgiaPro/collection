<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101219">
<meta name="description" content="December 31, 1999. Finish the party jobs and reach the window before the ball drops. A free seasonal game in the Nostalgia Pro Arcade.">
<title>Before the Ball | Nostalgia Pro Arcade</title>
<link rel="stylesheet" href="../shared/shell.css">
<style>
/* Hidden test page only. The shared shell is untouched. */
html, body { background: #101219; }
#np-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.np-bar, .np-ov { touch-action: manipulation; }
.np-stage:not(:has(.np-ov.on)) { touch-action: none; }
.np-back { flex-shrink: 0; }
#np-ov-title .np-card, #np-ov-over .np-card, #np-ov-pause .np-card { overflow-wrap: anywhere; }
#nye-vcr {
  margin: -4px 0 12px;
  font: 400 13px/1.4 var(--display, "Press Start 2P", monospace);
  color: #ff4b3e;
  text-shadow: 0 0 8px rgba(255, 75, 62, .75);
  letter-spacing: 1px;
}
#nye-vcr .nye-colon { display: inline-block; animation: nye-colon 1s steps(1) infinite; }
#np-ov-title .np-card [data-act=start] {
  position: sticky; bottom: 0; z-index: 1;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 4px 0 16px var(--panel);
}
#np-ov-over .np-card { padding-bottom: 0; }
#np-ov-over .np-actions {
  position: sticky; bottom: 0; z-index: 1;
  padding: 8px 0 14px; background: var(--panel);
}
#np-ov-over .np-small { margin-bottom: 18px; }
@media (pointer: coarse), (max-width: 600px) {
  #np-ov-over .np-actions { padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
  #np-ov-over .np-small { margin-bottom: max(56px, env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 340px) { .np-bar { gap: 6px; padding: 6px; } .np-back { padding: 0 8px; } }
@keyframes nye-colon { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #nye-vcr .nye-colon { animation: none; }
}
</style>
</head>
<body>
<noscript><p style="padding:24px;font-family:monospace;color:#eceae2;background:#101219">Before the Ball needs JavaScript turned on. <a href="../index.html" style="color:#ffd23f">Back to the arcade</a></p></noscript>
<script src="../shared/config.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/trophy-list.js"></script>
<script src="boot.js"></script>
<script src="../shared/trophies.js"></script>
<script src="../shared/rewards.js"></script>
<script src="../shared/hiscores.js"></script>
<script src="game-2d.js"></script>
</body>
</html>
