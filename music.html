<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/retro.css">
<style>
  :root{
    --bg:#101219; --bg2:#171a23; --panel:#1d2029;
    --text:#eceae2; --dim:#8e93a2; --line:#2c3040; --hot:#ff4b3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(90,110,180,.14), transparent 62%),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 22px 90px}
  header{padding:44px 0 0}
  .wordmark{font-family:"Silkscreen",monospace;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0 0 22px}
  h1{font-family:"Press Start 2P",monospace;font-size:clamp(15px,3vw,28px);line-height:1.55;margin:0}
  .standfirst{color:var(--dim);font-size:15px;margin:14px 0 0;max-width:60ch}
  .navrow{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 0}
  .navbtn{
    display:inline-flex;align-items:center;border:2px solid var(--line);color:var(--dim);
    text-decoration:none;font-family:"Silkscreen",monospace;font-size:11px;
    letter-spacing:.05em;padding:9px 14px;border-radius:2px;
  }
  .navbtn:hover{border-color:var(--hot);color:var(--hot)}
  .navbtn.here{border-color:var(--hot);background:var(--hot);color:#12070a}

  .searchbar{margin:26px 0 0}
  #q{
    width:100%;background:#0a0c11;border:2px solid var(--line);border-bottom-color:var(--hot);
    color:var(--text);font-family:"IBM Plex Sans Condensed",sans-serif;
    font-size:clamp(19px,3vw,25px);font-weight:600;padding:14px 16px;border-radius:2px;
  }
  #q::placeholder{color:#565c6e;font-weight:500}
  #q:focus{outline:none;border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,75,62,.18)}

  .scores{display:flex;flex-wrap:wrap;margin:24px 0 0;border:2px solid var(--line);border-radius:2px;overflow:hidden}
  .score{flex:1 1 130px;padding:13px 15px;background:var(--bg2);border-right:1px solid var(--line)}
  .score:last-child{border-right:none}
  .score b{display:block;font-family:"Press Start 2P",monospace;font-size:18px;line-height:1}
  .score span{display:block;margin-top:8px;font-family:"Silkscreen",monospace;font-size:10px;letter-spacing:.09em;color:var(--dim)}

  section.shelf{margin:34px 0 0}
  .shelfhead{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:11px 14px;background:var(--c);border-radius:2px 2px 0 0;cursor:pointer;user-select:none;
  }
  .shelfhead h2{
    font-family:"IBM Plex Sans Condensed",sans-serif;font-size:22px;font-weight:700;
    margin:0;color:#0b0d12;letter-spacing:-.005em;display:flex;align-items:center;
  }
  .shelfhead .caret{
    font-family:"Silkscreen",monospace;font-size:30px;line-height:.7;margin-right:13px;
    transition:transform .12s ease;display:inline-block;position:relative;top:2px;
  }
  section.shelf.shut .caret{transform:rotate(-90deg)}
  section.shelf.shut ol{display:none}
  .shelfhead p{margin:0;font-family:"Silkscreen",monospace;font-size:11px;color:#0b0d12;opacity:.72}
  ol.items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-top:none;border-radius:0 0 2px 2px}
  ol.items li{
    display:flex;gap:13px;align-items:baseline;padding:9px 14px;
    border-bottom:1px solid rgba(44,48,64,.7);background:var(--bg2);
  }
  ol.items li:last-child{border-bottom:none}
  ol.items li:hover{background:var(--panel)}
  .mark{flex:none;width:10px;height:10px;background:var(--c);align-self:center}
  .title{flex:1 1 auto;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:17.5px;font-weight:600;line-height:1.3}
  .yr{flex:none;color:var(--dim);font-size:12px;font-family:"Silkscreen",monospace;white-space:nowrap}
  .shot{
    flex:none;width:38px;height:38px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;background:#0a0c11;
    align-self:center;cursor:zoom-in;
  }
  .title a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .title a:hover,.title a:focus-visible{border-bottom-color:var(--c);outline:none}
  .lightbox{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(6,7,11,.92);
  }
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:86vh;border:2px solid var(--line);border-radius:2px}
  .lightbox p{
    position:absolute;bottom:20px;left:0;right:0;text-align:center;
    color:var(--dim);font-family:"Silkscreen",monospace;font-size:12px;margin:0;
  }
  .empty{padding:44px 0;color:var(--dim)}
  .note{font-size:13px;color:var(--dim);margin-top:30px;max-width:62ch}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="wordmark">The Nostalgia Pro</p>
  <h1>Music</h1>
  <p class="standfirst">Records, tapes and discs. 73 of them.</p>
  <div class="navrow">
    <a class="navbtn" href="index.html">Games</a>
    <a class="navbtn " href="movies.html">Movies</a>
    <a class="navbtn " href="tv.html">TV</a>
    <a class="navbtn here " href="music.html">Music</a>
    <a class="navbtn " href="boardgames.html">Board games</a>
    <a class="navbtn" href="anniversaries.html">Anniversaries</a>
    <a class="navbtn" href="gaps.html">The gaps</a>
    <a class="navbtn" href="stats.html">The numbers</a>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search">
  </div>
  <div class="scores" id="scores"></div>
</header>

<div id="results"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Cover"><img alt=""><p>Click anywhere to close</p></div>

<p class="note">First pass, transcribed from photos of the shelf. Corrections to come.</p>
</div>

<script>
const ITEMS = [{"t": "Meat Loaf - Hits Out of Hell", "f": "Vinyl", "y": 1984}, {"t": "Beverly Hills Cop - Motion Picture Soundtrack", "f": "Cassette", "y": 1984}, {"t": "Beverly Hills Cop II - Motion Picture Soundtrack", "f": "Cassette", "y": 1987}, {"t": "C.W. McCall - Greatest Hits", "f": "Cassette", "y": null}, {"t": "Kenny Rogers - Heart of the Matter", "f": "Cassette", "y": 1985}, {"t": "Steppenwolf - Move Over", "f": "Cassette", "y": null}, {"t": "Van Morrison - The Best of Van Morrison", "f": "Cassette", "y": 1990}, {"t": "Adele - 21", "f": "CD", "y": 2011}, {"t": "Alan Jackson - Greatest Hits Volume II", "f": "CD", "y": 2003}, {"t": "Eminem - The Marshall Mathers LP", "f": "CD", "y": 2000}, {"t": "Forrest Gump - The Soundtrack", "f": "CD", "y": 1994}, {"t": "Madonna - The Immaculate Collection", "f": "CD", "y": 1990}, {"t": "Molly Hatchet - Greatest Hits", "f": "CD", "y": 1990}, {"t": "Nickelback - Silver Side Up", "f": "CD", "y": 2001}, {"t": "Smashing Pumpkins", "f": "CD", "y": null}, {"t": "Mortal Kombat: Annihilation - Original Motion Picture Soundtrack", "f": "Cassette", "y": 1997}, {"t": "Classic Soft Rock: The Air That I Breathe", "f": "CD", "y": null}, {"t": "Neil Diamond - Hot August Night II", "f": "CD", "y": 1987}, {"t": "Genesis - Platinum Collection", "f": "CD", "y": null}, {"t": "Counting Crows - Films About Ghosts: The Best Of...", "f": "CD", "y": null}, {"t": "Sheryl Crow - C'mon, C'mon", "f": "CD", "y": 2002}, {"t": "Sheryl Crow - Tuesday Night Music Club", "f": "CD", "y": 1993}, {"t": "Space Jam - Music From and Inspired by the Motion Picture", "f": "CD", "y": 1996}, {"t": "Staind - Break the Cycle", "f": "CD", "y": 2001}, {"t": "Team America World Police - Soundtrack", "f": "CD", "y": 2004}, {"t": "U2 - All That You Can't Leave Behind", "f": "CD", "y": 2000}, {"t": "Warrant - Cherry Pie", "f": "CD", "y": 1990}, {"t": "Creed - Human Clay", "f": "CD", "y": 1999}, {"t": "Creed - Weathered", "f": "CD", "y": 2001}, {"t": "David Bowie - Best of Bowie", "f": "CD", "y": null}, {"t": "Die Another Day - Music From the MGM Motion Picture", "f": "CD", "y": 2002}, {"t": "The Moody Blues - Days of Future Passed", "f": "CD", "y": 1967}, {"t": "Blues Traveler - Four", "f": "CD", "y": 1994}, {"t": "John Cena - You Can't See Me", "f": "CD", "y": 2005}, {"t": "Huey Lewis and the News - Sports", "f": "CD", "y": 1983}, {"t": "A Tribute to Bruce Springsteen", "f": "CD", "y": null}, {"t": "Limp Bizkit", "f": "CD", "y": null}, {"t": "Puddle of Mudd - CD-R", "f": "CD", "y": null}, {"t": "Puddle of Mudd - Life on Display", "f": "CD", "y": 2003}, {"t": "DMX - Music", "f": "CD", "y": null}, {"t": "3 Doors Down - Bonus DVD", "f": "CD", "y": null}, {"t": "Toad the Wet Sprocket", "f": "CD", "y": null}, {"t": "Switchfoot - The Beautiful Letdown", "f": "CD", "y": 2003}, {"t": "Green Day - American Idiot", "f": "CD", "y": 2004}, {"t": "Johnny Cash", "f": "CD", "y": null}, {"t": "Avril Lavigne - Let Go", "f": "CD", "y": 2002}, {"t": "Spider-Man - Soundtrack", "f": "CD", "y": 2002}, {"t": "Deep Blue Something - Home", "f": "CD", "y": 1995}, {"t": "Franz Ferdinand - Franz Ferdinand", "f": "CD", "y": 2004}, {"t": "Rod Stewart - It Had to Be You: The Great American Songbook", "f": "CD", "y": 2002}, {"t": "Garth Brooks - Jackpot 777", "f": "CD", "y": null}, {"t": "Alice in Chains - MTV Unplugged", "f": "CD", "y": 1996}, {"t": "Barenaked Ladies - Stunt", "f": "CD", "y": 1998}, {"t": "Batman Forever - Soundtrack", "f": "CD", "y": 1995}, {"t": "Britney Spears - ...Baby One More Time", "f": "CD", "y": 1999}, {"t": "Brooks & Dunn - Brand New Man", "f": "CD", "y": 1991}, {"t": "Def Leppard - Best Of", "f": "CD", "y": null}, {"t": "Del Amitri - Twisted", "f": "CD", "y": 1995}, {"t": "Eagles - Their Greatest Hits 1971-1975", "f": "CD", "y": 1976}, {"t": "Eagles - Hotel California", "f": "CD", "y": 1976}, {"t": "Eagle-Eye Cherry - Desireless", "f": "CD", "y": 1997}, {"t": "EMF - Schubert Dip", "f": "CD", "y": 1991}, {"t": "Garth Brooks - The Magic of Christmas", "f": "CD", "y": 1999}, {"t": "Hulk Hogan - Hulk Rules", "f": "CD", "y": 1995}, {"t": "Interview with the Vampire - Soundtrack", "f": "CD", "y": 1994}, {"t": "John Fogerty - Centerfield", "f": "CD", "y": 1985}, {"t": "Last Action Hero - Soundtrack", "f": "CD", "y": 1993}, {"t": "Linkin Park - Hybrid Theory", "f": "CD", "y": 2000}, {"t": "Matchbox Twenty - Yourself or Someone Like You", "f": "CD", "y": 1996}, {"t": "Muppets From Space - Music From the Motion Picture", "f": "CD", "y": 1999}, {"t": "Natalie Imbruglia - Left of the Middle", "f": "CD", "y": 1997}, {"t": "New Kids on the Block - 10", "f": "CD", "y": 2013}, {"t": "Paula Cole - This Fire", "f": "CD", "y": 1996}];
const COLORS = {"VHS": "#e0a33a", "LaserDisc": "#c85cc8", "DVD": "#4a78d6", "Blu-ray": "#2f6fe0", "Vinyl": "#d3d0c8", "Cassette": "#c97a3a", "CD": "#8fb8d6", "Board games": "#4aab7a"};
const fold = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
/* Cover art lives in the same images folder: images/<title>-<format>.jpg */
const slug = x => (x.t + "-" + x.f).toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const wiki = t => "https://en.wikipedia.org/w/index.php?search=" +
  encodeURIComponent(t + " album");
ITEMS.forEach(x => x.key = fold(x.t));

const formats = [];
for (const x of ITEMS) {
  let f = formats.find(g => g.name === x.f);
  if (!f) { f = {name:x.f, items:[], color:COLORS[x.f]||"#8e93a2"}; formats.push(f); }
  f.items.push(x);
}
formats.forEach(f => f.items.sort((a,b) => a.t.localeCompare(b.t)));

let query = "";
const shut = new Set();
let first = true;

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function drawScores(){
  const yrs = ITEMS.filter(x => x.y).map(x => x.y);
  const cells = [[ITEMS.length,"albums"],[formats.length,"formats"]];
  if (yrs.length) cells.push([Math.min(...yrs),"oldest"],[Math.max(...yrs),"newest"]);
  document.getElementById("scores").innerHTML = cells
    .map(([n,l]) => `<div class="score"><b>${n}</b><span>${l}</span></div>`).join("");
}

function render(){
  if (first) { formats.forEach(f => shut.add(f.name)); first = false; }
  const html = formats.map(f => {
    const hits = query ? f.items.filter(x => x.key.includes(query)) : f.items;
    if (!hits.length) return "";
    const isShut = !query && shut.has(f.name);
    return `<section class="shelf${isShut?" shut":""}" style="--c:${f.color}">
      <div class="shelfhead" data-f="${esc(f.name)}">
        <h2><span class="caret">\u25be</span>${esc(f.name)}</h2>
        <p>${hits.length} of ${f.items.length}</p></div>
      <ol class="items">${hits.map(x =>
        `<li>` +
        `<img class="shot" loading="lazy" src="images/${slug(x)}.jpg" alt="${esc(x.t)}"` +
        ` onerror="this.remove()">` +
        `<i class="mark"></i>` +
        `<span class="title"><a href="${wiki(x.t)}" target="_blank" rel="noopener">${esc(x.t)}</a></span>` +
        (x.y ? `<span class="yr">${x.y}</span>` : "") + `</li>`).join("")}</ol>
    </section>`;
  }).join("");
  document.getElementById("results").innerHTML = html || `<p class="empty">Nothing matches that.</p>`;
  drawScores();
}

document.getElementById("results").addEventListener("click", e => {
  const h = e.target.closest(".shelfhead"); if (!h || query) return;
  const name = h.dataset.f;
  if (shut.has(name)) shut.delete(name); else shut.add(name);
  render();
});
document.getElementById("q").addEventListener("input", e => {
  query = fold(e.target.value.trim()); render();
});
const lb = document.getElementById("lightbox");
document.addEventListener("click", e => {
  const shot = e.target.closest(".shot");
  if (shot) { lb.querySelector("img").src = shot.src; lb.classList.add("on"); return; }
  if (e.target.closest(".lightbox")) lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

render();
</script>
<script>
/* Installable, and the whole collection works offline once you've opened it. */
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
<script>
/* 1996 mode. The class does all the work, retro.css does the rest. */
(function(){
  var on = false;
  try { on = localStorage.getItem("np-1996") === "1"; } catch (e) {}
  if (on) document.body.classList.add("y1996");

  var b = document.createElement("button");
  b.id = "y1996btn";
  b.type = "button";
  b.textContent = on ? "Back to now" : "1996 mode";
  b.addEventListener("click", function(){
    var nowOn = document.body.classList.toggle("y1996");
    b.textContent = nowOn ? "Back to now" : "1996 mode";
    try { localStorage.setItem("np-1996", nowOn ? "1" : "0"); } catch (e) {}
  });

  var foot = document.querySelector("footer") || document.querySelector(".wrap");
  var wrap = document.createElement("p");
  wrap.style.cssText = "text-align:center;margin:18px 0 0";
  wrap.appendChild(b);
  foot.appendChild(wrap);

  /* The counter is a joke, but it should at least count. */
  var el = document.getElementById("hits");
  if (el) {
    var n = 0;
    try { n = parseInt(localStorage.getItem("np-hits") || "0", 10) || 0; } catch (e) {}
    n += 1;
    try { localStorage.setItem("np-hits", String(n)); } catch (e) {}
    el.textContent = String(14273 + n).padStart(7, "0");
  }
})();
</script>
</body>
</html>
